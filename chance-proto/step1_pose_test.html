<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Step 1 · Baby avatar test</title>
<style>
  html, body { margin: 0; height: 100%; background: #fff; color: #121417; font-family: -apple-system, Helvetica, Arial, sans-serif; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
  #hud { position: fixed; left: 16px; top: 14px; font: 12px ui-monospace, Menlo, monospace; color: #8a8f98; line-height: 1.6; }
  #hud b { color: #121417; font-weight: 500; }
  #start { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); font: 500 14px ui-monospace, Menlo, monospace;
           padding: 14px 22px; border: 1.5px solid #121417; border-radius: 999px; background: #fff; cursor: pointer; }
  video { display: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<video id="v" playsinline muted></video>
<div id="hud">Step 1 · baby avatar test<br><span id="status">waiting for camera</span> · <b id="fps">–</b> fps</div>
<button id="start">Start camera</button>

<script type="module">
// Step 1, test B: does a drawn baby follow your body in real time?
// Run a local server in this folder:  python -m http.server 8000
// then open http://localhost:8000/step1_pose_test.html in Chrome.
import { PoseLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/vision_bundle.mjs";

const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const video = document.getElementById("v"), statusEl = document.getElementById("status"), fpsEl = document.getElementById("fps");
let W, H, landmarker = null, lastVideoTime = -1, frames = 0, fpsT = performance.now();

function resize() { const d = devicePixelRatio || 1; W = innerWidth; H = innerHeight; cv.width = W * d; cv.height = H * d; ctx.setTransform(d, 0, 0, d, 0, 0); }
addEventListener("resize", resize); resize();

document.getElementById("start").onclick = async (e) => {
  e.target.remove();
  statusEl.textContent = "loading pose model…";
  const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/wasm");
  landmarker = await PoseLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",
      delegate: "GPU"
    },
    runningMode: "VIDEO", numPoses: 1
  });
  statusEl.textContent = "starting camera…";
  video.srcObject = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 }, audio: false });
  await video.play();
  statusEl.textContent = "tracking";
  requestAnimationFrame(loop);
};

// map a landmark to the screen, mirrored like a mirror, fitted to the window
function toScreen(p) {
  const vw = video.videoWidth, vh = video.videoHeight, s = Math.max(W / vw, H / vh);
  const ox = (W - vw * s) / 2, oy = (H - vh * s) / 2;
  return { x: ox + (1 - p.x) * vw * s, y: oy + p.y * vh * s, v: p.visibility ?? 1 };
}
const lerp = (a, b, t) => ({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t });
let smooth = null;

function loop() {
  requestAnimationFrame(loop);
  if (video.currentTime === lastVideoTime) return;
  lastVideoTime = video.currentTime;
  const res = landmarker.detectForVideo(video, performance.now());

  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, W, H);
  drawCameraThumb();

  if (res.landmarks && res.landmarks[0]) {
    const raw = res.landmarks[0].map(toScreen);
    // light smoothing so the baby doesn't jitter
    smooth = smooth ? raw.map((p, i) => ({ x: smooth[i].x + (p.x - smooth[i].x) * .55, y: smooth[i].y + (p.y - smooth[i].y) * .55, v: p.v })) : raw;
    drawBaby(smooth);
    statusEl.textContent = "tracking";
  } else statusEl.textContent = "step into frame";

  frames++;
  const now = performance.now();
  if (now - fpsT > 500) { fpsEl.textContent = Math.round(frames * 1000 / (now - fpsT)); frames = 0; fpsT = now; }
}

// A baby drawn from YOUR skeleton: big head, short limbs, soft round body.
function drawBaby(L) {
  const sh = lerp(L[11], L[12], .5), hp = lerp(L[23], L[24], .5);
  const shoulderW = Math.hypot(L[11].x - L[12].x, L[11].y - L[12].y);
  const torsoLen = Math.hypot(hp.x - sh.x, hp.y - sh.y) * .75;
  const down = { x: (hp.x - sh.x), y: (hp.y - sh.y) }, dl = Math.hypot(down.x, down.y) || 1;
  const hipC = { x: sh.x + down.x / dl * torsoLen, y: sh.y + down.y / dl * torsoLen };
  const limb = (a, b, k) => lerp(a, b, k);

  ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = "#121417"; ctx.fillStyle = "#fff";

  // legs (short and chubby)
  for (const [hi, ki, ai] of [[23, 25, 27], [24, 26, 28]]) {
    const hip = { x: hipC.x + (L[hi].x - hp.x) * .8, y: hipC.y + (L[hi].y - hp.y) * .8 };
    if (L[ki].v < .4) continue;
    const knee = limb(hip, { x: hip.x + (L[ki].x - L[hi].x), y: hip.y + (L[ki].y - L[hi].y) }, .55);
    const ankle = L[ai].v > .4 ? limb(knee, { x: knee.x + (L[ai].x - L[ki].x), y: knee.y + (L[ai].y - L[ki].y) }, .5) : knee;
    stroke([hip, knee, ankle], shoulderW * .28);
  }
  // body
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.ellipse((sh.x + hipC.x) / 2, (sh.y + hipC.y) / 2, shoulderW * .62, torsoLen * .62, Math.atan2(down.y, down.x) - Math.PI / 2, 0, Math.PI * 2);
  ctx.fill(); ctx.stroke();
  // arms
  for (const [si, ei, wi] of [[11, 13, 15], [12, 14, 16]]) {
    if (L[ei].v < .4) continue;
    const s = L[si], e = limb(s, L[ei], .6), w = L[wi].v > .4 ? limb(e, { x: e.x + (L[wi].x - L[ei].x), y: e.y + (L[wi].y - L[ei].y) }, .55) : e;
    stroke([s, e, w], shoulderW * .2);
  }
  // head: big, sitting on the shoulders, turned toward the nose
  const neck = lerp(sh, L[0], .35), headR = shoulderW * .62;
  const headC = { x: neck.x + (L[0].x - sh.x) * .55, y: neck.y - headR * .55 };
  ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(headC.x, headC.y, headR, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  // face follows where your nose points
  const fx = (L[0].x - neck.x) * .25, eyeY = headC.y + headR * .05;
  ctx.fillStyle = "#121417";
  for (const k of [-1, 1]) { ctx.beginPath(); ctx.arc(headC.x + fx + k * headR * .3, eyeY, headR * .06, 0, Math.PI * 2); ctx.fill(); }
  ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(headC.x + fx, eyeY + headR * .28, headR * .16, .2, Math.PI - .2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(headC.x - headR * .05, headC.y - headR); ctx.quadraticCurveTo(headC.x + headR * .25, headC.y - headR * 1.35, headC.x + headR * .1, headC.y - headR * 1.1); ctx.stroke();
}
function stroke(pts, w) {
  // outlined limb: draw thick ink, then a slightly thinner white core
  ctx.lineWidth = w + 6; ctx.strokeStyle = "#121417"; poly(pts);
  ctx.lineWidth = w; ctx.strokeStyle = "#fff"; poly(pts);
  ctx.strokeStyle = "#121417";
}
function poly(pts) { ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y); for (const p of pts.slice(1)) ctx.lineTo(p.x, p.y); ctx.stroke(); }

function drawCameraThumb() {
  // small mirrored camera preview so you can see what the tracker sees
  const tw = 200, th = tw * video.videoHeight / video.videoWidth, x = W - tw - 16, y = H - th - 16;
  ctx.save(); ctx.globalAlpha = .9; ctx.translate(x + tw, y); ctx.scale(-1, 1); ctx.drawImage(video, 0, 0, tw, th); ctx.restore();
  ctx.strokeStyle = "#e6e8eb"; ctx.lineWidth = 1; ctx.strokeRect(x, y, tw, th);
}
</script>
</body>
</html>
