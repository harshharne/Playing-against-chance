<title>Where You're Born</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
/* Layout: one screen. Pixel world map fills the top; a quiet control strip sits under it. Deliberately single dark theme. */
:root {
  --ink: #0b0820;
  --cabinet: #151036;
  --glass: #07051a;
  --grid: #2a2160;
  --text: #e9e6ff;
  --dim: #8a84bf;
  --cyan: #3ef0ff;
  --pink: #ff4fa8;
  --yellow: #ffd84a;
  --r1: #ff8a3d;
  --r2: #ffd84a;
  --r3: #3ef0ff;
  --r4: #6dff9c;
  --r5: #c38bff;
  --r6: #6f97ff;
  --pixel: "Press Start 2P", "Courier New", monospace;
  --term: "VT323", "Courier New", monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; box-sizing: border-box; background: var(--ink); color: var(--text); font-family: var(--term); font-size: 20px; padding-inline: 16px; padding-block: 12px; overflow: hidden; }
.cab { max-width: 1180px; height: 100%; margin: 0 auto; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 12px; }

header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: center; gap: 6px 14px; text-align: center; }
.marquee { font-family: var(--pixel); font-size: 10px; letter-spacing: 0.18em; color: var(--dim); }
h1 { margin: 0; font-family: var(--pixel); font-size: clamp(14px, 2.6vw, 22px); line-height: 1.3; color: var(--yellow); text-shadow: 3px 3px 0 var(--pink); }

.screen { position: relative; min-height: 0; border: 4px solid var(--grid); border-radius: 14px; background: var(--glass); box-shadow: 0 0 0 4px var(--cabinet), 0 0 40px rgba(255, 216, 74, 0.06) inset; overflow: hidden; }
.screen::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0 2px, rgba(0,0,0,0.2) 2px 3px); }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: pointer; touch-action: manipulation; }
.overlay { position: absolute; z-index: 1; font-family: var(--pixel); font-size: 9px; line-height: 1.7; letter-spacing: 0.06em; pointer-events: none; }
.overlay.tl { top: 10px; left: 12px; color: var(--dim); }
.overlay.tr { top: 10px; right: 12px; color: var(--dim); text-align: right; }
.overlay.bl { bottom: 10px; left: 12px; color: var(--text); }
.overlay b { font-weight: 400; color: var(--cyan); font-variant-numeric: tabular-nums; }
.overlay b.warn { color: var(--yellow); }
#hoverName { color: var(--hc, var(--text)); }

.strip { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr) auto; align-items: center; gap: 18px; }
.wishes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.wishes button { display: flex; align-items: center; gap: 8px; min-width: 0; text-align: left; font-family: var(--pixel); font-size: 8px; line-height: 1.5; padding: 8px 10px; background: transparent; color: var(--dim); border: 2px solid var(--grid); border-radius: 6px; cursor: pointer; }
.wishes button i { width: 10px; height: 10px; flex: none; background: var(--c); border-radius: 2px; }
.wishes button span { flex: 1; min-width: 0; }
.wishes button small { font-size: 8px; font-variant-numeric: tabular-nums; }
.wishes button:hover:not(:disabled) { color: var(--text); border-color: var(--c); }
.wishes button[aria-pressed="true"] { color: var(--text); border-color: var(--pink); background: #22103a; }
.wishes button:disabled { cursor: default; }

.status { display: flex; flex-direction: column; justify-content: center; gap: 6px; min-height: 3.6em; text-align: center; }
.status .big { font-family: var(--pixel); font-size: 11px; line-height: 1.7; color: var(--cyan); text-wrap: balance; }
.status .big.result { font-size: 13px; color: var(--yellow); text-shadow: 2px 2px 0 var(--pink); }
.status .small { font-size: 20px; line-height: 1.1; color: var(--text); text-wrap: balance; }
.status .small:empty { display: none; }
.blink { animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }

.controls { display: flex; flex-direction: column; align-items: stretch; gap: 8px; }
.go { font-family: var(--pixel); font-size: 13px; padding: 15px 22px; background: var(--yellow); color: var(--ink); border: 0; border-radius: 8px; box-shadow: 0 6px 0 #b8902a; cursor: pointer; letter-spacing: 0.06em; white-space: nowrap; }
.go:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 2px 0 #b8902a; }
.go:disabled { background: var(--grid); color: var(--dim); box-shadow: 0 6px 0 var(--cabinet); cursor: default; }
.ghost { font-family: var(--pixel); font-size: 8px; padding: 8px 10px; background: transparent; color: var(--dim); border: 2px solid var(--grid); border-radius: 6px; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--cyan); outline-offset: 2px; }

@media (max-width: 860px) and (orientation: portrait) {
  .cab { grid-template-rows: auto auto auto; align-content: center; }
  .screen { height: calc((100vw - 40px) * 0.375 + 64px); }
}
@media (max-width: 860px) {
  .strip { grid-template-columns: minmax(0, 1fr); gap: 10px; }
  .wishes { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .controls { flex-direction: row; justify-content: center; }
  .status { min-height: 3.2em; }
}
@media (max-width: 860px) and (orientation: landscape) {
  .strip { grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); }
  .controls { grid-column: 1 / -1; }
}
@media (prefers-reduced-motion: reduce) { .blink { animation: none; } }
</style>

<div class="cab">
  <header>
    <div class="marquee">PLAYING AGAINST CHANCE</div>
    <h1>WHERE YOU'RE BORN</h1>
  </header>

  <div class="screen" id="screen">
    <canvas id="map" aria-label="Pixel world map in six regions with 100 bright dots, one for every 100 babies born today. Tap a region to wish to be born there."></canvas>
    <div class="overlay tl">LIVES <b id="hudLives">0</b> &nbsp; WISHES MET <b id="hudWins">0</b></div>
    <div class="overlay tr">CHANCE BY <b id="hudSource">RANDOM.ORG</b></div>
    <div class="overlay bl" aria-live="polite"><span id="hoverName">EACH DOT IS 1 OF EVERY 100 BABIES BORN TODAY</span> <b id="hoverCount"></b></div>
  </div>

  <div class="strip">
    <div class="wishes" id="wishes" role="group" aria-label="Wish to be born in"></div>
    <div class="status" aria-live="polite">
      <div class="big" id="statusBig"><span class="blink">MAKE A WISH: WHERE DO YOU WANT TO BE BORN?</span></div>
      <div class="small" id="statusSmall"></div>
    </div>
    <div class="controls">
      <button class="go" id="goBtn" disabled>BE BORN!</button>
      <button class="ghost" id="soundBtn" aria-pressed="true">SOUND ON</button>
    </div>
  </div>
</div>

    "..............................................55555.............................................................................................................",

    "..............................................555...............................................................................................................",
    "...............................................555.............................................................................................................."],"dots":[[81,32,1],[83,30,1],[82,32,1],[83,31,1],[83,33,1],[85,30,1],[86,37,1],[89,38,1],[92,36,1],[97,31,1],[96,30,1],[97,32,1],[97,38,1],[94,36,1],[94,35,1],[96,36,1],[80,29,1],[97,42,1],[86,39,1],[101,43,1],[79,32,1],[78,33,1],[85,33,1],[76,29,1],[79,30,1],[92,47,1],[86,30,1],[99,34,1],[95,41,1],[72,29,1],[74,31,1],[114,22,2],[112,27,2],[119,25,2],[115,29,2],[114,29,2],[114,27,2],[115,23,2],[117,24,2],[113,23,2],[112,25,2],[114,25,2],[115,26,2],[116,24,2],[113,27,2],[118,26,2],[120,23,2],[113,25,2],[114,31,2],[109,24,2],[113,21,2],[112,21,2],[111,20,2],[111,22,2],[120,24,2],[120,25,2],[110,20,2],[102,19,2],[110,17,2],[117,23,2],[131,17,3],[133,21,3],[130,25,3],[126,21,3],[130,21,3],[130,20,3],[127,22,3],[127,38,3],[129,38,3],[123,33,3],[133,29,3],[128,26,3],[142,19,3],[124,29,3],[126,30,3],[144,38,3],[93,22,4],[93,23,4],[94,28,4],[99,20,4],[94,17,4],[81,19,4],[99,28,4],[76,20,4],[100,24,4],[58,46,5],[62,41,5],[35,26,5],[34,26,5],[47,33,5],[45,40,5],[54,50,5],[47,17,6],[27,20,6],[36,20,6],[96,10,6],[79,12,6],[85,12,6],[84,15,6],[89,12,6]]};
  const REGIONS = [
    null,
    { id: 1, name: "SUB-SAHARAN AFRICA",      short: "SUB-SAHARAN AFRICA",  c: "#ff8a3d" },
    { id: 2, name: "SOUTH & CENTRAL ASIA",    short: "SOUTH & C. ASIA",     c: "#ffd84a" },
    { id: 3, name: "EAST ASIA & PACIFIC",     short: "EAST ASIA & PACIFIC", c: "#3ef0ff" },
    { id: 4, name: "MIDDLE EAST & N. AFRICA", short: "MIDDLE EAST & N. AFR", c: "#6dff9c" },
    { id: 5, name: "LATIN AMERICA",           short: "LATIN AMERICA",       c: "#c38bff" },
    { id: 6, name: "EUROPE & N. AMERICA",     short: "EUROPE & N. AMERICA", c: "#6f97ff" },
  ];
  const { W: GW, H: GH, rows: ROWS, dots: DOTS } = WORLD;
  const count = [0, 0, 0, 0, 0, 0, 0];
  for (const d of DOTS) count[d[2]]++;

  // random.org JSON-RPC API (v4). Anyone who can open this file can read this key.
  const RANDOM_ORG_API_KEY = (() => { try { return localStorage.getItem("RANDOM_ORG_KEY") || ""; } catch (e) { return ""; } })();
  const RANDOM_ORG_API = "https://api.random.org/json-rpc/4/invoke";
  const RANDOM_ORG_PLAIN = "https://www.random.org/integers/?num=1&min=1&max=100&col=1&base=10&format=plain&rnd=new";

  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const $ = (id) => document.getElementById(id);
  const canvas = $("map"), ctx = canvas.getContext("2d"), screenEl = $("screen");
  const wishesEl = $("wishes"), goBtn = $("goBtn"), soundBtn = $("soundBtn");
  const statusBig = $("statusBig"), statusSmall = $("statusSmall");
  const hoverName = $("hoverName"), hoverCount = $("hoverCount");
  const hud = { lives: $("hudLives"), wins: $("hudWins"), source: $("hudSource") };

  // land cells by region, and a lookup grid
  const cellRegion = new Uint8Array(GW * GH);
  const landCells = [];
  for (let y = 0; y < GH; y++) for (let x = 0; x < GW; x++) {
    const ch = ROWS[y][x];
    if (ch !== ".") { cellRegion[y * GW + x] = +ch; landCells.push([x, y, +ch]); }
  }

  let state = "pick";       // pick | drawing | result
  let wish = null, hover = null, landed = null, hot = null;
  let lives = 0, wins = 0, landedAt = 0;

  // ---------- geometry ----------
  let CW = 600, CH = 300, cs = 4, ox = 0, oy = 0;
  function resize() {
    const r = screenEl.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    CW = r.width - 8; CH = r.height - 8;
    canvas.width = Math.round(CW * dpr); canvas.height = Math.round(CH * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const padY = 30;                       // room for the overlay text
    cs = Math.min(CW / GW, (CH - padY * 2) / GH);
    ox = (CW - cs * GW) / 2;
    oy = (CH - cs * GH) / 2;
  }
  if ("ResizeObserver" in window) new ResizeObserver(resize).observe(screenEl);
  window.addEventListener("resize", resize);

  function regionAt(px, py) {
    const x = Math.floor((px - ox) / cs), y = Math.floor((py - oy) / cs);
    // look in a small neighbourhood so islands and coasts are easy to hit
    let best = 0, bestD = 9;
    for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) {
      const nx = x + dx, ny = y + dy;
      if (nx < 0 || ny < 0 || nx >= GW || ny >= GH) continue;
      const r = cellRegion[ny * GW + nx];
      const d = dx * dx + dy * dy;
      if (r && d < bestD) { best = r; bestD = d; }
    }
    return best || null;
  }

  // ---------- wishes ----------
  for (let id = 1; id <= 6; id++) {
    const R = REGIONS[id];
    const b = document.createElement("button");
    b.id = "wish-" + id;
    b.style.setProperty("--c", R.c);
    b.setAttribute("aria-pressed", "false");
    b.innerHTML = "<i></i><span></span><small></small>";
    b.querySelector("span").textContent = R.short;
    b.querySelector("small").textContent = count[id] + "%";
    b.addEventListener("click", () => choose(id));
    b.addEventListener("mouseenter", () => setHover(id));
    b.addEventListener("mouseleave", () => setHover(null));
    wishesEl.appendChild(b);
  }

  function setHover(id) {
    hover = id;
    const show = id || (state === "pick" ? wish : null);
    if (show) {
      hoverName.textContent = REGIONS[show].name;
      hoverName.style.setProperty("--hc", REGIONS[show].c);

    if (state === "result") reset();
    if (state !== "pick") return;
    wish = id;
    wishesEl.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.id === "wish-" + id)));

    const id = regionAt(e.clientX - r.left, e.clientY - r.top);

    else if (state === "result") reset();

  // ---------- chance ----------
  async function withTimeout(fn, ms) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), ms);
    try { return await fn(ctrl.signal); } finally { clearTimeout(timer); }
  }
  async function fromApi() {
    if (!RANDOM_ORG_API_KEY) throw new Error("no key");
    return withTimeout(async (signal) => {
      const res = await fetch(RANDOM_ORG_API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ jsonrpc: "2.0", method: "generateIntegers", params: { apiKey: RANDOM_ORG_API_KEY, n: 1, min: 1, max: 100, replacement: true }, id: Date.now() }),
        signal,
      });
      const json = await res.json();
      if (json.error) throw new Error(json.error.message);
      return json.result.random.data[0];
    }, 5000);
  }
  async function fromPlain() {
    return withTimeout(async (signal) => {
      const res = await fetch(RANDOM_ORG_PLAIN, { signal, cache: "no-store" });
      if (!res.ok) throw new Error("status " + res.status);
      return parseInt((await res.text()).trim(), 10);
    }, 4000);
  }
  function fromLocal() {
    const buf = new Uint32Array(1);
    let v;
    do { crypto.getRandomValues(buf); v = buf[0]; } while (v >= Math.floor(0x100000000 / 100) * 100);
    return (v % 100) + 1;
  }
  async function drawChance() {
    for (const [label, fn] of [["RANDOM.ORG API", fromApi], ["RANDOM.ORG", fromPlain]]) {
      try {
        const n = await fn();
        if (n >= 1 && n <= 100) { hud.source.textContent = label; hud.source.classList.remove("warn"); return n; }
      } catch (err) { console.warn(label + " failed:", err.message || err); }
    }
    hud.source.textContent = "LOCAL RNG";
    hud.source.classList.add("warn");
    return fromLocal();

  // ---------- a life ----------
  const sleep = (ms) => new Promise(r => setTimeout(r, ms));

  goBtn.addEventListener("click", async () => {
    if (state === "result") { reset(); return; }
    if (state !== "pick" || wish == null) return;
    unlockAudio();
    state = "drawing";
    goBtn.disabled = true;
    wishesEl.querySelectorAll("button").forEach(b => b.disabled = true);
    setStatus("A NEW LIFE IS ON ITS WAY...", "", true);
    const n = await drawChance();             // which of the 100 babies you are
    await hopTo(n - 1);
    land(n - 1);
  });

  // the light jumps from baby to baby across the world, slowing down, and stops on the one chance chose
  async function hopTo(target) {
    setStatus("WHERE...", "", false);
    const hops = reduceMotion ? 3 : 26;
    let last = -1;
    for (let i = 0; i < hops; i++) {
      let k;
      do { k = Math.floor(Math.random() * DOTS.length); } while (k === last || k === target);
      hot = k; last = k;
      beep(260 + DOTS[k][2] * 90, 0.035);
      await sleep(reduceMotion ? 120 : 45 + Math.pow(i / hops, 3) * 330);
    }
    hot = target;
    beep(260 + DOTS[target][2] * 90, 0.05);
    await sleep(reduceMotion ? 150 : 420);
  }

  function land(idx) {
    state = "result";
    hot = null;
    landed = idx;
    landedAt = performance.now();
    lives++;
    const r = DOTS[idx][2];
    const got = r === wish;
    if (got) wins++;
    hud.lives.textContent = lives;
    hud.wins.textContent = wins;
    setStatus(
      "YOU WERE BORN IN " + REGIONS[r].name,
      got ? "Your wish came true. " + count[r] + " of every 100 babies are born here."
          : "You wished for " + titleCase(REGIONS[wish].name) + ". " + (count[wish] <= 10 ? "Only " : "") + count[wish] + " of every 100 babies are born there.",
      false, true
    );
    goBtn.textContent = "AGAIN";
    goBtn.disabled = false;
    wishesEl.querySelectorAll("button").forEach(b => b.disabled = false);
    if (got) [523, 659, 784, 1046].forEach((f, i) => beep(f, 0.14, "square", i * 0.12));
    else [440, 392, 349, 330].forEach((f, i) => beep(f, 0.18, "triangle", i * 0.15));
  }

  function reset() {
    state = "pick";
    wish = null; landed = null; hot = null;
    goBtn.textContent = "BE BORN!";
    goBtn.disabled = true;
    wishesEl.querySelectorAll("button").forEach(b => { b.disabled = false; b.setAttribute("aria-pressed", "false"); });
    setStatus("MAKE A WISH: WHERE DO YOU WANT TO BE BORN?", "", true);
    setHover(hover);
  }

  function titleCase(s) { return s.toLowerCase().replace(/(^|[\s&.])(\w)/g, (m, a, b) => a + b.toUpperCase()); }
  function setStatus(big, small, blink, result) {
    statusBig.className = "big" + (result ? " result" : "");
    statusBig.innerHTML = "";
    const s = document.createElement("span");
    if (blink) s.className = "blink";
    s.textContent = big;
    statusBig.appendChild(s);
    statusSmall.textContent = small || "";
  }

  // ---------- sound ----------
  let audio = null, soundOn = true;
  function unlockAudio() {
    // Browsers can pause audio after a while (another tab, a sleeping screen, an idle frame), so wake it on every tap and before every sound.
    try {
      if (!audio) {
        audio = new (window.AudioContext || window.webkitAudioContext)();
        audio.__master = audio.createGain();
        audio.__master.gain.value = 0.9;
        audio.__master.connect(audio.destination);
      }
      if (audio.state !== "running") audio.resume().catch(() => {});
    } catch (e) { audio = null; }
  }
  ["pointerdown", "keydown", "touchstart"].forEach(ev => document.addEventListener(ev, unlockAudio, { passive: true }));
  document.addEventListener("visibilitychange", () => { if (!document.hidden && audio) audio.resume().catch(() => {}); });
  function beep(freq, dur, type = "square", delay = 0) {
    if (!soundOn || !audio) return;
    if (audio.state !== "running") audio.resume().catch(() => {});
    const t = audio.currentTime + delay;
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.06, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(audio.__master || audio.destination);
    o.start(t); o.stop(t + dur + 0.03);
    o.onended = () => { o.disconnect(); g.disconnect(); };
  }
  soundBtn.addEventListener("click", () => {
    unlockAudio();
    soundOn = !soundOn;
    soundBtn.textContent = soundOn ? "SOUND ON" : "SOUND OFF";
    soundBtn.setAttribute("aria-pressed", String(soundOn));
    if (soundOn) beep(880, 0.05);
  });

  // ---------- drawing ----------
  function rgba(hex, a) {
    const n = parseInt(hex.slice(1), 16);
    return "rgba(" + (n >> 16) + "," + ((n >> 8) & 255) + "," + (n & 255) + "," + a + ")";
  }

  function frame(now) {
    const t = now / 1000;
    ctx.clearRect(0, 0, CW, CH);
    const gap = Math.max(1, cs * 0.18);
    const s = cs - gap;
    const landedRegion = landed != null ? DOTS[landed][2] : null;

    // land
    for (const [x, y, r] of landCells) {
      let a = 0.2;
      if (state === "result") a = r === landedRegion ? 0.5 : (r === wish ? 0.24 : 0.1);
      else if (r === wish) a = 0.55;
      if (r === hover && state !== "drawing") a = Math.max(a, 0.42);
      ctx.fillStyle = rgba(REGIONS[r].c, a);
      ctx.fillRect(ox + x * cs, oy + y * cs, s, s);
    }

    // babies
    DOTS.forEach(([x, y, r], i) => {
      if (i === hot || i === landed) return;
      let col = "#e9e6ff", a = 0.85;
      if (r === wish && state !== "result") col = "#ff4fa8";
      if (state === "result") a = r === landedRegion ? 0.7 : 0.25;
      else if (!reduceMotion) a = 0.6 + 0.35 * Math.sin(t * 2.2 + i * 1.7);
      ctx.fillStyle = rgba(col, a);
      ctx.fillRect(ox + x * cs, oy + y * cs, s, s);
    });

    if (hot != null) drawMarker(DOTS[hot], "#ffd84a", 0, t);
    if (landed != null) drawMarker(DOTS[landed], "#ffd84a", now - landedAt, t, true);
    requestAnimationFrame(frame);
  }

  function drawMarker([x, y], col, since, t, isYou) {
    const cx = ox + (x + 0.5) * cs, cy = oy + (y + 0.5) * cs;
    const gap = Math.max(1, cs * 0.18);
    ctx.fillStyle = col;
    ctx.fillRect(ox + x * cs - gap, oy + y * cs - gap, cs + gap, cs + gap);
    ctx.strokeStyle = col;
    ctx.lineWidth = 2;
    // pixel crosshair brackets
    const R = cs * 2.4;
    ctx.beginPath();
    for (const [sx, sy] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) {
      ctx.moveTo(cx + sx * R, cy + sy * R * 0.4);
      ctx.lineTo(cx + sx * R, cy + sy * R);
      ctx.lineTo(cx + sx * R * 0.4, cy + sy * R);
    }
    ctx.stroke();
    if (isYou) {
      if (!reduceMotion && since < 1600) {
        const k = since / 1600;
        ctx.strokeStyle = rgba("#ffd84a", 1 - k);
        ctx.beginPath(); ctx.arc(cx, cy, R + k * cs * 10, 0, Math.PI * 2); ctx.stroke();
      }
      const fs = Math.max(8, Math.round(cs * 1.6));
      ctx.font = fs + "px 'Press Start 2P', monospace";
      ctx.textAlign = "center"; ctx.textBaseline = "bottom";
      const label = "YOU";
      const w = ctx.measureText(label).width + 10;
      const ly = cy - R - 6 + (reduceMotion ? 0 : Math.sin(t * 4) * 2);
      ctx.fillStyle = "#ff4fa8";
      ctx.fillRect(cx - w / 2, ly - fs - 6, w, fs + 8);
      ctx.fillStyle = "#0b0820";
      ctx.fillText(label, cx, ly);
    }
  }

  resize();
  requestAnimationFrame(frame);
})();
</script>
