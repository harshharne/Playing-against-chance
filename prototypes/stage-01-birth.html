<title>Stage 01 Birth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
/* Layout: one arcade cabinet screen, odds strip under it, picker below. Deliberately single dark theme. */
:root {
  --ink: #0b0820;
  --cabinet: #151036;
  --glass: #07051a;
  --grid: #2a2160;
  --text: #e9e6ff;
  --dim: #8a84bf;
  --cyan: #3ef0ff;
  --pink: #ff4fa8;
  --yellow: #ffd84a;
  --red: #ff5a4f;
  --void: #3a3360;
  --pixel: "Press Start 2P", "Courier New", monospace;
  --term: "VT323", "Courier New", monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--ink);
  color: var(--text);
  font-family: var(--term);
  font-size: 20px;
  padding-inline: 16px;
  padding-block: 20px 32px;
}
.cab { max-width: 620px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
header { display: flex; flex-direction: column; gap: 8px; text-align: center; }
.marquee { font-family: var(--pixel); font-size: 10px; letter-spacing: 0.18em; color: var(--dim); }
h1 {
  margin: 0;
  font-family: var(--pixel);
  font-size: clamp(18px, 5vw, 28px);
  line-height: 1.3;
  color: var(--yellow);
  text-shadow: 3px 3px 0 var(--pink);
  text-wrap: balance;
}
.hud { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; font-family: var(--pixel); font-size: 9px; line-height: 1.6; }
.hud div { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.hud span { color: var(--dim); letter-spacing: 0.08em; }
.hud b { color: var(--cyan); font-weight: 400; font-size: 13px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.hud b.warn { color: var(--yellow); }
@media (max-width: 460px) { .hud { grid-template-columns: repeat(2, 1fr); } }

.screen {
  position: relative;
  border: 4px solid var(--grid);
  border-radius: 14px;
  background: var(--glass);
  box-shadow: 0 0 0 4px var(--cabinet), 0 0 40px rgba(62, 240, 255, 0.12) inset;
  overflow: hidden;
  aspect-ratio: 1 / 1;
  max-width: 100%;
}
canvas { display: block; width: 100%; height: 100%; cursor: crosshair; touch-action: manipulation; }
.screen::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0 2px, rgba(0,0,0,0.22) 2px 3px);
}

/* odds strip: every possible outcome as one slot */
.odds { display: flex; flex-direction: column; gap: 8px; }
.odds-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; font-family: var(--pixel); font-size: 9px; color: var(--dim); letter-spacing: 0.08em; }
.odds-head b { color: var(--text); font-weight: 400; }
.slots { display: grid; grid-template-columns: repeat(var(--count, 12), 1fr); gap: 4px; }
.slot {
  font-family: var(--pixel);
  font-size: 9px;
  height: 34px;
  display: grid; place-items: center;
  border-radius: 4px;
  border: 2px solid var(--grid);
  background: var(--cabinet);
  color: var(--cyan);
  font-variant-numeric: tabular-nums;
  min-width: 0;
}
.slot.void { color: var(--dim); background: var(--glass); border-style: dashed; }
.slot.mine { color: var(--pink); border-color: var(--pink); }
.slot.hot { background: var(--cyan); color: var(--ink); border-color: var(--cyan); }
.slot.void.hot { background: var(--dim); color: var(--ink); border-color: var(--dim); }
.slot.land { background: var(--yellow); color: var(--ink); border-color: var(--yellow); border-style: solid; }
.slot.void.land { background: var(--red); border-color: var(--red); }
.tuner { display: flex; align-items: center; justify-content: center; gap: 10px; font-family: var(--pixel); font-size: 9px; color: var(--dim); }
.tuner button {
  font-family: var(--pixel); font-size: 12px;
  width: 34px; height: 30px;
  background: var(--cabinet); color: var(--text);
  border: 2px solid var(--grid); border-radius: 6px; cursor: pointer;
}
.tuner button:disabled { opacity: 0.4; cursor: default; }
.tuner output { color: var(--text); font-size: 12px; min-width: 2ch; text-align: center; }

.result { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
.result .big { font-family: var(--pixel); font-size: clamp(16px, 4.6vw, 22px); color: var(--yellow); text-shadow: 2px 2px 0 var(--pink); }
.result .small { font-size: 22px; color: var(--text); }
.result.lose .big { color: var(--red); text-shadow: 2px 2px 0 var(--ink); }
.result.none .big { color: var(--dim); text-shadow: 2px 2px 0 var(--ink); }

.ticker { font-family: var(--pixel); font-size: 11px; line-height: 1.8; color: var(--cyan); min-height: 2.2em; text-align: center; }
.ticker .blink { animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }

.picker { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
.picker button {
  font-family: var(--pixel); font-size: 14px;
  padding: 14px 0;
  background: var(--cabinet); color: var(--text);
  border: 2px solid var(--grid); border-radius: 8px; cursor: pointer;
}
.picker button:hover:not(:disabled) { border-color: var(--cyan); }
.picker button[aria-pressed="true"] { background: var(--pink); border-color: var(--yellow); color: var(--ink); }
.picker button:disabled { opacity: 0.45; cursor: default; }
@media (max-width: 400px) { .picker { grid-template-columns: repeat(3, 1fr); } }

.controls { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.go {
  font-family: var(--pixel); font-size: 14px;
  padding: 16px 26px;
  background: var(--yellow); color: var(--ink);
  border: 0; border-radius: 8px;
  box-shadow: 0 6px 0 #b8902a; cursor: pointer; letter-spacing: 0.06em;
}
.go:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 2px 0 #b8902a; }
.go:disabled { background: var(--grid); color: var(--dim); box-shadow: 0 6px 0 var(--cabinet); cursor: default; }
.ghost {
  font-family: var(--pixel); font-size: 10px;
  padding: 14px 16px;
  background: transparent; color: var(--dim);
  border: 2px solid var(--grid); border-radius: 8px; cursor: pointer;
}
button:focus-visible { outline: 3px solid var(--cyan); outline-offset: 2px; }
.foot { font-size: 18px; color: var(--dim); text-align: center; line-height: 1.3; }
.foot b { color: var(--text); font-weight: 400; }
@media (prefers-reduced-motion: reduce) { .ticker .blink { animation: none; } }
</style>

<div class="cab">
  <header>
    <div class="marquee">PLAYING AGAINST CHANCE</div>
    <h1>STAGE 01 · BIRTH</h1>
  </header>

  <div class="hud" aria-live="polite">
    <div><span>TRIES</span><b id="hudTries">0</b></div>
    <div><span>YOU BORN</span><b id="hudBorn">0</b></div>
    <div><span>YOUR PICK</span><b id="hudPick">--</b></div>
    <div><span>CHANCE BY</span><b id="hudSource">RANDOM.ORG</b></div>
  </div>

  <div class="screen">
    <canvas id="pond" aria-label="Six numbered sperm swimming around an egg. Tap one to choose it."></canvas>
  </div>

  <div class="odds">
    <div class="odds-head">
      <span>ALL POSSIBLE OUTCOMES</span>
      <span>YOUR ODDS <b id="oddsYou">1 IN 12</b> · NOBODY <b id="oddsNone">50%</b></span>
    </div>
    <div class="slots" id="slots" aria-label="Each slot is one equally likely outcome"></div>
    <div class="tuner">
      <span>NOT-BORN SLOTS</span>
      <button id="lessVoid" aria-label="Fewer not-born outcomes">−</button>
      <output id="voidCount">6</output>
      <button id="moreVoid" aria-label="More not-born outcomes">+</button>
    </div>
  </div>

  <div class="result" id="result" hidden aria-live="polite">
    <div class="big" id="resultBig"></div>
    <div class="small" id="resultSmall"></div>
  </div>

  <div class="ticker" id="ticker"><span class="blink">TAP A SWIMMER TO CHOOSE WHO YOU ARE</span></div>

  <div class="picker" id="picker" role="group" aria-label="Choose a sperm by number"></div>

  <div class="controls">
    <button class="go" id="goBtn" disabled>SWIM!</button>
    <button class="ghost" id="soundBtn" aria-pressed="true">SOUND ON</button>
  </div>

  <p class="foot">Six swimmers, one egg, and some draws where nobody makes it.<br>Every slot above is equally likely.</p>
</div>

<script>
(() => {
  const SPERM = 6;
  const VOID_MIN = 0, VOID_MAX = 18;
  let voidSlots = 6;                       // outcomes where nobody is born
  const total = () => SPERM + voidSlots;

  // random.org JSON-RPC API (v4). Anyone who can open this file can read this key.
  const RANDOM_ORG_API_KEY = (() => { try { return localStorage.getItem("RANDOM_ORG_KEY") || ""; } catch (e) { return ""; } })();
  const RANDOM_ORG_API = "https://api.random.org/json-rpc/4/invoke";
  const plainUrl = () => "https://www.random.org/integers/?num=1&min=1&max=" + total() + "&col=1&base=10&format=plain&rnd=new";

  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const $ = (id) => document.getElementById(id);
  const canvas = $("pond"), ctx = canvas.getContext("2d");
  const picker = $("picker"), goBtn = $("goBtn"), soundBtn = $("soundBtn"), ticker = $("ticker");
  const slotsEl = $("slots"), lessVoid = $("lessVoid"), moreVoid = $("moreVoid"), voidCount = $("voidCount");
  const resultBox = $("result"), resultBig = $("resultBig"), resultSmall = $("resultSmall");
  const hud = { tries: $("hudTries"), born: $("hudBorn"), pick: $("hudPick"), source: $("hudSource") };
  const COLORS = { cyan: "#3ef0ff", pink: "#ff4fa8", yellow: "#ffd84a", text: "#e9e6ff", dim: "#8a84bf", egg: "#ffcf9e" };

  let W = 600, H = 600, cx = 300, cy = 300, eggR = 60;
  let state = "pick";                      // pick | drawing | race | result
  let picked = null;
  let outcome = null;                      // 1..total()
  let winner = null;                       // swimmer number, or null if nobody is born
  let tries = 0, born = 0;
  let raceStart = 0, fertilizedAt = 0, sealedAt = 0;
  const SWIM_MS = reduceMotion ? 900 : 2600;
  const ENTER_MS = reduceMotion ? 400 : 1100;

  const pad = (n) => String(n).padStart(2, "0");

  // ---------- swimmers ----------
  const swimmers = [];
  for (let i = 0; i < SPERM; i++) {
    swimmers.push({
      n: i + 1,
      angle: (i / SPERM) * Math.PI * 2 + Math.random() * 0.3,
      orbit: 0.6 + Math.random() * 0.25,
      drift: (Math.random() < 0.5 ? -1 : 1) * (0.1 + Math.random() * 0.1),
      phase: Math.random() * Math.PI * 2,
      x: 0, y: 0, heading: 0, alpha: 1,
      startX: 0, startY: 0, ctrlX: 0, ctrlY: 0, entryAngle: 0, reach: 1,
    });
  }

  function resize() {
    const rect = canvas.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(rect.width * dpr);
    canvas.height = Math.round(rect.height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    W = rect.width; H = rect.height; cx = W / 2; cy = H / 2;
    eggR = Math.max(36, W * 0.11);
  }
  window.addEventListener("resize", resize);

  // ---------- odds strip ----------
  function renderSlots() {
    slotsEl.innerHTML = "";
    slotsEl.style.setProperty("--count", Math.min(total(), 12));
    for (let i = 1; i <= total(); i++) {
      const d = document.createElement("div");
      d.className = "slot" + (i > SPERM ? " void" : "") + (i === picked ? " mine" : "");
      d.textContent = i <= SPERM ? pad(i) : "✕";
      d.title = i <= SPERM ? "Swimmer " + i + " is born" : "Nobody is born";
      slotsEl.appendChild(d);
    }
    voidCount.textContent = voidSlots;
    $("oddsYou").textContent = "1 IN " + total();
    $("oddsNone").textContent = Math.round((voidSlots / total()) * 100) + "%";
    lessVoid.disabled = state !== "pick" || voidSlots <= VOID_MIN;
    moreVoid.disabled = state !== "pick" || voidSlots >= VOID_MAX;
  }
  lessVoid.addEventListener("click", () => { if (state === "pick" && voidSlots > VOID_MIN) { voidSlots--; renderSlots(); beep(440, 0.04); } });
  moreVoid.addEventListener("click", () => { if (state === "pick" && voidSlots < VOID_MAX) { voidSlots++; renderSlots(); beep(330, 0.04); } });

  // light runs along the slots like a roulette, then lands on the drawn outcome
  function spinTo(target) {
    return new Promise((resolve) => {
      const cells = [...slotsEl.children];
      const laps = reduceMotion ? 0 : 2;
      const steps = laps * cells.length + (target - 1);
      let i = 0;
      const tick = () => {
        cells.forEach(c => c.classList.remove("hot"));
        const idx = i % cells.length;
        cells[idx].classList.add("hot");
        beep(idx < SPERM ? 700 : 300, 0.03, "square");
        if (i >= steps) {
          cells[idx].classList.remove("hot");
          cells[idx].classList.add("land");
          setTimeout(resolve, 350);
          return;
        }
        i++;
        const remaining = steps - i;
        const delay = 40 + Math.max(0, 14 - remaining) * 22;   // slow down near the end
        setTimeout(tick, delay);
      };
      tick();
    });
  }

  // ---------- picking ----------
  for (let i = 1; i <= SPERM; i++) {
    const b = document.createElement("button");
    b.id = "pick-" + i;
    b.textContent = pad(i);
    b.setAttribute("aria-pressed", "false");
    b.addEventListener("click", () => choose(i));
    picker.appendChild(b);
  }

  function choose(n) {
    if (state !== "pick") return;
    picked = n;
    hud.pick.textContent = "#" + pad(n);
    picker.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.id === "pick-" + n)));
    goBtn.disabled = false;
    renderSlots();
    setTicker("YOU ARE SWIMMER #" + pad(n) + ". PRESS SWIM!", true);
    beep(660, 0.06);
  }

  canvas.addEventListener("click", (e) => {
    if (state === "result") { reset(); return; }
    if (state !== "pick") return;
    const r = canvas.getBoundingClientRect();
    const x = e.clientX - r.left, y = e.clientY - r.top;
    let best = null, bestD = Infinity;
    for (const s of swimmers) {
      const d = Math.hypot(s.x - x, s.y - y);
      if (d < bestD) { bestD = d; best = s; }
    }
    if (best && bestD < Math.max(34, W * 0.08)) choose(best.n);
  });

  // ---------- chance ----------
  async function withTimeout(fn, ms) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), ms);
    try { return await fn(ctrl.signal); } finally { clearTimeout(timer); }
  }
  async function fromApi(max) {
    if (!RANDOM_ORG_API_KEY) throw new Error("no key");
    return withTimeout(async (signal) => {
      const res = await fetch(RANDOM_ORG_API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          jsonrpc: "2.0", method: "generateIntegers",
          params: { apiKey: RANDOM_ORG_API_KEY, n: 1, min: 1, max, replacement: true },
          id: Date.now(),
        }),
        signal,
      });
      const json = await res.json();
      if (json.error) throw new Error(json.error.message);
      return json.result.random.data[0];
    }, 5000);
  }
  async function fromPlain() {
    return withTimeout(async (signal) => {
      const res = await fetch(plainUrl(), { signal, cache: "no-store" });
      if (!res.ok) throw new Error("status " + res.status);
      return parseInt((await res.text()).trim(), 10);
    }, 4000);
  }
  function fromLocal(max) {
    const buf = new Uint32Array(1);
    let v;
    do { crypto.getRandomValues(buf); v = buf[0]; } while (v >= Math.floor(0x100000000 / max) * max);
    return (v % max) + 1;
  }
  async function drawChance() {
    const max = total();
    for (const [label, fn] of [["RANDOM.ORG API", () => fromApi(max)], ["RANDOM.ORG", fromPlain]]) {
      try {
        const n = await fn();
        if (n >= 1 && n <= max) { hud.source.textContent = label; hud.source.classList.remove("warn"); return n; }
      } catch (err) { console.warn(label + " failed:", err.message || err); }
    }
    hud.source.textContent = "LOCAL RNG";
    hud.source.classList.add("warn");
    return fromLocal(max);
  }

  goBtn.addEventListener("click", async () => {
    if (state === "result") { reset(); return; }
    if (state !== "pick" || picked == null) return;
    unlockAudio();
    state = "drawing";
    goBtn.disabled = true;
    picker.querySelectorAll("button").forEach(b => b.disabled = true);
    renderSlots();
    setTicker("ASKING THE UNIVERSE...", true);
    outcome = await drawChance();
    await spinTo(outcome);
    winner = outcome <= SPERM ? outcome : null;
    startRace();
  });

  function startRace() {
    tries++;
    hud.tries.textContent = tries;
    fertilizedAt = 0; sealedAt = 0;
    for (const s of swimmers) {
      s.alpha = 1;
      s.startX = s.x; s.startY = s.y;
      s.entryAngle = Math.atan2(s.y - cy, s.x - cx);
      const side = Math.random() < 0.5 ? -1 : 1;
      const off = Math.hypot(s.x - cx, s.y - cy) * 0.35 * side;
      s.ctrlX = (s.x + cx) / 2 - Math.sin(s.entryAngle) * off;
      s.ctrlY = (s.y + cy) / 2 + Math.cos(s.entryAngle) * off;
      s.reach = 0.55 + Math.random() * 0.3;      // used only when nobody makes it
    }
    raceStart = performance.now();
    state = "race";
    setTicker(winner ? "SWIMMER #" + pad(winner) + " IS ON ITS WAY..." : "THEY ALL TRY...", false);
    raceMusic(winner ? SWIM_MS + ENTER_MS : SWIM_MS);
  }

  function finishRace() {
    state = "result";
    let cls, big, small;
    if (winner === null) {
      cls = "none"; big = "NOBODY WAS BORN";
      small = "The egg was never reached. Not you, not anyone.";
      [330, 262, 196, 131].forEach((f, i) => beep(f, 0.22, "triangle", i * 0.18));
    } else if (winner === picked) {
      born++;
      cls = "win"; big = "YOU WERE BORN!";
      small = "Swimmer #" + pad(winner) + " made it. Against the odds, here you are.";
      [523, 659, 784, 1046].forEach((f, i) => beep(f, 0.14, "square", i * 0.12));
    } else {
      cls = "lose"; big = "NOT THIS TIME";
      small = "Swimmer #" + pad(winner) + " was born. You were #" + pad(picked) + ".";
      [392, 330, 262, 196].forEach((f, i) => beep(f, 0.18, "triangle", i * 0.15));
    }
    hud.born.textContent = born;
    resultBox.hidden = false;
    resultBox.className = "result " + cls;
    resultBig.textContent = big;
    resultSmall.textContent = small;
    setTicker("TAP THE SCREEN OR PRESS AGAIN", true);
    goBtn.textContent = "AGAIN";
    goBtn.disabled = false;
  }

  function reset() {
    state = "pick";
    picked = null; winner = null; outcome = null;
    fertilizedAt = 0; sealedAt = 0;
    for (const s of swimmers) s.alpha = 1;
    resultBox.hidden = true;
    goBtn.textContent = "SWIM!";
    goBtn.disabled = true;
    hud.pick.textContent = "--";
    picker.querySelectorAll("button").forEach(b => { b.disabled = false; b.setAttribute("aria-pressed", "false"); });
    renderSlots();
    setTicker("TAP A SWIMMER TO CHOOSE WHO YOU ARE", true);
  }

  function setTicker(msg, blink) {
    ticker.innerHTML = "";
    const s = document.createElement("span");
    if (blink) s.className = "blink";
    s.textContent = msg;
    ticker.appendChild(s);
  }

  // ---------- sound ----------
  let audio = null, soundOn = true;
  function unlockAudio() {
    if (!audio) { try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audio = null; } }
    if (audio && audio.state === "suspended") audio.resume();
  }
  function beep(freq, dur, type = "square", delay = 0) {
    if (!soundOn) return;
    unlockAudio();
    if (!audio) return;
    const t = audio.currentTime + delay;
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.07, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(audio.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }
  function raceMusic(ms) {
    const notes = [262, 330, 392, 330, 294, 349, 440, 349, 330, 392, 494, 392, 523];
    const step = ms / 1000 / notes.length;
    notes.forEach((f, i) => beep(f, step * 0.8, "square", i * step));
  }
  soundBtn.addEventListener("click", () => {
    soundOn = !soundOn;
    soundBtn.textContent = soundOn ? "SOUND ON" : "SOUND OFF";
    soundBtn.setAttribute("aria-pressed", String(soundOn));
    if (soundOn) beep(880, 0.05);
  });

  // ---------- motion ----------
  const ease = (t) => 1 - Math.pow(1 - t, 3);
  const easeInOut = (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
  const swimmerSize = () => Math.max(9, W * 0.022);

  function orbit(s, t, slow) {
    const maxR = Math.min(W, H) / 2 - 30;
    s.angle += s.drift * 0.016 * (reduceMotion ? 0.3 : 1) * slow;
    const wob = reduceMotion ? 0 : Math.sin(t * 1.3 + s.phase) * 8;
    const r = s.orbit * maxR + wob;
    const nx = cx + Math.cos(s.angle) * r, ny = cy + Math.sin(s.angle) * r;
    s.heading = Math.atan2(ny - s.y, nx - s.x) || s.heading;
    s.x = nx; s.y = ny;
  }

  function curveStep(s, k, t, edgeX, edgeY) {
    const a = 1 - k;
    const nx = a * a * s.startX + 2 * a * k * s.ctrlX + k * k * edgeX;
    const ny = a * a * s.startY + 2 * a * k * s.ctrlY + k * k * edgeY;
    const hx = nx - s.x, hy = ny - s.y;
    if (Math.hypot(hx, hy) > 0.01) s.heading = Math.atan2(hy, hx);
    const sway = reduceMotion ? 0 : Math.sin(t * 10 + s.phase) * 2.5 * (1 - k);
    s.x = nx - Math.sin(s.heading) * sway;
    s.y = ny + Math.cos(s.heading) * sway;
  }

  function update(now) {
    const t = now / 1000;
    const racing = state === "race" || state === "result";
    const el = now - raceStart;
    const size = swimmerSize();

    // nobody-born run: everyone rushes in and falls short
    if (racing && winner === null) {
      const k = Math.min(1, el / SWIM_MS);
      for (const s of swimmers) {
        const edgeX = cx + Math.cos(s.entryAngle) * (eggR + size * 1.2);
        const edgeY = cy + Math.sin(s.entryAngle) * (eggR + size * 1.2);
        if (k < 1) curveStep(s, easeInOut(k) * s.reach, t, edgeX, edgeY);
        else s.alpha = Math.max(0.15, s.alpha - 0.01);
      }
      if (k >= 1 && !sealedAt) sealedAt = now;
      if (state === "race" && el >= SWIM_MS + 400) finishRace();
      return;
    }

    for (const s of swimmers) {
      if (racing && s.n === winner) continue;
      orbit(s, t, fertilizedAt ? 0.25 : 1);
      if (fertilizedAt) s.alpha = Math.max(0.22, s.alpha - 0.012);
    }
    if (!racing) return;

    const w = swimmers[winner - 1];
    const dirX = Math.cos(w.entryAngle), dirY = Math.sin(w.entryAngle);
    const edgeR = eggR + size * 1.2;
    if (el < SWIM_MS) {
      curveStep(w, easeInOut(el / SWIM_MS), t, cx + dirX * edgeR, cy + dirY * edgeR);
    } else {
      const k = Math.min(1, (el - SWIM_MS) / ENTER_MS);
      const shove = reduceMotion ? 0 : Math.sin(k * Math.PI * 6) * size * 0.25 * (1 - k);
      const r = edgeR + (eggR * 0.28 - edgeR) * ease(k) + shove;
      w.x = cx + dirX * r; w.y = cy + dirY * r;
      w.heading = w.entryAngle + Math.PI;
      if (k >= 1 && !fertilizedAt) {
        fertilizedAt = now;
        beep(1200, 0.08); beep(1600, 0.1, "square", 0.08);
      }
    }
    if (state === "race" && el >= SWIM_MS + ENTER_MS) finishRace();
  }

  // ---------- drawing ----------
  function drawEgg(t, now) {
    const pulse = reduceMotion ? 0 : Math.sin(t * 2) * 2;
    const done = !!fertilizedAt, sealed = !!sealedAt;
    const glow = ctx.createRadialGradient(cx, cy, eggR * 0.2, cx, cy, eggR * 2.1);
    glow.addColorStop(0, done ? "rgba(255,216,74,0.38)" : sealed ? "rgba(90,80,140,0.18)" : "rgba(255,143,184,0.22)");
    glow.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(cx, cy, eggR * 2.1, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = done ? "#ffe3a6" : sealed ? "#7d7499" : COLORS.egg;
    ctx.beginPath(); ctx.arc(cx, cy, eggR + (sealed ? 0 : pulse * 0.5), 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = done ? "rgba(255,170,40,0.45)" : sealed ? "rgba(40,30,80,0.35)" : "rgba(255,79,168,0.35)";
    ctx.beginPath(); ctx.arc(cx - eggR * 0.18, cy - eggR * 0.12, eggR * 0.32, 0, Math.PI * 2); ctx.fill();

    if (done) {
      const k = Math.min(1, (now - fertilizedAt) / 900);
      if (k < 1 && !reduceMotion) {
        ctx.strokeStyle = "rgba(255,216,74," + (1 - k) + ")";
        ctx.lineWidth = 4 * (1 - k) + 1;
        ctx.beginPath(); ctx.arc(cx, cy, eggR + 4 + k * eggR * 0.9, 0, Math.PI * 2); ctx.stroke();
      }
      ctx.strokeStyle = COLORS.yellow; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(cx, cy, eggR + 3, 0, Math.PI * 2); ctx.stroke();
    }
  }

  function drawBody(s, t, color) {
    const size = swimmerSize();
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.rotate(s.heading);
    ctx.strokeStyle = color;
    ctx.lineWidth = Math.max(2, size * 0.28);
    ctx.lineCap = "round";
    ctx.beginPath();
    const settled = fertilizedAt && s.n === winner;
    const speed = settled ? 2 : state === "race" ? 16 : 6;
    for (let i = 0; i <= 16; i++) {
      const u = i / 16;
      const x = -size * 0.9 - u * size * 5;
      const y = (reduceMotion ? 0 : Math.sin(t * speed + s.phase - u * 6)) * size * 0.6 * u * (settled ? 0.3 : 1);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.ellipse(0, 0, size * 1.15, size * 0.8, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawTag(s, color, solid) {
    const size = swimmerSize();
    const fs = Math.max(9, Math.round(W * 0.02));
    ctx.font = fs + "px 'Press Start 2P', monospace";
    ctx.textAlign = "center"; ctx.textBaseline = "bottom";
    const label = pad(s.n), ly = s.y - size * 1.4;
    if (solid) {
      const w = ctx.measureText(label).width + 8;
      ctx.fillStyle = color;
      ctx.fillRect(s.x - w / 2, ly - fs - 5, w, fs + 6);
      ctx.fillStyle = "#0b0820";
    } else {
      ctx.fillStyle = COLORS.text;
    }
    ctx.fillText(label, s.x, ly);
  }

  function drawSwimmer(s, t) {
    const isPick = s.n === picked;
    const color = isPick ? COLORS.pink : COLORS.cyan;
    ctx.save();
    ctx.globalAlpha = s.alpha;
    drawBody(s, t, color);
    drawTag(s, color, isPick);
    if (isPick && state === "pick") {
      ctx.strokeStyle = COLORS.pink; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(s.x, s.y, swimmerSize() * 2.4 + (reduceMotion ? 0 : Math.sin(t * 6) * 2), 0, Math.PI * 2); ctx.stroke();
    }
    ctx.restore();
  }

  // the one chance chose: solid outside the egg, faint through the membrane inside it
  function drawWinner(s, t) {
    ctx.save();
    ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.arc(cx, cy, eggR, 0, Math.PI * 2, true);
    ctx.clip("evenodd");
    drawBody(s, t, COLORS.yellow);
    ctx.restore();

    ctx.save();
    ctx.beginPath(); ctx.arc(cx, cy, eggR, 0, Math.PI * 2); ctx.clip();
    ctx.globalAlpha = 0.5;
    drawBody(s, t, "#c98a00");
    ctx.restore();

    if (Math.hypot(s.x - cx, s.y - cy) >= eggR) {
      drawTag(s, COLORS.yellow, true);
    } else {
      const fs = Math.max(10, Math.round(eggR * 0.2));
      ctx.font = fs + "px 'Press Start 2P', monospace";
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillStyle = "#0b0820";
      ctx.fillText("#" + pad(s.n), cx, cy + eggR * 0.55);
    }
  }

  function drawGrid() {
    ctx.strokeStyle = "rgba(42,33,96,0.55)";
    ctx.lineWidth = 1;
    const step = Math.max(24, W / 16);
    for (let x = step; x < W; x += step) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
    for (let y = step; y < H; y += step) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  }

  function frame(now) {
    const t = now / 1000;
    update(now);
    ctx.fillStyle = "#07051a";
    ctx.fillRect(0, 0, W, H);
    drawGrid();
    drawEgg(t, now);
    const racing = state === "race" || state === "result";
    const order = swimmers.slice().sort((a, b) => (a.n === picked) - (b.n === picked));
    for (const s of order) {
      if (racing && s.n === winner) continue;
      drawSwimmer(s, t);
    }
    if (racing && winner) drawWinner(swimmers[winner - 1], t);
    requestAnimationFrame(frame);
  }

  resize();
  renderSlots();
  update(performance.now());
  requestAnimationFrame(frame);
})();
</script>
