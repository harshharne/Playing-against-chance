<title>Till Chance Do Us Part</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
/* Layout: one screen. The scene on the left (stage, wedding, then the house), the match cards and the seven years on the right. Single dark theme. */
:root {
  --ink: #0b0820;
  --cabinet: #151036;
  --glass: #07051a;
  --grid: #2a2160;
  --text: #e9e6ff;
  --dim: #8a84bf;
  --cyan: #3ef0ff;
  --pink: #ff4fa8;
  --yellow: #ffd84a;
  --marigold: #ff9a2e;
  --green: #6dff9c;
  --red: #ff5a4f;
  --pixel: "Press Start 2P", "Courier New", monospace;
  --term: "VT323", "Courier New", monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; box-sizing: border-box; background: var(--ink); color: var(--text); font-family: var(--term); font-size: 20px; padding-inline: 16px; padding-block: 12px; overflow: hidden; }
.cab { max-width: 1180px; height: 100%; margin: 0 auto; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 10px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: center; gap: 6px 14px; text-align: center; }
.marquee { font-family: var(--pixel); font-size: 10px; letter-spacing: 0.18em; color: var(--dim); }
h1 { margin: 0; font-family: var(--pixel); font-size: clamp(14px, 2.6vw, 22px); line-height: 1.3; color: var(--marigold); text-shadow: 3px 3px 0 var(--cabinet), 5px 5px 0 var(--pink); }

.stage { min-height: 0; display: grid; grid-template-columns: auto minmax(300px, 430px); justify-content: center; align-items: center; gap: 24px; }
.screen { position: relative; box-sizing: border-box; width: var(--sz, 400px); height: var(--sz, 400px); max-width: 100%; border: 4px solid var(--grid); border-radius: 14px; background: var(--glass); box-shadow: 0 0 0 4px var(--cabinet), 0 0 40px rgba(255, 154, 46, 0.08) inset; overflow: hidden; }
.screen::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0 2px, rgba(0,0,0,0.2) 2px 3px); }
canvas { display: block; width: 100%; height: 100%; cursor: pointer; }
.caption { position: absolute; top: 12px; left: 0; right: 0; text-align: center; font-family: var(--pixel); font-size: 9px; letter-spacing: 0.1em; color: var(--dim); pointer-events: none; z-index: 1; }
.caption b { font-weight: 400; color: var(--marigold); }

.panel { min-width: 0; min-height: 0; max-height: 100%; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding: 4px; }
.hud { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 10px; font-family: var(--pixel); font-size: 8px; color: var(--dim); }
.hud b { font-weight: 400; color: var(--cyan); font-variant-numeric: tabular-nums; }
.hud b.warn { color: var(--yellow); }

.cards { display: flex; flex-direction: column; gap: 6px; }
.card { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 8px 12px; text-align: left; background: transparent; color: var(--text); border: 2px solid var(--grid); border-radius: 8px; cursor: pointer; }
.card i { width: 12px; height: 12px; border-radius: 2px; background: var(--c); }
.card .who { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.card .nm { font-family: var(--pixel); font-size: 9px; color: var(--text); }
.card .tr { font-family: var(--term); font-size: 17px; line-height: 1; color: var(--dim); }
.card .sc { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; font-family: var(--pixel); font-size: 7px; color: var(--dim); white-space: nowrap; }
.card .sc b { font-weight: 400; font-size: 14px; color: var(--yellow); }
.card:hover:not(:disabled) { border-color: var(--pink); }
.card[aria-pressed="true"] { border-color: var(--pink); background: #22103a; }
.card.chosen { border-color: var(--marigold); background: #2a1830; }
.card:disabled { cursor: default; }
.card:disabled:not(.chosen) { opacity: 0.3; }

.years { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.yr { display: grid; place-items: center; height: 30px; border: 2px solid var(--grid); border-radius: 5px; font-family: var(--pixel); font-size: 8px; color: var(--dim); }
.yr.now { border-color: var(--cyan); color: var(--cyan); }
.yr.up { border-color: var(--green); color: var(--green); }
.yr.down { border-color: var(--red); color: var(--red); }

.status { display: flex; flex-direction: column; gap: 6px; min-height: 3.6em; justify-content: center; text-align: center; }
.status .big { font-family: var(--pixel); font-size: 11px; line-height: 1.7; color: var(--cyan); text-wrap: balance; }
.status .big.result { font-size: 14px; color: var(--yellow); text-shadow: 2px 2px 0 var(--pink); }
.status .small { font-size: 20px; line-height: 1.1; color: var(--text); text-wrap: balance; }
.status .small:empty { display: none; }
.status .small .up { color: var(--green); }
.status .small .down { color: var(--red); }
.blink { animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }

.controls { display: flex; gap: 10px; justify-content: center; }
.go { font-family: var(--pixel); font-size: 13px; padding: 15px 22px; background: var(--yellow); color: var(--ink); border: 0; border-radius: 8px; box-shadow: 0 6px 0 #b8902a; cursor: pointer; letter-spacing: 0.06em; }
.go:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 2px 0 #b8902a; }
.go:disabled { background: var(--grid); color: var(--dim); box-shadow: 0 6px 0 var(--cabinet); cursor: default; }
.ghost { font-family: var(--pixel); font-size: 8px; padding: 10px 12px; background: transparent; color: var(--dim); border: 2px solid var(--grid); border-radius: 6px; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--cyan); outline-offset: 2px; }
.foot { margin: 0; font-size: 17px; color: var(--dim); text-align: center; line-height: 1.2; }

@media (orientation: portrait), (max-width: 760px) {
  .stage { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); justify-items: center; align-items: start; gap: 10px; }
  .panel { width: 100%; max-width: 460px; gap: 8px; }
  .card { padding: 6px 10px; }
  .status { min-height: 3em; }
  .foot { display: none; }
}
@media (prefers-reduced-motion: reduce) { .blink { animation: none; } }
</style>

<div class="cab">
  <header>
    <div class="marquee">PLAYING AGAINST CHANCE</div>
    <h1>TILL CHANCE DO US PART</h1>
  </header>

  <div class="stage" id="stage">
    <div class="screen">
      <canvas id="scene" aria-label="Three possible matches on a stage. After you choose, a wedding, then seven years of married life in a small house."></canvas>
      <div class="caption" id="caption"><b>YOUR MATCHES</b></div>
    </div>

    <div class="panel">
      <div class="hud" aria-live="polite">
        <span>MARRIAGES <b id="hudMarriages">0</b></span>
        <span>HAPPILY EVER AFTER <b id="hudHappy">0</b></span>
        <span>CHANCE <b id="hudSource">RANDOM.ORG</b></span>
      </div>

      <div class="cards" id="cards" role="group" aria-label="Choose who to marry"></div>

      <div class="years" id="years" aria-label="Seven years of marriage"></div>

      <div class="status" aria-live="polite">
        <div class="big" id="statusBig"><span class="blink">CHOOSE WHO TO MARRY</span></div>
        <div class="small" id="statusSmall"></div>
      </div>

      <div class="controls">
        <button class="go" id="goBtn" disabled>SAY YES</button>
        <button class="ghost" id="soundBtn" aria-pressed="true">SOUND ON</button>
      </div>

      <p class="foot">Every marriage draws its seven years from the same deck of twelve. The match score never touches the draw.</p>
    </div>
  </div>
</div>

<script>
(() => {
  // ---------- people and years ----------
  const POOL = [
    { name: "RIYA",   age: 29, job: "Architect",            quirk: "Loves trekking",            hair: "#1c1512", long: true,  shirt: "#3ef0ff" },
    { name: "KABIR",  age: 31, job: "Runs a bakery",        quirk: "Up at 4 a.m.",              hair: "#2a1a10", long: false, shirt: "#ff9a2e" },
    { name: "ANAYA",  age: 28, job: "Doctor",               quirk: "Sings off-key",             hair: "#4a2a14", long: true,  shirt: "#6dff9c" },
    { name: "ARJUN",  age: 32, job: "Chartered accountant", quirk: "Cricket every Sunday",      hair: "#1c1512", long: false, shirt: "#6f97ff" },
    { name: "MEERA",  age: 30, job: "Teacher",              quirk: "Owns three cats",           hair: "#7a4a22", long: true,  shirt: "#c38bff" },
    { name: "SAMEER", age: 33, job: "Startup founder",      quirk: "Says 'let's circle back'",  hair: "#2a1a10", long: false, shirt: "#ffd84a" },
    { name: "ZOYA",   age: 27, job: "Pilot",                quirk: "Collects old maps",         hair: "#1c1512", long: true,  shirt: "#ff4fa8" },
    { name: "DEV",    age: 30, job: "Musician",             quirk: "Cannot cook at all",        hair: "#4a2a14", long: false, shirt: "#ff5a4f" },
  ];
  // Twelve equally likely years. Every marriage draws from this same deck.
  const DECK = [
    { t: "YOU LAUGH AT THE SAME TERRIBLE JOKES",     d: +2 },
    { t: "A SMALL TRIP TO THE HILLS, JUST YOU TWO",   d: +1 },
    { t: "A BABY ARRIVES. SLEEPLESS AND HAPPY",       d: +2 },
    { t: "YOU LEARN TO COOK THEIR FAVOURITE DISH",    d: +1 },
    { t: "A PROMOTION. TAKEAWAY TO CELEBRATE",        d: +1 },
    { t: "A QUIET YEAR. NOTHING HAPPENS. IT'S LOVELY", d: +2 },
    { t: "THEIR PARENTS MOVE IN",                     d: -1 },
    { t: "A JOB TRANSFER TO ANOTHER CITY",            d: -2 },
    { t: "A WEEK-LONG FIGHT ABOUT MONEY",             d: -1 },
    { t: "LONG HOURS. YOU BARELY SEE EACH OTHER",     d: -2 },
    { t: "THE FAMILY WHATSAPP GROUP",                 d: -1 },
    { t: "THE MONSOON FLOODS THE HOUSE",              d: -1 },
  ];
  const YEARS = 7, START = 5, MAX = 10;
  const OUTCOMES = [
    { min: 8, t: "HAPPILY MARRIED" },
    { min: 5, t: "MOSTLY HAPPY" },
    { min: 3, t: "IT'S COMPLICATED" },
    { min: 0, t: "YOU DRIFTED APART" },
  ];

  // random.org JSON-RPC API (v4). Anyone who can open this file can read this key.
  const RANDOM_ORG_API_KEY = (() => { try { return localStorage.getItem("RANDOM_ORG_KEY") || ""; } catch (e) { return ""; } })();
  const RANDOM_ORG_API = "https://api.random.org/json-rpc/4/invoke";
  const RANDOM_ORG_PLAIN = "https://www.random.org/integers/?num=" + YEARS + "&min=0&max=" + (DECK.length - 1) + "&col=1&base=10&format=plain&rnd=new";

  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const $ = (id) => document.getElementById(id);
  const canvas = $("scene"), ctx = canvas.getContext("2d");
  const cardsEl = $("cards"), yearsEl = $("years"), goBtn = $("goBtn"), soundBtn = $("soundBtn");
  const statusBig = $("statusBig"), statusSmall = $("statusSmall"), caption = $("caption");
  const hud = { marriages: $("hudMarriages"), happy: $("hudHappy"), source: $("hudSource") };

  let state = "pick";             // pick | wedding | years | result
  let matches = [], chosen = null;
  let hearts = START, shownHearts = START;
  let marriages = 0, happy = 0;
  let lastDelta = 0, deltaAt = 0, weddingAt = 0;
  let floater = null;

  // ---------- one-screen layout ----------
  const PANEL_MIN = 440;
  const stageEl = $("stage");
  const screenEl = stageEl.querySelector(".screen");
  const narrowQuery = window.matchMedia("(orientation: portrait), (max-width: 760px)");
  let W = 400, H = 400;
  function layout() {
    const w = stageEl.clientWidth, h = stageEl.clientHeight;
    const sz = narrowQuery.matches ? Math.min(w, h - PANEL_MIN) : Math.min(h, w - 330);
    screenEl.style.setProperty("--sz", Math.max(200, Math.floor(sz)) + "px");
  }
  function resize() {
    const r = canvas.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(r.width * dpr); canvas.height = Math.round(r.height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    W = r.width; H = r.height;
  }
  function relayout() { layout(); resize(); }
  if ("ResizeObserver" in window) new ResizeObserver(relayout).observe(stageEl);
  window.addEventListener("resize", relayout);

  // ---------- matches ----------
  // Profiles and their scores are made up in the browser for show. They never touch the draw.
  const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  function newMatches() {
    const pool = POOL.slice().sort(() => Math.random() - 0.5).slice(0, 3);
    const bands = [[84, 97], [58, 79], [31, 52]].sort(() => Math.random() - 0.5);   // one high, one middling, one low
    matches = pool.map((p, i) => ({ ...p, ai: rnd(...bands[i]), gunas: rnd(14, 33) }));
    cardsEl.innerHTML = "";
    matches.forEach((m, i) => {
      const b = document.createElement("button");
      b.className = "card";
      b.id = "match-" + i;
      b.style.setProperty("--c", m.shirt);
      b.setAttribute("aria-pressed", "false");
      b.innerHTML = '<i></i><span class="who"><span class="nm"></span><span class="tr"></span></span><span class="sc"><span>AI MATCH <b></b></span><span></span></span>';
      b.querySelector(".nm").textContent = m.name + ", " + m.age;
      b.querySelector(".tr").textContent = m.job + " · " + m.quirk;
      b.querySelector(".sc b").textContent = m.ai + "%";
      b.querySelector(".sc > span:last-child").textContent = "GUNAS " + m.gunas + "/36";
      b.addEventListener("click", () => choose(i));
      cardsEl.appendChild(b);
    });
  }

  function choose(i) {
    if (state !== "pick") return;
    chosen = i;
    cardsEl.querySelectorAll(".card").forEach((b, k) => b.setAttribute("aria-pressed", String(k === i)));
    goBtn.disabled = false;
    const m = matches[i];
    setStatus("YOU CHOSE " + m.name, m.ai + "% AI match. " + m.gunas + " of 36 gunas.", true);
    beep(620, 0.06);
  }

  canvas.addEventListener("click", (e) => {
    if (state === "result") { reset(); return; }
    if (state !== "pick") return;
    const r = canvas.getBoundingClientRect();
    const fx = (e.clientX - r.left) / r.width;
    choose(fx < 1 / 3 ? 0 : fx < 2 / 3 ? 1 : 2);
  });

  // ---------- year strip ----------
  for (let y = 1; y <= YEARS; y++) {
    const c = document.createElement("div");
    c.className = "yr";
    c.textContent = "Y" + y;
    yearsEl.appendChild(c);
  }
  const yearCells = [...yearsEl.children];

  // ---------- chance ----------
  async function withTimeout(fn, ms) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), ms);
    try { return await fn(ctrl.signal); } finally { clearTimeout(timer); }
  }
  async function fromApi() {
    if (!RANDOM_ORG_API_KEY) throw new Error("no key");
    return withTimeout(async (signal) => {
      const res = await fetch(RANDOM_ORG_API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ jsonrpc: "2.0", method: "generateIntegers", params: { apiKey: RANDOM_ORG_API_KEY, n: YEARS, min: 0, max: DECK.length - 1, replacement: true }, id: Date.now() }),
        signal,
      });
      const json = await res.json();
      if (json.error) throw new Error(json.error.message);
      return json.result.random.data;
    }, 5000);
  }
  async function fromPlain() {
    return withTimeout(async (signal) => {
      const res = await fetch(RANDOM_ORG_PLAIN, { signal, cache: "no-store" });
      if (!res.ok) throw new Error("status " + res.status);
      return (await res.text()).trim().split(/\s+/).map(v => parseInt(v, 10));
    }, 4000);
  }
  function fromLocal() {
    const out = [], buf = new Uint8Array(1);
    while (out.length < YEARS) {
      crypto.getRandomValues(buf);
      if (buf[0] < 252) out.push(buf[0] % DECK.length);   // 252 = 21 x 12, keeps it unbiased
    }
    return out;
  }
  async function drawChance() {
    for (const [label, fn] of [["RANDOM.ORG API", fromApi], ["RANDOM.ORG", fromPlain]]) {
      try {
        const v = await fn();
        if (v.length === YEARS && v.every(n => n >= 0 && n < DECK.length)) { hud.source.textContent = label; hud.source.classList.remove("warn"); return v; }
      } catch (err) { console.warn(label + " failed:", err.message || err); }
    }
    hud.source.textContent = "LOCAL RNG";
    hud.source.classList.add("warn");
    return fromLocal();
  }

  // ---------- a marriage ----------
  const sleep = (ms) => new Promise(r => setTimeout(r, ms));

  goBtn.addEventListener("click", async () => {
    if (state === "result") { reset(); return; }
    if (state !== "pick" || chosen == null) return;
    unlockAudio();
    const m = matches[chosen];
    goBtn.disabled = true;
    cardsEl.querySelectorAll(".card").forEach((b, k) => { b.disabled = true; b.classList.toggle("chosen", k === chosen); });
    const drawing = drawChance();                       // the seven years are drawn now, before the wedding plays

    state = "wedding";
    weddingAt = performance.now();
    caption.innerHTML = "<b>THE WEDDING</b>";
    setStatus("YOU MARRY " + m.name + "!", "", false);
    [523, 659, 784, 1046, 784, 1046].forEach((f, i) => beep(f, 0.14, "square", i * 0.13));
    const years = await drawing;
    await sleep(reduceMotion ? 600 : 2200);

    state = "years";
    const seen = new Set();
    for (let y = 0; y < YEARS; y++) {
      caption.innerHTML = "<b>YEAR " + (y + 1) + " OF " + YEARS + "</b>";
      yearCells[y].classList.add("now");
      const ev = DECK[years[y]];
      await shuffleTo(ev, seen.has(years[y]));
      seen.add(years[y]);
      applyYear(y, ev);
      await sleep(reduceMotion ? 500 : 1300);
    }
    finish(m);
  });

  // flicker through the deck like a card being drawn, then stop on this year's event
  async function shuffleTo(ev, again) {
    const flips = reduceMotion ? 0 : 9;
    for (let f = 0; f < flips; f++) {
      setStatus(DECK[Math.floor(Math.random() * DECK.length)].t, "", false);
      beep(300 + f * 30, 0.025);
      await sleep(45 + f * 12);
    }
    setStatus((again ? "AGAIN: " : "") + ev.t, "", false);
  }

  function applyYear(y, ev) {
    const before = hearts;
    hearts = Math.max(0, Math.min(MAX, hearts + ev.d));
    const real = hearts - before;
    lastDelta = ev.d; deltaAt = performance.now();
    floater = { text: (ev.d > 0 ? "+" : "−") + Math.abs(ev.d), up: ev.d > 0, at: deltaAt };
    const cell = yearCells[y];
    cell.classList.remove("now");
    cell.classList.add(ev.d > 0 ? "up" : "down");
    cell.textContent = (ev.d > 0 ? "+" : "−") + Math.abs(ev.d);
    statusSmall.innerHTML = "";
    const s = document.createElement("span");
    s.className = ev.d > 0 ? "up" : "down";
    s.textContent = (ev.d > 0 ? "+" : "−") + Math.abs(ev.d) + " ♥" + (real === 0 ? (ev.d > 0 ? "  (hearts already full)" : "  (nothing left to lose)") : "");
    statusSmall.appendChild(s);
    if (ev.d > 0) { beep(660, 0.08); beep(880, 0.1, "square", 0.09); }
    else { beep(240, 0.14, "triangle"); beep(180, 0.18, "triangle", 0.12); }
  }

  function finish(m) {
    state = "result";
    marriages++;
    const out = OUTCOMES.find(o => hearts >= o.min);
    if (hearts >= 8) happy++;
    hud.marriages.textContent = marriages;
    hud.happy.textContent = happy;
    caption.innerHTML = "<b>AFTER SEVEN YEARS</b>";
    setStatus(out.t, m.name + " was a " + m.ai + "% match. Your seven years came from the same deck as everyone's.", false, true);
    goBtn.textContent = "MARRY AGAIN";
    goBtn.disabled = false;
    if (hearts >= 5) [523, 659, 784, 1046].forEach((f, i) => beep(f, 0.14, "square", i * 0.12));
    else [440, 392, 349, 330].forEach((f, i) => beep(f, 0.18, "triangle", i * 0.15));
  }

  function reset() {
    state = "pick";
    chosen = null;
    hearts = START; shownHearts = START;
    lastDelta = 0; floater = null;
    yearCells.forEach((c, i) => { c.className = "yr"; c.textContent = "Y" + (i + 1); });
    newMatches();
    caption.innerHTML = "<b>YOUR MATCHES</b>";
    goBtn.textContent = "SAY YES";
    goBtn.disabled = true;
    setStatus("CHOOSE WHO TO MARRY", "", true);
  }

  function setStatus(big, small, blink, result) {
    statusBig.className = "big" + (result ? " result" : "");
    statusBig.innerHTML = "";
    const s = document.createElement("span");
    if (blink) s.className = "blink";
    s.textContent = big;
    statusBig.appendChild(s);
    statusSmall.textContent = small || "";
  }

  // ---------- sound ----------
  let audio = null, soundOn = true;
  function unlockAudio() {
    // Browsers can pause audio after a while (another tab, a sleeping screen, an idle frame), so wake it on every tap and before every sound.
    try {
      if (!audio) {
        audio = new (window.AudioContext || window.webkitAudioContext)();
        audio.__master = audio.createGain();
        audio.__master.gain.value = 0.9;
        audio.__master.connect(audio.destination);
      }
      if (audio.state !== "running") audio.resume().catch(() => {});
    } catch (e) { audio = null; }
  }
  ["pointerdown", "keydown", "touchstart"].forEach(ev => document.addEventListener(ev, unlockAudio, { passive: true }));
  document.addEventListener("visibilitychange", () => { if (!document.hidden && audio) audio.resume().catch(() => {}); });
  function beep(freq, dur, type = "square", delay = 0) {
    if (!soundOn || !audio) return;
    if (audio.state !== "running") audio.resume().catch(() => {});
    const t = audio.currentTime + delay;
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.06, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(audio.__master || audio.destination);
    o.start(t); o.stop(t + dur + 0.03);
    o.onended = () => { o.disconnect(); g.disconnect(); };
  }
  soundBtn.addEventListener("click", () => {
    unlockAudio();
    soundOn = !soundOn;
    soundBtn.textContent = soundOn ? "SOUND ON" : "SOUND OFF";
    soundBtn.setAttribute("aria-pressed", String(soundOn));
    if (soundOn) beep(880, 0.05);
  });

  // ---------- drawing (40 x 40 pixel units) ----------
  const SKIN = "#c98c5e", PANTS = "#2d2a55", INK = "#0b0820";
  const YOU = { name: "YOU", hair: "#1c1512", long: false, shirt: "#ff4fa8" };
  let u = 10, ox = 0, oy = 0;
  const px = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(ox + x * u, oy + y * u, w * u + 0.5, h * u + 0.5); };
  function label(text, x, y, col, size) {
    const fs = Math.max(7, Math.round(u * (size || 1)));
    ctx.font = fs + "px 'Press Start 2P', monospace";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillStyle = col;
    ctx.fillText(text, ox + x * u, oy + y * u);
  }

  // a standing pixel person: cx = centre, by = feet; mood 1 smile, 0 flat, -1 frown; dir 1 faces right
  function person(cx, by, look, mood, dir) {
    px(cx - 2, by - 4, 1.6, 4, PANTS); px(cx + 0.4, by - 4, 1.6, 4, PANTS);
    px(cx - 3, by - 9, 6, 5.2, look.shirt);
    px(cx - 4, by - 8.6, 1, 3.6, look.shirt); px(cx + 3, by - 8.6, 1, 3.6, look.shirt);
    px(cx - 4, by - 5.2, 1, 1, SKIN); px(cx + 3, by - 5.2, 1, 1, SKIN);
    px(cx - 0.8, by - 10, 1.6, 1.2, SKIN);
    if (look.long) px(cx - 3, by - 14, 6, 6.5, look.hair);
    px(cx - 2.5, by - 14.5, 5, 5, SKIN);
    px(cx - 2.8, by - 15, 5.6, 1.6, look.hair);
    if (look.long) { px(cx - 3, by - 14, 1, 5.5, look.hair); px(cx + 2, by - 14, 1, 5.5, look.hair); }
    else { px(cx - 2.8, by - 13.6, 0.8, 1.4, look.hair); px(cx + 2, by - 13.6, 0.8, 1.4, look.hair); }
    const ex = dir > 0 ? 0.4 : -0.4;
    px(cx - 1.5 + ex, by - 12.6, 0.7, 0.8, INK); px(cx + 0.8 + ex, by - 12.6, 0.7, 0.8, INK);
    const mc = "#6e2b25";
    if (mood > 0) { px(cx - 1 + ex, by - 11, 2, 0.6, mc); px(cx - 1.4 + ex, by - 11.5, 0.5, 0.6, mc); px(cx + 0.9 + ex, by - 11.5, 0.5, 0.6, mc); }
    else if (mood < 0) { px(cx - 1 + ex, by - 11.4, 2, 0.6, mc); px(cx - 1.4 + ex, by - 10.9, 0.5, 0.6, mc); px(cx + 0.9 + ex, by - 10.9, 0.5, 0.6, mc); }
    else px(cx - 1 + ex, by - 11.2, 2, 0.6, mc);
  }

  const HEART = ["0110110", "1111111", "1111111", "0111110", "0011100", "0001000"];
  function heart(x, y, s, col) {
    HEART.forEach((row, j) => [...row].forEach((b, i) => { if (b === "1") px(x + i * s, y + j * s, s, s, col); }));
  }

  function drawPick(t) {
    // spotlights and a little stage
    for (let i = 0; i < 3; i++) {
      const cx = 7 + i * 13;
      const on = chosen === i;
      ctx.fillStyle = on ? "rgba(255,79,168,0.16)" : "rgba(233,230,255,0.05)";
      ctx.beginPath();
      ctx.moveTo(ox + (cx - 1) * u, oy); ctx.lineTo(ox + (cx + 1) * u, oy);
      ctx.lineTo(ox + (cx + 6) * u, oy + 34 * u); ctx.lineTo(ox + (cx - 6) * u, oy + 34 * u);
      ctx.fill();
    }
    px(0, 34, 40, 6, "#1d1845");
    px(0, 34, 40, 0.6, "#3a3270");
    matches.forEach((m, i) => {
      const cx = 7 + i * 13;
      const hop = chosen === i && !reduceMotion ? Math.abs(Math.sin(t * 5)) * 0.8 : 0;
      person(cx, 34 - hop, m, 1, 1);
      label(m.name, cx, 15.5, chosen === i ? "#ff4fa8" : "#e9e6ff", 0.9);
      label(m.ai + "%", cx, 12.2, "#ffd84a", 1.3);
      if (chosen === i) {
        ctx.strokeStyle = "#ff4fa8"; ctx.lineWidth = 2;
        ctx.strokeRect(ox + (cx - 5.5) * u, oy + 10.5 * u, 11 * u, 24 * u);
      }
    });
  }

  function drawWedding(t, now) {
    // marigold arch
    const cols = ["#ff9a2e", "#ffd84a"];
    for (let y = 12; y < 36; y += 1.4) { px(8, y, 1.4, 1.2, cols[Math.round(y) % 2]); px(30.6, y, 1.4, 1.2, cols[Math.round(y + 1) % 2]); }
    for (let a = 0; a <= 20; a++) {
      const ang = Math.PI + (a / 20) * Math.PI;
      px(20 + Math.cos(ang) * 11.3 - 0.7, 12 + Math.sin(ang) * 7 - 0.6, 1.4, 1.2, cols[a % 2]);
    }
    px(0, 36, 40, 4, "#2a1830");
    const m = matches[chosen];
    person(16.5, 36, YOU, 1, 1);
    person(23.5, 36, m, 1, -1);
    heart(18.3, 17 + (reduceMotion ? 0 : Math.sin(t * 4) * 0.5), 0.5, "#ff4fa8");
    // confetti
    if (!reduceMotion) {
      const k = (now - weddingAt) / 1000;
      for (let i = 0; i < 40; i++) {
        const x = (i * 37) % 40, y = ((i * 13) % 30) + k * 6 % 40;
        px(x, (y % 38), 0.6, 0.6, ["#ff4fa8", "#ffd84a", "#3ef0ff", "#ff9a2e"][i % 4]);
      }
    }
  }

  function drawHome(t, now) {
    const m = matches[chosen];
    // ease the heart meter towards its new value
    shownHearts += (hearts - shownHearts) * 0.08;
    const h = shownHearts;
    const sinceDelta = (now - deltaAt) / 1000;

    // weather follows the last year: stars after a good one, rain after a hard one
    if (lastDelta > 0) for (let i = 0; i < 18; i++) if (reduceMotion || Math.sin(t * 2 + i) > -0.3) px((i * 23) % 40, 6 + (i * 7) % 8, 0.4, 0.4, "#e9e6ff");
    if (lastDelta < 0 && !reduceMotion) {
      ctx.strokeStyle = "rgba(111,151,255,0.45)"; ctx.lineWidth = 1;
      for (let i = 0; i < 40; i++) {
        const x = (i * 29) % 40, y = ((i * 11) + t * 22) % 40;
        ctx.beginPath(); ctx.moveTo(ox + x * u, oy + y * u); ctx.lineTo(ox + (x - 0.4) * u, oy + (y + 1.6) * u); ctx.stroke();
      }
    }

    // heart meter
    for (let i = 0; i < MAX; i++) {
      const filled = i < Math.round(h);
      heart(4.6 + i * 3.2, 4.2, 0.36, filled ? "#ff4fa8" : "#2a2160");
    }

    // the house
    const roof = "#a3305f";
    for (let k = 0; k < 8; k++) px(9 + k * 1.25, 15 - k, 22 - k * 2.5, 1.01, roof);
    px(11, 15, 18, 15, "#3a2450");
    const lit = h >= 4 ? "#ffd84a" : "#4a4170";
    px(13, 18, 4, 3.5, lit); px(23, 18, 4, 3.5, lit);
    px(18.5, 23, 3, 7, "#1d1845");
    px(0, 30, 40, 10, "#1b2b2a");
    px(18.5, 30, 3, 10, "#2a3a38");

    // the couple: closer when happy, further apart when not
    const gap = 0.6 + (MAX - h) * 1.0;
    const mood = h >= 6 ? 1 : h >= 3 ? 0 : -1;
    const face = h >= 3 ? 1 : -1;                    // they turn away from each other when it's bad
    person(20 - 3.4 - gap / 2, 38, YOU, mood, face);
    person(20 + 3.4 + gap / 2, 38, m, mood, -face);
    if (h >= 8) heart(18.6, 25.5 + (reduceMotion ? 0 : Math.sin(t * 3) * 0.4), 0.4, "#ff4fa8");

    // the change this year floats up between them
    if (floater && sinceDelta < 1.4) {
      const k = sinceDelta / 1.4;
      ctx.globalAlpha = 1 - k;
      label(floater.text + " ♥", 20, 27 - k * 6, floater.up ? "#6dff9c" : "#ff5a4f", 1.6);
      ctx.globalAlpha = 1;
    }
  }

  function frame(now) {
    const t = now / 1000;
    u = Math.min(W, H) / 40;
    ox = (W - u * 40) / 2; oy = (H - u * 40) / 2;
    ctx.clearRect(0, 0, W, H);
    if (state === "pick") drawPick(t);
    else if (state === "wedding") drawWedding(t, now);
    else drawHome(t, now);
    requestAnimationFrame(frame);
  }

  newMatches();
  relayout();
  requestAnimationFrame(frame);
})();
</script>
