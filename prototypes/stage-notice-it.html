<title>Notice It</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
/* Layout: one wide arcade screen with the street walking past. Looks and odds float in its top corners, the phone sits in its bottom corner. One LOOK button underneath. Single dark theme. */
:root {
  --ink: #0b0820;
  --cabinet: #151036;
  --grid: #2a2160;
  --text: #e9e6ff;
  --dim: #8a84bf;
  --cyan: #3ef0ff;
  --pink: #ff4fa8;
  --yellow: #ffd84a;
  --green: #6dff9c;
  --red: #ff5a4f;
  --paper: #f3eddc;
  --paper-ink: #1f1a3a;
  --pixel: "Press Start 2P", "Courier New", monospace;
  --term: "VT323", "Courier New", monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; box-sizing: border-box; background: var(--ink); color: var(--text); font-family: var(--term); font-size: 20px; padding-inline: 16px; padding-block: 12px; overflow: hidden; }
.cab { max-width: 1160px; height: 100%; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; gap: 12px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: center; gap: 6px 14px; }
.marquee { font-family: var(--pixel); font-size: 10px; letter-spacing: 0.18em; color: var(--dim); }
h1 { margin: 0; font-family: var(--pixel); font-size: clamp(14px, 2.6vw, 22px); line-height: 1.3; color: var(--text); text-shadow: 3px 3px 0 var(--cabinet), 5px 5px 0 var(--yellow); }

.stage { min-height: 0; min-width: 0; display: grid; place-items: center; }
.screen { position: relative; box-sizing: border-box; width: min(100%, 1120px); height: min(100%, 660px); border: 4px solid var(--grid); border-radius: 14px; background: #0c0b2a; box-shadow: 0 0 0 4px var(--cabinet); overflow: hidden; }
.screen::after { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 6; background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0 2px, rgba(0,0,0,0.14) 2px 3px); }
#street { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: pointer; }

.hud { position: absolute; top: 14px; left: 16px; right: 16px; z-index: 2; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; pointer-events: none; font-family: var(--pixel); }
.looks { display: flex; flex-direction: column; gap: 8px; padding: 10px 12px; background: rgba(11, 8, 32, 0.72); border: 2px solid var(--grid); border-radius: 8px; }
.looks small, .odds small { font-size: 7px; letter-spacing: 0.12em; color: var(--dim); }
.eyes { display: flex; gap: 8px; }
.eye { width: 22px; height: 14px; border-radius: 50%; background: var(--paper); position: relative; transition: opacity 0.3s, transform 0.3s; }
.eye::after { content: ""; position: absolute; left: 7px; top: 3px; width: 8px; height: 8px; border-radius: 50%; background: var(--ink); }
.eye.used { opacity: 0.18; transform: scaleY(0.2); }
.odds { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; padding: 10px 12px; background: rgba(11, 8, 32, 0.72); border: 2px solid var(--grid); border-radius: 8px; text-align: right; }
.odds b { font-weight: 400; font-size: 10px; color: var(--yellow); }
.progress { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; z-index: 2; background: rgba(42, 33, 96, 0.8); }
.progress i { display: block; height: 100%; width: 0; background: var(--cyan); }

/* what you see when you look closer */
.bubble { position: absolute; z-index: 3; width: min(300px, 76%); box-sizing: border-box; padding: 12px 14px; background: var(--paper); color: var(--paper-ink); border-radius: 6px; box-shadow: 5px 5px 0 rgba(0,0,0,0.45); font-size: 22px; line-height: 1.05; text-align: center; transform: translate(-50%, -100%); opacity: 0; transition: opacity 0.25s; pointer-events: none; }
.bubble.show { opacity: 1; }
.bubble::after { content: ""; position: absolute; left: var(--tail, 50%); bottom: -9px; width: 14px; height: 14px; background: inherit; transform: translateX(-50%) rotate(45deg); }
.bubble.spark { background: var(--yellow); box-shadow: 0 0 0 4px rgba(255, 216, 74, 0.35), 5px 5px 0 rgba(0,0,0,0.45); }

/* the phone: always buzzing, always offering more of the same */
.phone { position: absolute; right: 18px; bottom: 22px; z-index: 4; width: 52px; height: 88px; box-sizing: border-box; padding: 8px 5px 12px; background: #22203a; border: 3px solid #4a4270; border-radius: 9px; cursor: pointer; display: flex; transition: width 0.35s, height 0.35s, right 0.35s, bottom 0.35s; }
.phone .glass { flex: 1; border-radius: 3px; background: #2a2160; overflow: hidden; position: relative; }
.phone.ring .glass { background: var(--cyan); }
.phone.ring { animation: buzz 0.14s linear 6; }
@keyframes buzz { 25% { transform: translateX(-3px) rotate(-4deg); } 75% { transform: translateX(3px) rotate(4deg); } }
.phone:focus-visible { outline: 3px solid var(--pink); outline-offset: 3px; }
.ping { position: absolute; right: 80px; bottom: 54px; z-index: 4; max-width: min(240px, 60%); padding: 10px 12px; background: #fff; color: #1f1a3a; border-radius: 10px; font-family: var(--pixel); font-size: 8px; line-height: 1.6; box-shadow: 0 6px 0 rgba(0,0,0,0.35); opacity: 0; transform: translateY(8px); transition: opacity 0.2s, transform 0.2s; pointer-events: none; }
.ping.show { opacity: 1; transform: none; }
.ping b { display: block; font-weight: 400; color: var(--pink); font-size: 7px; margin-bottom: 4px; }
.phone.open { right: 6%; bottom: 8%; width: min(220px, 46%); height: 84%; cursor: default; }
.feed { position: absolute; inset: 0; display: none; flex-direction: column; gap: 8px; padding: 8px; animation: scroll 1.2s linear infinite; }
.phone.open .feed { display: flex; }
.feed i { flex: none; height: 64px; border-radius: 4px; background: var(--c); }
@keyframes scroll { to { transform: translateY(-144px); } }
.feedtag { position: absolute; left: 0; right: 0; top: 0; z-index: 1; display: none; padding: 8px 6px; background: rgba(11,8,32,0.88); font-family: var(--pixel); font-size: 7px; line-height: 1.6; text-align: center; color: var(--text); }
.phone.open .feedtag { display: block; }
.hud { transition: opacity 0.4s; }
.screen.ended .hud { opacity: 0; }
.screen.scrolling #street { filter: brightness(0.35) saturate(0.4); }

.intro, .end { position: absolute; inset: 0; z-index: 5; display: grid; place-items: center; padding: 16px; }
.intro { background: rgba(7, 5, 26, 0.72); }
.intro[hidden], .end[hidden] { display: none; }
.end { justify-items: end; padding: 16px 4%; }
.card { max-width: 440px; display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 24px; text-align: center; background: var(--cabinet); border: 3px solid var(--grid); border-radius: 12px; box-shadow: 0 0 0 3px var(--ink); }
.card > b { font-family: var(--pixel); font-weight: 400; font-size: clamp(13px, 2.2vw, 18px); line-height: 1.5; color: var(--text); text-shadow: 2px 2px 0 var(--pink); text-wrap: balance; }
.card p { margin: 0; font-size: 22px; line-height: 1.1; text-wrap: balance; }
.end .card { opacity: 0; transform: translateY(10px); transition: opacity 0.7s, transform 0.7s; max-height: 100%; box-sizing: border-box; overflow: auto; }
.end.in .card { opacity: 1; transform: none; }
.end .card > b { text-shadow: 2px 2px 0 var(--yellow); color: var(--text); }
.end canvas { width: 72px; height: 72px; image-rendering: pixelated; }
.ripple { width: 100%; display: flex; flex-direction: column; gap: 10px; text-align: left; }
.ripple div { display: flex; flex-direction: column; gap: 4px; opacity: 0; transform: translateX(-6px); transition: opacity 0.6s, transform 0.6s; }
.ripple div.on { opacity: 1; transform: none; }
.ripple small { font-family: var(--pixel); font-size: 7px; letter-spacing: 0.1em; color: var(--yellow); }
.ripple span { font-size: 22px; line-height: 1.05; }
.ripple .ghost-life span { color: var(--dim); }
.moment { font-size: 22px; line-height: 1.05; color: var(--paper); font-style: italic; }
.last { width: 100%; padding-top: 12px; border-top: 2px solid var(--grid); display: flex; flex-direction: column; gap: 4px; opacity: 0; transition: opacity 0.8s; }
.last.on { opacity: 1; }
.last strong { font-weight: 400; font-size: 22px; color: var(--text); }
.last span { font-size: 19px; color: var(--dim); }

.bottom { display: flex; justify-content: center; align-items: center; gap: 16px; flex-wrap: wrap; padding-bottom: 6px; }
.go { font-family: var(--pixel); font-size: 15px; min-width: min(220px, 50vw); padding: 18px 22px; border: 0; border-radius: 10px; cursor: pointer; letter-spacing: 0.08em; color: var(--ink); background: var(--yellow); box-shadow: 0 7px 0 #b8902a; }
.go:active:not(:disabled) { transform: translateY(5px); box-shadow: 0 2px 0 rgba(0,0,0,0.4); }
.go:disabled { background: var(--grid); color: var(--dim); box-shadow: 0 7px 0 var(--cabinet); cursor: default; }
.go .k { display: block; margin-top: 6px; font-size: 7px; opacity: 0.6; letter-spacing: 0.1em; }
.go[hidden] { display: none; }
.side { display: flex; flex-direction: column; gap: 8px; align-items: center; font-family: var(--pixel); font-size: 7px; letter-spacing: 0.08em; color: var(--dim); }
.side b { font-weight: 400; color: var(--cyan); }
.side b.warn { color: var(--yellow); }
.ghost { font-family: var(--pixel); font-size: 8px; padding: 8px 10px; background: transparent; color: var(--dim); border: 2px solid var(--grid); border-radius: 6px; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--pink); outline-offset: 3px; }

@media (max-width: 700px) {
  .hud { top: 10px; left: 10px; right: 10px; }
  .looks, .odds { padding: 8px 9px; }
  .eye { width: 18px; height: 12px; } .eye::after { left: 5px; top: 2px; width: 7px; height: 7px; }
  .odds b { font-size: 8px; }
  .end { justify-items: center; align-items: start; padding: 12px; }
  .end canvas { display: none; }
  .card { padding: 18px 16px; gap: 10px; }
  .card p, .ripple span, .moment, .last strong { font-size: 19px; }
  .ping { right: 72px; }
  .go .k { display: none; }
}
@media (prefers-reduced-motion: reduce) { .phone.ring, .feed { animation: none; } .end .card, .ripple div, .last, .bubble { transition: none; } }
</style>

<div class="cab">
  <header>
    <div class="marquee">PLAYING AGAINST CHANCE</div>
    <h1>NOTICE IT</h1>
  </header>

  <div class="stage">
    <div class="screen" id="screen">
      <canvas id="street" aria-label="Your walk to work. Things pass by. Tap one to look closer."></canvas>
      <div class="hud">
        <div class="looks"><small>LOOKS</small><div class="eyes" id="eyes"><i class="eye"></i><i class="eye"></i><i class="eye"></i></div></div>
        <div class="odds"><small>SOMEWHERE ON THIS WALK</small><b>1 SPARK IN 10 THINGS</b></div>
      </div>
      <div class="bubble" id="bubble" role="status" aria-live="polite"></div>
      <div class="ping" id="ping"><b>NOW</b><span id="pingText"></span></div>
      <div class="phone" id="phone" role="button" tabindex="0" aria-label="Your phone. Checking it uses a look.">
        <div class="glass"><div class="feedtag">MORE OF WHAT YOU LIKE</div><div class="feed" id="feed"></div></div>
      </div>
      <div class="progress"><i id="prog"></i></div>

      <div class="intro" id="intro">
        <div class="card">
          <b>THE WALK TO WORK</b>
          <p>Somewhere on it, chance has hidden one thing that could change your life. It looks like everything else.</p>
          <p>You get three looks.</p>
          <button class="go" id="startBtn">START WALKING</button>
        </div>
      </div>

      <div class="end" id="end" hidden role="dialog" aria-live="polite">
        <div class="card">
          <canvas id="endIcon" aria-hidden="true"></canvas>
          <b id="endTitle"></b>
          <div class="moment" id="endMoment"></div>
          <div class="ripple" id="ripple"></div>
          <div class="last" id="last"><strong id="lastStrong"></strong><span id="lastSmall"></span></div>
        </div>
      </div>
    </div>
  </div>

  <div class="bottom">
    <button class="go" id="lookBtn" disabled>LOOK<span class="k">SPACE</span></button>
    <button class="go" id="againBtn" hidden>WALK AGAIN<span class="k">SPACE</span></button>
    <div class="side">
      <span>CHANCE <b id="src">RANDOM.ORG</b></span>
      <button class="ghost" id="soundBtn" aria-pressed="true">SOUND ON</button>
    </div>
  </div>
</div>

<script>
(() => {
  // ---------- the street ----------
  // Ten ordinary things. Any one of them could be the spark; chance decides which, before you set out.
  const THINGS = [
    { name: "A TORN POSTER", plain: "An old concert poster. Nothing.", spark: "Under the torn bit: POTTERY CLASS. SUNDAYS. FIRST LESSON FREE.",
      life: [["A WEEK LATER", "Your first wonky bowl."], ["A YEAR LATER", "A potter's wheel in your kitchen."], ["TEN YEARS LATER", "Your own studio. People come on Sundays."]],
      pal: { o: "#8a84bf", y: "#f3eddc", r: "#ff5a4f", k: "#1f1a3a", p: "#4a4270" },
      px: ["oooooooooooooo", "oyyyyyyyyyyyyo", "oyrrrrrrrrrryo", "oyrrrrrrrrrryo", "oyyyyyyyyyyyyo", "oykkykkykkyyyo", "oyyyyyyyyyyyyo", "oykykkykykkyyo", "oyyyyyyyy....o", "oyyyyyy......o", "oyyyy.......oo", "oooooooooooo..", "......pp......", "......pp......", "......pp......", "......pp......", "......pp......", "......pp......", "......pp......", ".....pppp....."] },
    { name: "A BOX OF FREE BOOKS", plain: "Old textbooks nobody wants.", spark: "A book about the stars. Someone's notes fill every margin.",
      life: [["THAT NIGHT", "You find Saturn with a borrowed telescope."], ["A YEAR LATER", "You quit night shifts to study."], ["TEN YEARS LATER", "You teach kids to read the sky."]],
      pal: { r: "#ff5a4f", b: "#3ef0ff", g: "#6dff9c", y: "#ffd84a", m: "#c38bff", c: "#ff9a2e", x: "#8a5a2a", d: "#c08040", k: "#1f1a3a" },
      px: ["...r..g...m...", "..rbbgyymcc...", "..rbbgyymcc...", "..rbbgyymcc...", "..rbbgyymcc...", "xxxxxxxxxxxxxx", "xddddddddddddx", "xddkkkkkkkdddx", "xddddddddddddx", "xddddddddddddx", "xxxxxxxxxxxxxx"] },
    { name: "A BUSKER", plain: "A busker, slightly off-key.", spark: "He's playing an instrument you've never heard. You ask him about it.",
      life: [["A WEEK LATER", "He teaches you three notes."], ["A YEAR LATER", "You play at a friend's wedding."], ["TEN YEARS LATER", "You make instruments by hand."]],
      pal: { h: "#1c1512", s: "#c98c5e", b: "#ff4fa8", g: "#c08040", k: "#1f1a3a", n: "#8a5a2a", p: "#2a2160", c: "#3a2a1a", y: "#ffd84a" },
      px: ["....hhhh......", "...hhhhhh.....", "...hsssss.....", "...sssss......", "....sss.......", "...bbbbbb.....", "..bbbbbbbb....", "..bbggggbb....", "..ssgkkggnnnnn", "..bbggggbbs...", "...ggggggb....", "...pppppp.....", "...pp..pp.....", "...pp..pp.....", "..kkk..kkk....", "cccccccccc....", "cyycyyycyc....", "cccccccccc...."] },
    { name: "A BENCH", plain: "An empty bench.", spark: "Someone left a sketchbook here. Every page is this street.",
      life: [["THAT EVENING", "You draw your own window."], ["A YEAR LATER", "A sketchbook for every street."], ["TEN YEARS LATER", "You're an illustrator. Your first book is this street."]],
      pal: { x: "#8a5a2a", k: "#4a4270", w: "#f3eddc" },
      px: ["xxxxxxxxxxxxxxxx", "................", "xxxxxxxxxxxxxxxx", ".x............x.", ".x...wwww.....x.", "xxxxxxxxxxxxxxxx", "xxxxxxxxxxxxxxxx", ".k............k.", ".k............k.", ".k............k."] },
    { name: "A REPAIR SHOP", plain: "A repair shop. Closed.", spark: "The repairman waves you in. He's fixing a radio from 1962.",
      life: [["A WEEK LATER", "He lets you hold the soldering iron."], ["A YEAR LATER", "Neighbours bring you their broken things."], ["TEN YEARS LATER", "You run the shop. He still drops by."]],
      pal: { y: "#ffd84a", k: "#1f1a3a", f: "#4a4270", g: "#1e3550", r: "#c08040", e: "#f3eddc", w: "#6a5a8a" },
      px: ["yyyyyyyyyyyyyyyyyy", "ykkykkkykykkkykkky", "yyyyyyyyyyyyyyyyyy", "ffffffffffffffffff", "fggggggggggggggggf", "fggggggggggggggggf", "fggggrrrrrrrrggggf", "fggggreeeeeerggggf", "fggggrekkeekrggggf", "fggggreeeeeerggggf", "fggggrrrrrrrrggggf", "fgggggrggggrgggggf", "fggggggggggggggggf", "ffffffffffffffffff", "fwwwwwwwwwwwwwwwwf", "fwwwwwwwwwwwwwwwwf", "ffffffffffffffffff"] },
    { name: "A CHAI STALL", plain: "Chai. Too sweet.", spark: "The chai-wala also sells honey. From his own bees, he says.",
      life: [["A MONTH LATER", "You visit his village."], ["A YEAR LATER", "Two hives on your terrace."], ["TEN YEARS LATER", "You keep bees. You smell of smoke and honey."]],
      pal: { r: "#ff5a4f", w: "#f3eddc", k: "#8a84bf", s: "#cfd6ff", h: "#8a84bf", c: "#2f9a5a", y: "#ffd84a", o: "#1f1a3a" },
      px: [".....rrrrrrrrrr.", "....rrwrrwrrwrr.", "...rrwrrwrrwrrr.", "...k..........k.", "...k...ss.....k.", "...k..sssshh..k.", "...k..ssss.h..k.", "...k..ssss....k.", "...kccccccccccc.", "...cccccccccccc.", "...cyycyycyycc..", "...cccccccccccc.", "....o........o..", "...ooo......ooo."] },
    { name: "A SLEEPING DOG", plain: "A dog, asleep in the sun.", spark: "The dog wakes up, stretches, and follows you.",
      life: [["THAT DAY", "It leads you to a shelter that needs help."], ["A YEAR LATER", "Every Sunday is shelter day."], ["TEN YEARS LATER", "You run the shelter."]],
      pal: { e: "#8a5a2a", b: "#c08040", k: "#1f1a3a", t: "#c08040" },
      px: ["...........ee.", "t.bbbbbbbbbbbb", ".bbbbbbbbbbbbk", "bbbbbbbbbbbbbb", ".bb.......bb.."] },
    { name: "A GARDEN GATE", plain: "A locked gate.", spark: "The gate is open today. Someone inside waves you in.",
      life: [["THAT MORNING", "Someone hands you a trowel."], ["A YEAR LATER", "Tomatoes on your balcony."], ["TEN YEARS LATER", "You turn empty roofs into farms."]],
      pal: { f: "#ff4fa8", g: "#6dff9c", k: "#4a4270" },
      px: [".f...g.f...g..f.", "fgf.ggggf.ggggfg", "kkkkkkkkkkkkkkkk", "kgk.kgk.kgk.kgkk", "kgkgkgkgkgkgkgkk", "k.kgk.kgk.kgk.kk", "kgkgkgkgkgkgkgkk", "k.k.k.k.k.k.k.kk", "kkkkkkkkkkkkkkkk", "k.k.k.k.k.k.k.kk", "k.k.k.k.k.k.k.kk", "k.k.k.k.k.k.k.kk", "kkkkkkkkkkkkkkkk"] },
    { name: "A CHESS TABLE", plain: "Two old men arguing over chess.", spark: "One of them needs an opponent. He's waited all week.",
      life: [["THAT AFTERNOON", "He beats you in nine moves."], ["A YEAR LATER", "You beat him. Once."], ["TEN YEARS LATER", "You coach kids at this same table."]],
      pal: { k: "#1f1a3a", w: "#f3eddc", t: "#8a5a2a", s: "#4a4270", p: "#ff5a4f" },
      px: [".....p...p......", "....kwkwkwkw....", "....wkwkwkwk....", "....kwkwkwkw....", "..tttttttttttt..", ".......tt.......", ".......tt.......", ".......tt.......", ".ss...tttt...ss.", ".ss..........ss.", ".s.s........s.s."] },
    { name: "A PAINTED WALL", plain: "Someone's painting a wall. Probably an ad.", spark: "It's a mural, half finished. The painter needs another hand.",
      life: [["THAT DAY", "The painter hands you a brush."], ["A YEAR LATER", "Your first wall of your own."], ["TEN YEARS LATER", "Your walls are all over the city."]],
      pal: { w: "#5a4a7a", p: "#ff4fa8", y: "#ffd84a", c: "#3ef0ff", g: "#6dff9c", b: "#ff9a2e", r: "#ff5a4f", k: "#8a84bf" },
      px: ["wwwwwwwwwwwwwwwwwwww", "wpppwwwyyyywwccwwwww", "wpppppwyyyyyyccccwww", "wwpppwwwyyyywwcccwww", "wwwwwwgggwwwwwwwwwww", "wwwwwgggggwwbbbwwwww", "wwwwwwgggwwbbbbbwwww", "wwwwwwwwwwwwbbbwwwww", "wwwwwwwwwwwwwwwwwwww", "wwwwwwwwwwwwwwwwwwww", "....................", "..............rr....", "..............rr...."] },
  ];
  const PINGS = ["24 NEW REELS FOR YOU", "SALE ENDS IN 2 HOURS", "SOMEONE LIKED YOUR POST", "YOU MAY ALSO LIKE...", "TRENDING NEAR YOU", "YOUR WEEKLY RECAP IS HERE", "3 PEOPLE VIEWED YOUR PROFILE", "FLASH DEAL: 70% OFF"];
  const LOOKS = 3;

  // random.org JSON-RPC API (v4). Anyone who can open this file can read this key.
  const RANDOM_ORG_API_KEY = (() => { try { return localStorage.getItem("RANDOM_ORG_KEY") || ""; } catch (e) { return ""; } })();
  const RANDOM_ORG_API = "https://api.random.org/json-rpc/4/invoke";

  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const $ = (id) => document.getElementById(id);
  const canvas = $("street"), ctx = canvas.getContext("2d"), screenEl = $("screen");
  const lookBtn = $("lookBtn"), againBtn = $("againBtn"), startBtn = $("startBtn"), soundBtn = $("soundBtn"), srcEl = $("src");
  const bubble = $("bubble"), phoneEl = $("phone"), pingEl = $("ping"), pingText = $("pingText"), feedEl = $("feed");
  const introEl = $("intro"), endEl = $("end"), eyesEl = [...$("eyes").children], progEl = $("prog");

  let state = "ready";             // ready | walking | looking | phone | found | missed
  let order = [], sparkAt = -1, looked = new Set(), looksLeft = LOOKS, phoneLooks = 0;
  let cam = 0, lastNow = 0, paused = false, rush = false, glowAt = 0, foundAt = 0;
  let nextPing = 0, pingTimer = null, lookTimer = null;

  // ---------- chance ----------
  async function withTimeout(fn, ms) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), ms);
    try { return await fn(ctrl.signal); } finally { clearTimeout(timer); }
  }
  async function apiInts(n, min, max) {
    if (!RANDOM_ORG_API_KEY) throw new Error("no key");
    return withTimeout(async (signal) => {
      const res = await fetch(RANDOM_ORG_API, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ jsonrpc: "2.0", method: "generateIntegers", params: { apiKey: RANDOM_ORG_API_KEY, n, min, max, replacement: true }, id: Date.now() }),
        signal,
      });
      const json = await res.json();
      if (json.error) throw new Error(json.error.message);
      return json.result.random.data;
    }, 5000);
  }
  async function plainInts(n, min, max) {
    return withTimeout(async (signal) => {
      const res = await fetch("https://www.random.org/integers/?num=" + n + "&min=" + min + "&max=" + max + "&col=1&base=10&format=plain&rnd=new", { signal, cache: "no-store" });
      if (!res.ok) throw new Error("status " + res.status);
      return (await res.text()).trim().split(/\s+/).map(v => parseInt(v, 10));
    }, 4000);
  }
  function localInts(n, min, max) {
    const k = max - min + 1, lim = Math.floor(0x100000000 / k) * k, buf = new Uint32Array(1);
    return Array.from({ length: n }, () => { do { crypto.getRandomValues(buf); } while (buf[0] >= lim); return min + (buf[0] % k); });
  }
  async function getInts(n, min, max) {
    for (const [label, fn] of [["RANDOM.ORG API", apiInts], ["RANDOM.ORG", plainInts]]) {
      try { const v = await fn(n, min, max); if (v.length === n && v.every(x => x >= min && x <= max)) { setSource(label); return v; } }
      catch (err) { console.warn(label + " failed:", err.message || err); }
    }
    setSource("LOCAL RNG");
    return localInts(n, min, max);
  }
  function setSource(label) { srcEl.textContent = label; srcEl.classList.toggle("warn", label === "LOCAL RNG"); }

  // ---------- geometry ----------
  let W = 800, H = 500;
  const G = () => {
    const narrow = W < 560;
    const s = Math.max(3, Math.floor(Math.min(W * 0.9, H) * 0.3 / 20));
    const walkerX = W * (narrow ? 0.2 : 0.26);
    const gap = Math.max(W * (narrow ? 0.62 : 0.4), 26 * s);
    const ground = H * 0.8;
    return { s, walkerX, gap, ground, first: W * 0.75, speed: gap / 3400 };
  };
  const thingX = (i) => G().first + i * G().gap;                       // world x of thing i
  const endX = () => thingX(THINGS.length - 1) + G().gap * 1.2;          // the office door
  const sizeOf = (t) => ({ w: Math.max(...t.px.map(r => r.length)), h: t.px.length });
  function thingBox(i) {
    const { s, walkerX, ground } = G(), t = order[i], { w, h } = sizeOf(t);
    const x = thingX(i) - cam + walkerX - (w * s) / 2;
    return { x, y: ground - h * s, w: w * s, h: h * s, cx: x + (w * s) / 2 };
  }
  // the thing just ahead of you, the one LOOK will look at
  function inReach() {
    if (!order.length) return -1;
    const { walkerX, s } = G();
    let best = -1, bestD = Infinity;
    order.forEach((_, i) => {
      if (looked.has(i)) return;
      const d = thingBox(i).cx - walkerX;
      if (d > -6 * s && d < W * 0.42 && Math.abs(d) < bestD) { best = i; bestD = Math.abs(d); }
    });
    return best;
  }

  // ---------- a walk ----------
  const sleep = (ms) => new Promise(r => setTimeout(r, ms));

  async function start() {
    ensureAudio();
    introEl.hidden = true;
    endEl.hidden = true; endEl.classList.remove("in");
    screenEl.classList.remove("ended");
    againBtn.hidden = true; lookBtn.hidden = false;
    state = "busy"; looked = new Set(); looksLeft = LOOKS; phoneLooks = 0; cam = 0; paused = false; rush = false; glowAt = 0; foundAt = 0;
    setEyes(); hideBubble(); closePhone(true);
    // the street's order is shuffled for variety; which of the ten is the spark is chance's call
    order = THINGS.slice();
    for (let i = order.length - 1; i > 0; i--) { const j = localInts(1, 0, i)[0]; [order[i], order[j]] = [order[j], order[i]]; }
    sparkAt = (await getInts(1, 1, THINGS.length))[0] - 1;
    state = "walking";
    nextPing = performance.now() + 2600;
    lookBtn.focus({ preventScroll: true });
  }

  function look(i) {
    if (state !== "walking" || looksLeft <= 0 || i < 0 || looked.has(i)) return;
    looked.add(i);
    looksLeft--; setEyes();
    paused = true;
    state = "looking";
    const spark = i === sparkAt;
    const b = thingBox(i);
    showBubble(spark ? order[i].spark : order[i].plain, b, spark);
    if (spark) {
      glowAt = performance.now();
      [523, 659, 784, 1046, 1318].forEach((f, k) => beep(f, 0.3, "triangle", k * 0.09, 0.05));
      clearTimeout(lookTimer);
      lookTimer = setTimeout(found, reduceMotion ? 900 : 2600);
    } else {
      beep(330, 0.06, "square", 0, 0.04); beep(262, 0.08, "square", 0.08, 0.035);
      clearTimeout(lookTimer);
      lookTimer = setTimeout(walkOn, 2300);
    }
  }
  function walkOn() {
    if (state !== "looking") return;
    clearTimeout(lookTimer);
    hideBubble();
    paused = false;
    state = "walking";
    if (looksLeft === 0) rush = true;              // no looks left: the rest of the walk blurs by
  }

  async function found() {
    state = "found";
    hideBubble();
    const t = order[sparkAt];
    // you walk up to it and stop, left of the card
    const from = cam, to = thingX(sparkAt) - G().s * (sizeOf(t).w / 2 + 7);
    const T = reduceMotion ? 1 : 1100, t0 = performance.now();
    stroll = true;
    await new Promise(res => { const step = (now) => { const k = Math.min(1, (now - t0) / T); cam = from + (to - from) * (1 - Math.pow(1 - k, 2)); if (k < 1) requestAnimationFrame(step); else res(); }; requestAnimationFrame(step); });
    stroll = false;
    foundAt = performance.now();
    drawIcon(t);
    $("endTitle").textContent = "IT STARTED WITH " + t.name;
    $("endMoment").textContent = "";
    $("endMoment").hidden = true;
    const rip = $("ripple"); rip.innerHTML = ""; rip.hidden = false;
    t.life.forEach(([when, what]) => { const d = document.createElement("div"); const a = document.createElement("small"); a.textContent = when; const b = document.createElement("span"); b.textContent = what; d.append(a, b); rip.appendChild(d); });
    $("lastStrong").textContent = "You almost walked past it.";
    const usedOnThings = LOOKS - looksLeft - phoneLooks;
    $("lastSmall").textContent = "1 spark in 10 things. You looked at " + usedOnThings + ".";
    await showEnd();
    for (const d of rip.children) { await sleep(reduceMotion ? 50 : 1100); d.classList.add("on"); beep(784, 0.18, "triangle", 0, 0.04); beep(1046, 0.22, "triangle", 0.1, 0.035); }
    await sleep(reduceMotion ? 50 : 900);
    $("last").classList.add("on");
    finishButtons();
  }

  async function missed() {
    state = "missed";
    hideBubble(); closePhone(true);
    // the walk is over. The street rewinds to show what you passed.
    const from = cam, to = thingX(sparkAt) + G().walkerX - W * (W < 560 ? 0.5 : 0.3);   // spark ends up left of the card
    const T = reduceMotion ? 1 : 1600, t0 = performance.now();
    [392, 330, 262].forEach((f, k) => beep(f, 0.2, "triangle", k * 0.18, 0.04));
    await new Promise(res => { const step = (now) => { const k = Math.min(1, (now - t0) / T); cam = from + (to - from) * (1 - Math.pow(1 - k, 3)); if (k < 1) requestAnimationFrame(step); else res(); }; requestAnimationFrame(step); });
    glowAt = performance.now();
    const t = order[sparkAt];
    drawIcon(t);
    $("endTitle").textContent = "YOU WALKED PAST " + t.name;
    $("endMoment").hidden = false;
    $("endMoment").textContent = "“" + t.spark + "”";
    const rip = $("ripple"); rip.innerHTML = ""; rip.hidden = false;
    const d = document.createElement("div"); d.className = "ghost-life";
    const a = document.createElement("small"); a.textContent = "IT COULD HAVE BEEN";
    const b = document.createElement("span"); b.textContent = t.life[2][1];
    d.append(a, b); rip.appendChild(d);
    $("lastStrong").textContent = "In life, nobody tells you.";
    $("lastSmall").textContent = phoneLooks ? "You gave " + phoneLooks + (phoneLooks === 1 ? " look" : " looks") + " to your phone."
      : looksLeft ? "You still had " + looksLeft + (looksLeft === 1 ? " look" : " looks") + " left." : "";
    await sleep(reduceMotion ? 50 : 700);
    await showEnd();
    await sleep(reduceMotion ? 50 : 700);
    d.classList.add("on");
    await sleep(reduceMotion ? 50 : 900);
    $("last").classList.add("on");
    finishButtons();
  }

  async function showEnd() {
    $("last").classList.remove("on");
    screenEl.classList.add("ended");
    endEl.hidden = false; void endEl.offsetWidth; endEl.classList.add("in");
    lookBtn.disabled = true;
    await sleep(reduceMotion ? 50 : 500);
  }
  function finishButtons() { lookBtn.hidden = true; againBtn.hidden = false; againBtn.focus({ preventScroll: true }); }

  // ---------- the phone ----------
  function ping() {
    if (state !== "walking") return;
    pingText.textContent = PINGS[localInts(1, 0, PINGS.length - 1)[0]];
    pingEl.classList.add("show");
    phoneEl.classList.remove("ring"); void phoneEl.offsetWidth; phoneEl.classList.add("ring");
    beep(1568, 0.07, "sine", 0, 0.06); beep(2093, 0.1, "sine", 0.08, 0.06);
    clearTimeout(pingTimer);
    pingTimer = setTimeout(() => { pingEl.classList.remove("show"); phoneEl.classList.remove("ring"); }, 2600);
  }
  async function openPhone() {
    if (state !== "walking" || looksLeft <= 0) return;
    looksLeft--; phoneLooks++; setEyes();
    state = "phone";
    pingEl.classList.remove("show");
    phoneEl.classList.remove("ring");
    phoneEl.classList.add("open");
    screenEl.classList.add("scrolling");
    feedEl.innerHTML = "";
    const cols = ["#ff4fa8", "#3ef0ff", "#ffd84a", "#c38bff", "#6dff9c", "#ff9a2e"];
    for (let i = 0; i < 12; i++) { const c = document.createElement("i"); c.style.setProperty("--c", cols[i % cols.length]); feedEl.appendChild(c); }
    for (let i = 0; i < 6; i++) beep(1200 + i * 40, 0.02, "square", i * 0.5, 0.02);
    await sleep(reduceMotion ? 1500 : 3600);    // the street keeps going while you scroll
    if (state !== "phone") return;
    closePhone();
    state = "walking";
    if (looksLeft === 0) rush = true;
  }
  function closePhone(now) {
    phoneEl.classList.remove("open", "ring");
    screenEl.classList.remove("scrolling");
    if (now) pingEl.classList.remove("show");
  }

  // ---------- small bits of UI ----------
  function setEyes() { eyesEl.forEach((e, i) => e.classList.toggle("used", i >= looksLeft)); }
  function showBubble(text, box, spark) {
    bubble.textContent = text;
    bubble.classList.toggle("spark", spark);
    const r = screenEl.getBoundingClientRect();
    const bw = Math.min(300, r.width * 0.76);
    const x = Math.max(bw / 2 + 10, Math.min(r.width - bw / 2 - 10, box.cx));
    bubble.style.left = x + "px";
    bubble.style.top = Math.max(120, box.y - 14) + "px";
    bubble.style.setProperty("--tail", Math.max(14, Math.min(bw - 14, bw / 2 + (box.cx - x))) + "px");
    bubble.classList.add("show");
  }
  function hideBubble() { bubble.classList.remove("show"); }
  function drawIcon(t) {
    const cv = $("endIcon"), { w, h } = sizeOf(t), n = Math.max(w, h);
    cv.width = n; cv.height = n;
    const c = cv.getContext("2d"); c.clearRect(0, 0, n, n);
    drawPx(c, t.px, t.pal, Math.floor((n - w) / 2), Math.floor((n - h) / 2), 1);
  }

  // ---------- controls ----------
  startBtn.addEventListener("click", start);
  againBtn.addEventListener("click", start);
  lookBtn.addEventListener("click", () => { if (state === "looking") walkOn(); else look(inReach()); });
  phoneEl.addEventListener("click", openPhone);
  phoneEl.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); e.stopPropagation(); openPhone(); } });
  canvas.addEventListener("click", (e) => {
    if (state === "looking") { walkOn(); return; }
    if (state !== "walking") return;
    const r = canvas.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
    const pad = G().s * 3;
    for (let i = 0; i < order.length; i++) {
      const b = thingBox(i);
      if (x > b.x - pad && x < b.x + b.w + pad && y > b.y - pad * 2 && y < b.y + b.h + pad) { look(i); return; }
    }
  });
  document.addEventListener("keydown", (e) => {
    if (e.repeat) return;
    if (e.key === " " && !(e.target instanceof HTMLButtonElement) && e.target !== phoneEl) {
      e.preventDefault();
      if (state === "looking") walkOn(); else look(inReach());
    }
  });

  // ---------- sound that keeps working ----------
  let audio = null, master = null, soundOn = true;
  function ensureAudio() {
    try {
      if (!audio) {
        audio = new (window.AudioContext || window.webkitAudioContext)();
        master = audio.createGain(); master.gain.value = 0.9; master.connect(audio.destination);
      }
      if (audio.state !== "running") audio.resume().catch(() => {});
    } catch (e) { audio = null; }
  }
  ["pointerdown", "keydown", "touchstart"].forEach(ev => document.addEventListener(ev, ensureAudio, { passive: true }));
  document.addEventListener("visibilitychange", () => { if (!document.hidden && audio) audio.resume().catch(() => {}); });
  function beep(freq, dur, type = "square", delay = 0, vol = 0.05) {
    if (!soundOn || !audio) return;
    if (audio.state !== "running") audio.resume().catch(() => {});
    const t = audio.currentTime + delay + 0.005;
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.03);
    o.onended = () => { o.disconnect(); g.disconnect(); };
  }
  soundBtn.addEventListener("click", () => {
    ensureAudio();
    soundOn = !soundOn;
    soundBtn.textContent = soundOn ? "SOUND ON" : "SOUND OFF";
    soundBtn.setAttribute("aria-pressed", String(soundOn));
    if (soundOn) beep(880, 0.05);
  });

  // ---------- drawing ----------
  function resize() {
    const r = canvas.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.max(1, Math.round(r.width * dpr)); canvas.height = Math.max(1, Math.round(r.height * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.imageSmoothingEnabled = false;
    W = r.width; H = r.height;
  }
  if ("ResizeObserver" in window) new ResizeObserver(resize).observe(canvas);
  window.addEventListener("resize", resize);

  function drawPx(c, px, pal, x, y, s) {
    px.forEach((row, j) => [...row].forEach((ch, i) => { if (pal[ch]) { c.fillStyle = pal[ch]; c.fillRect(Math.round(x + i * s), Math.round(y + j * s), Math.ceil(s), Math.ceil(s)); } }));
  }
  const mix = (a, b, k) => { const p = (h) => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)); const A = p(a), B = p(b); return "rgb(" + A.map((v, i) => Math.round(v + (B[i] - v) * k)).join(",") + ")"; };
  const hash = (n) => { const x = Math.sin(n * 127.1) * 43758.5453; return x - Math.floor(x); };

  const WALKER = {
    pal: { h: "#1c1512", s: "#c98c5e", b: "#3ef0ff", p: "#2a2160", k: "#0b0820", g: "#8a5a2a" },
    a: ["...hhhh...", "..hhhhhh..", "..hhssss..", "..hsssss..", "...ssss...", "...bbbb...", "..bbbbbb..", ".sbbbbbbs.", ".sbbbbbbs.", "..bbbbbbg.", "..pppppp..", "..pp..pp..", "..pp..pp..", "..pp..pp..", "..kk..kk.."],
    b: ["...hhhh...", "..hhhhhh..", "..hhssss..", "..hsssss..", "...ssss...", "...bbbb...", "..bbbbbb..", "..sbbbbs..", "..sbbbbs..", "..bbbbbbg.", "..pppppp..", "...pppp...", "...p.pp...", "..pp..p...", ".kk...kk.."],
  };

  function frame(now) {
    const dt = lastNow ? Math.min(60, now - lastNow) : 16;
    lastNow = now;
    const g = G(), { s, walkerX, ground } = g;
    const moving = (state === "walking" || state === "phone") && !paused;
    const stepping = moving || stroll;
    if (moving) {
      cam += g.speed * dt * (rush ? 3 : 1);
      if (state === "walking" && now > nextPing) { ping(); nextPing = now + 5200 + localInts(1, 0, 3000)[0]; }
      if (cam >= endX()) { cam = endX(); if (sparkAt >= 0) missed(); }
    }
    progEl.style.width = (order.length ? Math.min(100, cam / endX() * 100) : 0) + "%";

    // sky: a calm morning; after the spark, the days start to fly
    const days = state === "found" && !reduceMotion ? (now - foundAt) / 2400 : 0;
    const night = days ? (1 - Math.cos(days * Math.PI * 2)) / 2 : 0;
    const sky = ctx.createLinearGradient(0, 0, 0, ground);
    sky.addColorStop(0, mix("#34488f", "#0b0a26", night));
    sky.addColorStop(1, mix("#e7a06a", "#2a2160", night));
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, ground);
    // sun
    ctx.fillStyle = mix("#ffd84a", "#e9e6ff", night);
    const sunS = Math.max(4, s * 1.4);
    ctx.fillRect(Math.round(W * 0.78 - (days % 1) * W * 0.2), Math.round(H * 0.28 + night * H * 0.1), sunS * 5, sunS * 5);

    // buildings, slower than the street
    const par = cam * 0.45, bw = Math.max(90, s * 26);
    const b0 = Math.floor(par / bw) - 1;
    for (let k = b0; k < b0 + Math.ceil(W / bw) + 3; k++) {
      const x = k * bw - par, hgt = H * (0.28 + hash(k) * 0.3), col = ["#2b2457", "#352a63", "#241f4d", "#3a2f6e"][Math.floor(hash(k + 9) * 4)];
      ctx.fillStyle = mix(col, "#0b0820", night * 0.5);
      ctx.fillRect(Math.round(x), Math.round(ground - hgt), Math.ceil(bw - s), Math.ceil(hgt));
      ctx.fillStyle = night > 0.5 ? "rgba(255,216,74,0.55)" : "rgba(233,230,255,0.12)";
      for (let wy = ground - hgt + s * 3; wy < ground - s * 6; wy += s * 5) for (let wx = x + s * 3; wx < x + bw - s * 5; wx += s * 5) if (hash(k * 31 + wx * 0.1 + wy) > 0.35) ctx.fillRect(Math.round(wx), Math.round(wy), s * 2, s * 2);
    }

    // pavement
    ctx.fillStyle = "#3a3360"; ctx.fillRect(0, ground, W, H - ground);
    ctx.fillStyle = "#4a4270"; ctx.fillRect(0, ground, W, Math.max(2, s * 0.6));
    ctx.fillStyle = "#2f2a52";
    const tile = s * 14;
    for (let x = -((cam) % tile); x < W; x += tile) ctx.fillRect(Math.round(x), ground + s, Math.max(2, s * 0.4), H - ground);

    // the office at the end of the walk
    const ox = endX() - cam + walkerX + s * 4;
    if (ox < W + 10) {
      ctx.fillStyle = "#4a4270"; ctx.fillRect(ox, ground - s * 34, s * 30, s * 34);
      ctx.fillStyle = "#6a5a8a"; ctx.fillRect(ox + s * 2, ground - s * 30, s * 26, s * 4);
      ctx.fillStyle = "#1e3550"; ctx.fillRect(ox + s * 10, ground - s * 16, s * 10, s * 16);
      ctx.fillStyle = "#e9e6ff"; ctx.font = Math.max(7, Math.round(s * 2)) + "px 'Press Start 2P', monospace"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText("WORK", ox + s * 15, ground - s * 28);
    }

    // the ten things
    const reach = state === "walking" ? inReach() : -1;
    order.forEach((t, i) => {
      const b = thingBox(i);
      if (b.x > W + 20 || b.x + b.w < -20) return;
      const isSpark = i === sparkAt;
      if (isSpark && glowAt) {                       // only once it's found, or once it's too late
        const k = reduceMotion ? 1 : 0.6 + 0.4 * Math.sin((now - glowAt) / 180);
        ctx.fillStyle = "rgba(255,216,74," + (0.22 * k) + ")";
        ctx.fillRect(b.x - s * 4, b.y - s * 4, b.w + s * 8, b.h + s * 4);
        ctx.fillStyle = "rgba(255,216,74," + (0.35 * k) + ")";
        ctx.fillRect(b.x - s * 2, b.y - s * 2, b.w + s * 4, b.h + s * 2);
      }
      drawPx(ctx, t.px, t.pal, b.x, b.y, s);
      if (looked.has(i) && !(isSpark && glowAt)) {    // you've seen this one
        ctx.fillStyle = "rgba(11,8,32,0.35)"; ctx.fillRect(b.x, b.y, b.w, b.h);
      }
      if (i === reach && looksLeft > 0) {             // corner brackets on the thing in reach
        const p = s * 2, L = s * 3;
        ctx.fillStyle = "#e9e6ff";
        const pulse = reduceMotion ? 0 : Math.round(Math.sin(now / 200) * s * 0.5);
        const x0 = b.x - p - pulse, y0 = b.y - p - pulse, x1 = b.x + b.w + p + pulse, y1 = b.y + b.h + p * 0.5 + pulse;
        const th = Math.max(2, s * 0.6);
        [[x0, y0, 1, 1], [x1, y0, -1, 1], [x0, y1, 1, -1], [x1, y1, -1, -1]].forEach(([x, y, dx, dy]) => {
          ctx.fillRect(dx > 0 ? x : x - L, dy > 0 ? y : y - th, L, th);
          ctx.fillRect(dx > 0 ? x : x - th, dy > 0 ? y : y - L, th, L);
        });
      }
    });

    // you
    if (state !== "missed") {
      const stepFrame = stepping && !reduceMotion ? Math.floor(cam / (s * 7)) % 2 : 0;
      const wpx = stepFrame ? WALKER.b : WALKER.a;
      const ws = Math.max(3, Math.round(s * 1.15));
      drawPx(ctx, wpx, WALKER.pal, Math.round(walkerX - 5 * ws), Math.round(ground - 15 * ws), ws);
      if (state === "phone") { ctx.fillStyle = "#3ef0ff"; ctx.fillRect(Math.round(walkerX + 2 * ws), Math.round(ground - 8.5 * ws), ws * 1.4, ws * 2); }
      if (stepping && stepFrame !== lastStep) { lastStep = stepFrame; beep(stepFrame ? 140 : 120, 0.03, "triangle", 0, 0.025); }
    }
    requestAnimationFrame(frame);
  }
  let lastStep = 0, stroll = false;
  setInterval(() => {                            // LOOK is only lit when something is in reach
    const can = state === "looking" || (state === "walking" && looksLeft > 0 && inReach() >= 0);
    if (lookBtn.disabled === can) lookBtn.disabled = !can;
    lookBtn.firstChild.textContent = state === "looking" ? "WALK ON" : looksLeft > 0 || state === "ready" ? "LOOK" : "NO LOOKS LEFT";
  }, 100);

  setEyes();
  resize();
  requestAnimationFrame(frame);
})();
</script>
