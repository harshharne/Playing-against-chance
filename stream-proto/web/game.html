<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Playing Against Chance</title>
<style>
/* One life, unfolding. The painted world fills the whole window, edge to edge; the only text is one soft
   narrative window at the bottom and the option cards, spread evenly across the bottom. Minimal, a clean sans.
   F = real fullscreen (the camera window hides there). D = a hidden debug line (die, fps).
   U = switch the style of the screen: GLASS (this file's soft windows and cards) or FOG (ui-fog.js: dark edges, a white
   fog the world forms in, letters only). Remembered in this browser. A switch during a pick waits until it's done. */
:root {
  --ink: #141414; --dim: #8a8a8a; --bg: #fff; --fade: 1.2s;
  --glass: rgba(255,255,255,0.52); --glass-hi: rgba(255,255,255,0.82); --edge: rgba(255,255,255,0.7);
  --cw: clamp(92px, 9.5vw, 138px); --ch: calc(var(--cw) * 1.22); --deck-h: calc(var(--ch) + 40px);
  color-scheme: light;
}
html, body { height: 100%; margin: 0; overflow: hidden; }
body { background: var(--bg); color: var(--ink); font-family: "Inter", ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", sans-serif; -webkit-font-smoothing: antialiased; }
.gen { position: fixed; inset: 0; overflow: hidden; background: #eceae6; }
/* the screen is OFF (black) until a throw begins a life; the black fog rolls away over WAKE (offfog.js), and back in after the ledger */
.off { position: absolute; inset: 0; z-index: 1000; background: #000; opacity: 1; transition: opacity var(--offT, 3s) ease; cursor: none; }
.off.up { opacity: 0; pointer-events: none; }
.gen .debug { z-index: 1001; }
.gen canvas { width: 100%; height: 100%; object-fit: cover; display: block; }
.gen canvas.birth, .gen canvas.baby { position: absolute; inset: 0; opacity: 0; pointer-events: none; }   /* drawn scenes and the baby, over the live picture */
.pip { position: absolute; top: 14px; right: 14px; width: clamp(96px, 12%, 170px); aspect-ratio: 16 / 9; object-fit: cover; transform: scaleX(-1); border-radius: 8px; opacity: 0.85; background: #ddd; transition: opacity 0.4s; }
body.full .pip { opacity: 0; pointer-events: none; }        /* fullscreen: no camera window (the camera still runs) */
.debug { position: absolute; left: 12px; top: 10px; font: 11px/1.4 ui-monospace, Menlo, monospace; color: #111; background: rgba(255,255,255,0.8); padding: 4px 8px; border-radius: 6px; }
.debug[hidden] { display: none; }

/* the one soft window, at the bottom; it lifts above the cards while they're up */
.say { position: absolute; left: 50%; bottom: 5%; transform: translate(-50%, 8px); box-sizing: border-box; width: max-content; max-width: min(680px, calc(100% - 40px));
       padding: 16px 26px; border-radius: 18px; background: var(--glass); border: 1px solid var(--edge);
       backdrop-filter: blur(16px) saturate(1.15); -webkit-backdrop-filter: blur(16px) saturate(1.15); box-shadow: 0 10px 40px rgba(0,0,0,0.10);
       text-align: center; display: flex; flex-direction: column; gap: 6px; opacity: 0; pointer-events: none;
       transition: opacity var(--fade) ease, transform var(--fade) ease, bottom 0.7s cubic-bezier(.2,.75,.2,1); }
.say.on { opacity: 1; transform: translate(-50%, 0); }
body.cards .say { bottom: calc(var(--deck-h) + 4% + 14px); }
.say { font-family: var(--font-event, inherit); }                 /* the event's words (typefaces.js) */
.say .k { font-size: 9.5px; font-weight: 600; letter-spacing: 0.18em; color: #6d6d6d; text-transform: uppercase; }
.say .t { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.2; text-wrap: balance; }
.say .s { font-size: 14.5px; line-height: 1.45; color: #333; text-wrap: balance; }
.say .go { pointer-events: auto; }
.say.bridge { padding: 18px 30px; background: rgba(255,255,255,0.4); }
.say.bridge .s { font-size: 19px; font-weight: 400; color: #1b1b1b; }
.say.small { padding: 10px 18px; border-radius: 12px; background: rgba(255,255,255,0.3); box-shadow: none; }
.say.small .s { font-size: 12.5px; color: #333; }
.say.quote .s { font-size: 18px; font-style: italic; }
.say.end { text-align: left; width: min(640px, calc(100% - 40px)); max-height: 78%; overflow: auto; pointer-events: auto; gap: 10px; }
.say.end table { border-collapse: collapse; font-size: 13px; line-height: 1.4; }
.say.end td { padding: 3px 14px 3px 0; vertical-align: top; }
.say.end td:first-child { color: var(--dim); font-variant-numeric: tabular-nums; white-space: nowrap; }
.say.end td:nth-child(2) { color: #555; white-space: nowrap; }
.say.end i { color: #777; font-style: normal; }
.go { align-self: center; margin-top: 6px; font: inherit; font-size: 12px; font-weight: 600; letter-spacing: 0.14em; padding: 11px 26px; border: 0; border-radius: 30px; background: var(--ink); color: #fff; cursor: pointer; }
.say.end .go { align-self: flex-start; }
button:focus-visible { outline: 3px solid #888; outline-offset: 2px; }

/* the die, landed: big and alone */
.big { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; opacity: 0; transition: opacity var(--fade); }
.big.on { opacity: 1; }
.big .disc { width: clamp(180px, 38vh, 360px); aspect-ratio: 1; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
             background: rgba(255,255,255,0.72); border: 1px solid var(--edge); backdrop-filter: blur(18px) saturate(1.15); -webkit-backdrop-filter: blur(18px) saturate(1.15); box-shadow: 0 16px 50px rgba(0,0,0,0.14); color: var(--ink); }
.big b { font-size: clamp(90px, 22vh, 210px); font-weight: 200; line-height: 1; font-family: var(--font-event, inherit); }
.big span { font-size: 12px; font-weight: 600; letter-spacing: 0.3em; text-transform: uppercase; color: #444; opacity: 0; transition: opacity 0.6s; }
.big span.on { opacity: 0.9; }

/* ---- the cards: glass plaques spread evenly across the full width of the bottom ---- */
.deck { position: absolute; left: 3%; right: 3%; bottom: 4%; height: var(--deck-h); display: flex; justify-content: space-evenly; align-items: flex-end; }
.deck[hidden] { display: none; }
.card { position: relative; flex: none; width: var(--cw); height: var(--ch); box-sizing: border-box;
        padding: 11px 11px; border-radius: 14px; background: var(--glass); border: 1px solid var(--edge);
        backdrop-filter: blur(14px) saturate(1.2); -webkit-backdrop-filter: blur(14px) saturate(1.2);
        box-shadow: 0 14px 34px rgba(0,0,0,0.14), inset 0 1px 0 rgba(255,255,255,0.8);
        display: flex; flex-direction: column; gap: 6px; text-align: left; font: inherit; font-family: var(--font-option, inherit); color: var(--ink); cursor: pointer;
        transform-origin: 50% 100%;
        transition: transform 0.8s cubic-bezier(.2,.75,.2,1), opacity 0.6s ease, height 0.6s ease, background 0.4s; }
.card .nm { font-size: 12px; font-weight: 650; line-height: 1.2; letter-spacing: -0.005em; }
.card .rv { font-size: 10.5px; line-height: 1.32; color: #3a3a3a; opacity: 0; transform: translateY(6px); transition: opacity 0.4s, transform 0.4s; }
.card .tg { margin-top: auto; font-size: 9.5px; font-weight: 600; letter-spacing: 0.06em; color: #222; opacity: 0; transition: opacity 0.6s; }
.card .tg b { display: block; font-size: 15px; letter-spacing: -0.01em; font-weight: 600; }
.card .hint { font-size: 9px; letter-spacing: 0.08em; color: #555; opacity: 0; transition: opacity 0.6s; }
.card.pre { opacity: 0; transform: translateY(60px); }
.deck.open .card:hover, .deck.open .card.focus { transform: translateY(-14px) scale(1.08); background: var(--glass-hi); z-index: 5; }
.deck.open .card:hover .rv, .deck.open .card.focus .rv { opacity: 1; transform: none; }
.deck.open.hovering .card:not(:hover):not(.focus) { opacity: 0.55; }
.card.locked { transform: translate(var(--dx, 0px), -8px) scale(1.2); height: calc(var(--cw) * 1.6); background: var(--glass-hi); z-index: 6; cursor: default; }
.card.locked .rv { opacity: 1; transform: none; }
.card.locked.show .tg, .card.locked.show .hint { opacity: 1; }
.card.away { opacity: 0; transform: translateY(120px); pointer-events: none; }
.card.locked.gone { opacity: 0; }

/* the allotted card, turning over, where your card was locked */
.flip { position: absolute; left: 50%; bottom: calc(4% + 8px); width: calc(var(--cw) * 1.3); height: calc(var(--cw) * 1.6); transform: translateX(-50%); perspective: 900px; opacity: 0; transition: opacity 0.8s; pointer-events: none; }
.flip.on { opacity: 1; }
.flip .in { position: absolute; inset: 0; transform-style: preserve-3d; transform: rotateY(180deg); transition: transform 1.8s cubic-bezier(.45,.05,.2,1); }
.flip.turn .in { transform: rotateY(0deg); }
.flip .face, .flip .back { position: absolute; inset: 0; box-sizing: border-box; border-radius: 18px; backface-visibility: hidden; -webkit-backface-visibility: hidden; border: 1px solid var(--edge); box-shadow: 0 14px 40px rgba(0,0,0,0.18); }
.flip .face { padding: 12px; background: var(--glass-hi); display: flex; flex-direction: column; gap: 10px; text-align: left; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.flip .face small { font-size: 9px; font-weight: 600; letter-spacing: 0.18em; color: #777; }
.flip .face b { font-size: 14px; line-height: 1.2; }
.flip .face span { font-size: 11px; line-height: 1.35; color: #333; }
.flip .back { transform: rotateY(180deg); background: repeating-linear-gradient(45deg, rgba(255,255,255,0.55) 0 8px, rgba(255,255,255,0.3) 8px 16px); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
@media (prefers-reduced-motion: reduce) { .card, .flip .in, .say { transition-duration: 0.01s !important; } }
</style>
</head>
<body>
<div class="gen" id="gen">
  <canvas id="out" width="640" height="384" aria-label="The life"></canvas>
  <canvas id="baby" class="baby" aria-hidden="true"></canvas>
  <canvas id="birth" class="birth" aria-hidden="true"></canvas>
  <canvas id="map" class="birth" aria-hidden="true"></canvas>
  <video id="pip" class="pip" muted playsinline aria-label="Your camera"></video>
  <div class="say" id="say" aria-live="polite"></div>
  <div class="big" id="big" aria-live="polite"><div class="disc"><b id="bigN"></b><span id="bigW"></span></div></div>
  <div class="deck" id="deck" role="group" aria-label="Your options" hidden></div>
  <div class="flip" id="flip" aria-live="polite"><div class="in"><div class="face" id="flipFace"></div><div class="back"></div></div></div>
  <div class="off" id="off" aria-hidden="true"></div>
  <div class="debug" id="debug" hidden></div>
</div>

<script src="vendor/Tone.js"></script>
<script type="module">
// ============================================================================
//  Playing Against Chance — Life Trajectory v1. One life, 19 events, from trajectory.json.
//  Chosen = you pick a card and throw the die; a miss is allotted by random.org.
//  Happens = random.org picks one of three hidden outcomes. Fluke = something tiny, paid off later.
//  The piece is the TRANSITION: nothing cuts. The world is always on its way from one place to the next.
//  The unfolding (the beats, all minimums, all in trajectory.json "pacing", tuned live on /panel):
//    ARRIVE  bridge line · the age counts up · the world changes, picture by picture, for as long as the years
//            that pass (a year takes ARRIVE: PER YEAR) · the avatar ages
//    SETTLE  name + setup in a soft window      CARDS  rise one by one, wait for you
//    LOCK    your card to the centre, the target   THROW  waits for the die; everything holds still while it rolls
//    LAND    the number, big and alone, then hit or miss   MISS  the allotted card turns over
//    LINGER  what happened stays while the world turns into it
//  Never shown: odds, percentages, the hidden outcomes, that a fluke mattered (until it does).
// ============================================================================
import { createLive } from "./live.js";
import { createDiceReader } from "./dice.js";
import { createDiceReader as createRemoteReader } from "./dice-remote.js";
import { findCamera } from "./cameras.js";
import { createBirth } from "./birth.js";
import { createWorldMap } from "./worldmap.js";
import { createBaby } from "./baby.js";
import { createFog } from "./ui-fog.js";
import { createOffFog } from "./offfog.js";
import { createBookkeeper } from "./bookkeeper.js";
import { createSound } from "./sound.js";
import { createWorldClock } from "./worldclock.js";
import { applyTypefaces } from "./typefaces.js";

const $ = (id) => document.getElementById(id);
const sayEl = $("say"), bigEl = $("big"), deckEl = $("deck"), flipEl = $("flip"), debugEl = $("debug");
// every wait in the life goes through this, so PAUSE on /panel holds the whole life where it is
let paused = false;
const sleep = (ms) => new Promise(r => {
  let left = ms, last = performance.now();
  const tick = () => { const now = performance.now(); if (!paused) left -= now - last; last = now; if (left <= 0) r(); else setTimeout(tick, Math.min(100, Math.max(1, left))); };
  setTimeout(tick, Math.min(100, Math.max(0, ms)));
});
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const up = (s) => String(s).toUpperCase();
const nextFrame = () => new Promise(r => requestAnimationFrame(() => r()));

const live = createLive({ out: $("out"), video: $("pip"), params: () => ({}) });
const birth = createBirth($("birth"));                         // the egg and the sperm (Birth: "drawn": "egg")
const worldmap = createWorldMap($("map"));                     // Where: the world map ("map")
const baby = createBaby($("baby"), live);                      // Body: the baby, then the live kid takes over ("baby")
const SCENES = { egg: birth, map: worldmap };

// ---------- the style of the screen: GLASS or FOG (U switches; remembered in this browser) ----------
const fog = createFog({ root: $("gen"), sec: (k) => sec(k) });
let ui = "glass", uiNext = null, picking = false;
try { ui = localStorage.getItem("pac-ui") === "fog" ? "fog" : "glass"; } catch (e) {}
const FOG = () => ui === "fog";
function applyUI(next) {
  if (picking) { uiNext = next; return; }                       // never in the middle of a pick: right after it
  ui = next; uiNext = null;
  try { localStorage.setItem("pac-ui", ui); } catch (e) {}
  sayEl.classList.remove("on"); sayOn = false;                  // whatever the other style was showing goes
  fog.active(ui === "fog");
  live.setPortraitPlace(ui === "fog" ? { scale: 0.86 } : null);   // the avatar stands in the middle in both styles (a little smaller in the fog)
}
// the Bookkeeper: the voice in the room (bookkeeper.md / bookkeeper.json on the server). It speaks at three moments of
// an event (arriving, the cards, what happened); the text boxes step back while it's there (unless show_text).
// the sound under the voice (sound.js: the bed, the place, the cues). It ducks while the Bookkeeper speaks.
const sound = createSound();
// the ever-changing world (worldclock.js): chance picks what the background shows, how, and when. WORLD RULES on /panel:
// "ever" (this) or "continuous" (the earlier way: one picture morphing into the next through the passage)
let worldRules = "ever";
const EVER = () => worldRules === "ever";
const clock = createWorldClock({ live, sound, sleep, state: () => ({
  paused, screenUp, held, covered: !!scene, picking: turn === "pick", throwing: turn === "throw", tempo,
  lightWords: CX().light_words ? new RegExp(`\\b(${CX().light_words})\\b`, "i") : null,
  light: lightAt(S.ageF), place: S.place || "", means: S.means && S.ageF < (+CX().means_until || 0) ? S.means : "",
  shotMin: +P.shot_min || 2, shotMax: +P.shot_max || 10, weather: CX().weather || [] }) });
// what an event brings to the clock's pool besides its places: its things and people (trajectory.json), and the times
// you live in (context.intrusions, by age)
function intrusionsAt(age) { let w = []; for (const [a, list] of CX().intrusions || []) if (age >= a) w = list; return w; }
const evNow = () => (T && T.events[Math.max(0, evIdx)]) || {};
if (new URLSearchParams(location.search).has("test")) window.__pac = { clock, live, sound,   // (for the automated tests only)
  panel: () => ({ tempo, heritage: heritageMix, ui, rules: worldRules, voiceOn, fonts: fontsNow.slice(), ts: getComputedStyle(document.querySelector(".fogl")).getPropertyValue("--ts").trim(),
                  fontVar: getComputedStyle(document.documentElement).getPropertyValue("--font-event").trim(), sound: sound._debug().mix, bk: V._live() }),
  life: () => S && { ledger: S.ledger.map(r => r[1]), age: S.ageF, avatar: S.avatar, baby: babyShown, ended: !!S.ended, evIdx, snaps: snaps.length } };   // (for the automated tests only)
addEventListener("pac-voice", (e) => sound.duck(!!(e.detail && e.detail.speaking)));
const V = createBookkeeper({ onPick: (name) => deckPick ? deckPick(name) : { ok: false, reason: "the cards aren't up" },
  context: () => S ? [wentBack ? "[GAME] record: the game went back one moment, so this part of the life plays again. The life so far, for your books (don't retell it, don't mention going back):"
                               : "[GAME] record: the voice had to reconnect. The life so far, for your books (don't retell it):", ...lifeLines(), `age now: ${Math.floor(S.ageF)}`].join("\n") : "" });
let wentBack = false;                                           // this page picked the life up after BACK
let scene = null;                                              // the drawn scene on screen now
let held = false;
function holdAll(on) { held = !!on; live.hold(on); for (const x of [birth, worldmap, baby]) x.hold(on); }   // while the die rolls, everything holds still
async function toScene(name) {                                 // crossfade from one drawn scene to the next (or to the painted world)
  const next = SCENES[name] || null;
  if (next === scene) return;
  if (scene) scene.hide(sec("world_fade") * 1.4);
  scene = next;
  if (next) await next.show(sec("world_fade"));
}

// ---------- the life and its timings (trajectory.json; the timings change live from /panel) ----------
const WK0 = { keep: 0.25, turn_keep: 0.45, chapter_keep: 0.1, breathe: 5, breathe_keep: 0.4, morph_steps: 12, director: 1, director_lines: 0, director_wait: 2 };
let T = null, P = {}, WK = { ...WK0 };
let tempo = 1;                                                  // TEMPO on /panel: every timing x this
let heritageMix = 0.5;
let fontsNow = [null, null];                                     // EVENT FONT / OPTION FONT on /panel (typefaces.js)
applyTypefaces();                                               // (the defaults until the panel's settings come)                                          // HERITAGE on /panel: whose face (0 yours .. 1 the birthplace's)
const sec = (k) => Math.max(0, +P[k] || 0) * 1000 * tempo;
function setPacing(doc) {
  P = doc.pacing || {}; WK = { ...WK0, ...(doc.world || {}) };
  if (T && doc.context) T.context = doc.context;
  document.documentElement.style.setProperty("--fade", (sec("fade") / 1000) + "s");
}
async function loadLife() {
  const doc = await (await fetch("/trajectory", { cache: "no-store" })).json();
  if (doc.error) throw new Error(doc.error);
  T = doc; setPacing(doc);
}
let paceSeen = null;
setInterval(async () => {                                     // a slider moved on /panel: take the new timings now
  try {
    const m = await (await fetch("/config", { cache: "no-store" })).json();
    if (paceSeen !== null && m.pace !== paceSeen) setPacing(await (await fetch("/trajectory", { cache: "no-store" })).json());
    paceSeen = m.pace;
  } catch (e) {}
}, 1500);

// ---------- chance: random.org (through the server) ----------
let source = "";
async function draw(lo, hi) {
  try {
    const r = await (await fetch(`/draw?n=1&lo=${lo}&hi=${hi}`, { cache: "no-store" })).json();
    source = r.source; return r.values[0];
  } catch (e) { source = "LOCAL"; return lo + Math.floor(Math.random() * (hi - lo + 1)); }
}

// ---------- the one soft window: the old text fades out fully before the new one fades in ----------
let sayOn = false;
async function unsay() {
  if (FOG()) return fog.unsay();
  if (!sayOn) return;
  sayOn = false; sayEl.classList.remove("on");
  await sleep(sec("fade"));
}
const plainText = (h) => { const d = document.createElement("div"); d.innerHTML = String(h || ""); return d.textContent.replace(/\s+/g, " ").trim(); };
async function say({ k = "", t = "", s = "", cls = "", begin = false, force = false }) {
  // every line, shown or not, goes to the Bookkeeper (Voice Lab): in the fog most words are only spoken
  dispatchEvent(new CustomEvent("pac-say", { detail: { k: plainText(k), t: plainText(t), s: plainText(s), cls, shown: !FOG() || !/bridge/.test(cls) } }));
  if (FOG()) return fog.say({ k, t, s, cls, begin, onBegin: () => beginAction && beginAction() });
  await unsay();
  if (!V.showText && !begin && !force && cls !== "end") return;   // the voice carries the words now
  sayEl.className = "say " + cls;
  sayEl.innerHTML = (k ? `<span class="k">${k}</span>` : "") + (t ? `<span class="t">${t}</span>` : "") + (s ? `<span class="s">${s}</span>` : "")
    + (begin ? `<button type="button" class="go" id="begin">BEGIN</button>` : "");           // the only button there is
  if (begin) $("begin").addEventListener("click", () => beginAction && beginAction());
  await nextFrame(); await nextFrame();
  sayEl.classList.add("on"); sayOn = true;
  await sleep(sec("fade"));
}
applyUI(ui);                                                   // the style this browser used last
const kick = (ev) => `AGE ${Math.floor(S.ageF)} · ${esc(ev.title)}`;    // over an outcome
const kickAge = () => `AGE ${Math.floor(S.ageF)}`;                           // over the event's own name

// ---------- what the Bookkeeper is told: the facts of each moment ([GAME] messages; bookkeeper.md says what to do with them) ----------
// The game owns every fact. MUST CARRY = what its line has to include, unchanged; the rest it says in its own words.
const PHASE_WORDS = ["birth", "growing up (to 22)", "adulthood (23 to 48)", "later life (52 on)"];   // (said to the voice: plain words it can't quote oddly)
const G = (moment, lines) => [`[GAME] ${moment}`, `phase: ${PHASE_WORDS[Math.min(S.phase, PHASE_WORDS.length - 1)]}`, ...lines.filter(Boolean)].join("\n");
const ageWords = (a) => a < 1 ? "a newborn" : `${Math.floor(a)}`;
function arriveCue(ev, prev) {
  const years = Math.max(0, Math.round((+ev.age || 0) - S.ageF));
  const back = ev.reveals && S.planted[ev.reveals];
  return G("arrive", [
    prev ? "" : "the life begins: open the account",
    prev && prev.chapter ? "a new phase of life begins here" : "",
    prev && prev.bridge ? `bridge (retell it in your own words, don't quote it): ${prev.bridge}` : "",
    years ? `years passing now: ${years}` : "",
    `age now: ${ageWords(+ev.age || 0)} (say it to them your own way, or weave it in; never "they are N years old")`,
    `next: ${ev.title} (${ev.type === "chosen" ? "a choice, then a throw of the die" : ev.type === "happens" ? "chance decides, the player watches" : "a small thing"})`,
    ev.type === "chosen" && ev.setup ? `setup: ${ev.setup}` : "",
    ev.type === "happens" ? (back ? "something small from long ago is coming back. Don't say what." : "something is about to happen. You don't know what.") : "",
  ]);
}
const cardsCue = (ev) => G("cards", [`event: ${ev.title}`, `${ev.setup || ""}`, "the cards:", ...ev.cards.map(c => `- ${c.name}: ${c.reveals}`)]);
function outcomeCue(ev, c, got, how, n, tries) {
  const genes = got && got.genes ? `traits emerging on the baby: ${got.genes.map(g => g.label).join(", ")} (and their own skin, from the camera)` : "";

// ---------- the deck ----------
let deckKeys = null, deckPick = null;                          // deckPick(name): the player chose by voice
function matchCard(cards, said) {                               // what the player said -> that card (or -1)
  const STOP = new Set(["the", "a", "an", "and", "of", "to", "in", "on", "at", "for", "your", "you", "i", "id", "ill", "im", "want", "take",
                        "choose", "pick", "go", "with", "one", "card", "please", "that", "this", "it", "me", "my", "is", "be", "like", "would", "lets", "let"]);
  const norm = (x) => String(x || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase()   // (Európa -> europa)
    .replace(/[’']/g, "").replace(/[^a-z0-9 ]+/g, " ").replace(/\s+/g, " ").trim();
  const near = (a, b) => {                                       // the same word, misheard a little (europa / europe)
    if (a === b) return true;
    if (Math.min(a.length, b.length) < 3) return false;           // (ats / arts)
    if (Math.abs(a.length - b.length) > 3) return false;          // (south is not southeast)
    if (a.length > 4 && (a.startsWith(b) || b.startsWith(a))) return true;
    if (a.length >= 5 && b.length >= 5 && a.slice(0, 5) === b.slice(0, 5)) return true;   // (salary / salaried)
    const L = Math.max(a.length, b.length) >= 6 ? 2 : 1;
    if (Math.abs(a.length - b.length) > L) return false;
    let prev = Array.from({ length: b.length + 1 }, (_, j) => j);
    for (let i = 1; i <= a.length; i++) {
      const cur = [i];
      for (let j = 1; j <= b.length; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      prev = cur;
    }
    return prev[b.length] <= L;
  };
  const words = (x) => norm(x).split(" ").filter(w => w.length > 2 && !STOP.has(w));
  const want = norm(said), names = cards.map(c => norm(c.name));
  let i = names.indexOf(want);
  if (i >= 0) return i;
  const ORD = { first: 0, second: 1, third: 2, fourth: 3, fifth: 4, sixth: 5, seventh: 6, eighth: 7, last: cards.length - 1 };
  const NUM = { one: 0, two: 1, three: 2, four: 3, five: 4, six: 5, seven: 6, eight: 7 };
  const o = want.match(/\b(first|second|third|fourth|fifth|sixth|seventh|eighth|last)\b/) || want.match(/\bnumber (one|two|three|four|five|six|seven|eight|[1-8])\b/);
  if (o) { const k = ORD[o[1]] ?? NUM[o[1]] ?? (+o[1] - 1); if (k >= 0 && k < cards.length) return k; }
  const heard = new Set(words(said));                            // the card whose name's words were heard most (and alone)
  const hits = names.map(nm => words(nm).filter(w => [...heard].some(h => near(h, w))));
  const owners = (w) => hits.filter(hs => hs.includes(w)).length;   // a word only one card has says more ("middle")
  const score = names.map((nm, k) => { const ws = words(nm); return ws.length ? hits[k].length / ws.length + 0.2 * hits[k].filter(w => owners(w) === 1).length : 0; });
  const best = Math.max(...score), at = score.indexOf(best);
  return best >= 0.3 && score.filter(x => x === best).length === 1 ? at : -1;
}

    let spoken = -1;

// The bridge, the years, the world and the avatar, together. The more years pass, the longer the change takes

function arriveMs(ev, prev) {

  const dur = arriveMs(ev, prev);
  sound.age(ev.age); sound.cue("arrive", dur);                  // the bed moves with the years
  let handover = null;
  if (prev && prev.drawn === "baby") handover = takeover(sec("takeover"), ev);  // the baby becomes the live kid
  else if ((ev.drawn || null) !== (prev && prev.drawn || null)) toScene(ev.drawn === "baby" ? null : ev.drawn);   // drawn scene -> the next one, or the painted world
  if (!handover) syncAvatar(ev).then(() => portraitTo(ev, dur * 0.8));   // the years show on you, as the world changes
  bridging = true;                                              // (the world is about to change: no breath now)
  const spoken = V.cue(arriveCue(ev, prev));                   // the voice: the years, retold, and what's coming
  V.listen("open");
  if (prev && prev.bridge) await say({ s: esc(prev.bridge), cls: "bridge" });
  const w = ev.scene ? worldFor(`${ev.id}:arrive`, ev.scene, { keep: +(chapter ? WK.chapter_keep : WK.keep), dur: dur * 0.92, age: ev.age, passage: ev.passage }) : null;
  prewrite(ev);                                                 // its branches, if they weren't asked for yet
  bridging = false;
  await Promise.all([ageTo(ev.age, dur * 0.85), sleep(dur), w, handover]);   // (the line goes on while the event begins:
  await unsay();                                                //  the next line waits for it, nothing is cut)

  const i = S.ended ? evIdx : Math.max(0, evIdx - 1);           // the event before this one (after the death: the death again)
  if (!snaps[i]) return false;
  try { sessionStorage.setItem("pac-resume", JSON.stringify({ i, S: snaps[i], snaps: snaps.slice(0, i) })); } catch (e) { return false; }
  location.reload(); return true;
}
function takeResume() {                                          // once: a plain reload starts a new life as before
  try {
    const r = JSON.parse(sessionStorage.getItem("pac-resume") || "null"); sessionStorage.removeItem("pac-resume");
    return r && r.S && r.i >= 0 ? r : null;
  } catch (e) { return null; }
}

async function life(begun = false, resume = null) {             // begun: the throw that starts it already came (on the ledger)
  if (screenUp) await screenTo(false, begun ? 1200 : sec("wake"));   // the last life goes dark first
  await unsay();
  if (!T) await loadLife();
  if (resume && !(resume.i < T.events.length)) resume = null;  // (the trajectory changed under it: a new life)
  S = resume ? resume.S : freshLife(); setPhase(resume ? S.phase || 0 : 0); D.clear(); lastLine = "";
  S.ended = false;
  const start = resume ? resume.i : 0, prev0 = start > 0 ? T.events[start - 1] : null;
  evIdx = resume ? start : -1; snaps = resume ? resume.snaps || [] : [];   // (back: the panel names the event coming up)
  wentBack = !!prev0;
  if (!resume) S.seed = await Promise.race([draw(1, 999999999), sleep(3000).then(() => S.seed)]);   // one draw seeds every roll of this life
  clock.life(S.seed); clock.run(EVER());
  V.stop();                                                     // each life gets a fresh voice, with no memory of the last
  deckGone(); bigEl.classList.remove("on");
  live.setPerson(null); live.setReal(false); live.setPersonAlpha(1); live.setControl({ age: 0, ramp: 1 });
  live.portrait(null); pCache.clear(); photoBlob = null; pShown = { age: -99, wear: "" };
  baby.hide(0); babyShown = false; worldmap.reset(); if (scene) scene.hide(0); scene = null;
  worldmap.load().catch(() => {}); baby.preload();
  await live.whenReady();
  const here = prev0 || T.events[0];                            // back: the world of the event before, as it was left
  world(here.scene, { fresh: true, age: S.ageF });              // a new life: a fresh world, its own seed
  if (here.drawn === "egg") { birth.reset(); toScene("egg"); }
  else if (prev0 && prev0.drawn && prev0.drawn !== "baby" && SCENES[prev0.drawn]) toScene(prev0.drawn);
  if (prev0 && prev0.drawn === "baby" && S.baby) {              // back to just after the Body: the baby again, for the takeover
    const bmp = await Promise.race([portrait([S.baby, skinWords(), ...S.life].join(", "), false), sleep(15000).then(() => null)]);
    if (bmp) { babyShown = true; baby.show(bmp, 0); }
  }
  if (!begun && !resume) await waitThrow("begin");              // black, still, until the die is thrown (or R / Enter, or ROLL on /panel)
  const lit = screenTo(true, sec("wake"));                      // the screen comes up on the first world
  const voice = voiceOn ? V.start(`${new Date().toISOString().slice(0, 19)}-${S.seed}`, { resume: !!prev0 })   // you're at the screen now: the voice comes in
                        : (V.stat.note = "off on the panel", false);   // (back: it's told the life so far)
  pMode = live.avatarWanted() === "portrait" ? "portrait" : "painted";   // (set on /panel; the animator only has to be up by age 8)
  if (pMode === "portrait") lit.then(() => getPhoto());         // your photo, for your portraits (once the screen lights your face)
  setTurn("watch"); holdAll(false);
  avatarAt(S.ageF);
  await Promise.all([lit, sleep(sec("arrive") * 0.6), Promise.race([voice, sleep(8000)])]);
  let prev = prev0;
  for (let k = start; k < T.events.length; k++) {
    const ev = T.events[k];
    evIdx = k; snap(k);                                         // (BACK returns here)
    if (!prev) { prewrite(ev); prewriteNext(); V.cue(arriveCue(ev, null)); await sleep(sec("settle")); }
    if (prev) await arrive(ev, prev);
    prepPortrait(T.events[evIdx + 1]);                          // your next age, painted while this one plays
    if (ev.type === "chosen") await chosen(ev);
    else if (ev.type === "happens") await happens(ev);
    else await fluke(ev);
    await unsay();
    prev = ev;
  }
  S.ended = true;                                               // dead: you leave the picture
  (async () => { for (let k = 1; k <= 30; k++) { live.setPersonAlpha(1 - k / 30); await sleep(100); } })();
  if (prev && prev.bridge) { await say({ s: esc(prev.bridge), cls: "bridge" }); await sleep(sec("arrive")); await unsay(); }
  V.listen("closed");
  clock.stop();                                                 // the world stops changing: the last picture stays
  sound.end(Math.max(3000, sec("final_silence")));             // the sound lets go into the final silence
  await sleep(sec("final_silence"));                           // a final silence before anything else
  await V.cue(G("close", ["the life, as the game recorded it:", ...lifeLines()]));   // it closes the books
  V.listen("open");
  await ending();
  const rest = sec("rest");                                     // the ledger stays REST seconds (0 = until a throw), then the screen goes off
  const again = await (rest > 0 ? Promise.race([waitThrow("begin").then(() => true), sleep(rest).then(() => false)]) : waitThrow("begin").then(() => true));
  setTurn("watch");
  T = null;                                                     // the next life re-reads trajectory.json (edits show up)
  life(again).catch(e => { screenTo(true, 0); say({ k: "COULDN'T START", s: esc(e.message || e), force: true }); });
}

async function ending() {                                       // the life, read back
  setPhase(PHASES.length);
  live.setPersonAlpha(0);                                       // (gone since the death: the ledger has the middle)
  const rows = S.ledger.map(([a, t, what, note]) => `<tr><td>${Math.floor(a)}</td><td>${esc(t)}</td><td>${esc(what)}${note ? ` <i>(${esc(note)})</i>` : ""}</td></tr>`).join("");
  await say({ k: "A LIFE", t: "", s: `<table>${rows}</table>` + (diceOn ? `<br><span style="color:#777;font-size:12px">Throw the die for another life.</span>` : ""), cls: "end", begin: true });
}

// ---------- the panel runs the game (through the server): commands, live settings, and what's happening ----------
let ctlSeq = -1, liveSeen = "", voiceOn = true;
async function fromPanel() {
  try {
    const j = await (await fetch(`/game/commands?after=${Math.max(0, ctlSeq)}`, { cache: "no-store" })).json();
    const first = ctlSeq < 0; ctlSeq = j.seq;
    if (!first) for (const c of j.cmds || []) {                  // (a page that just opened doesn't replay old commands)
      if (c.cmd === "new_life") location.reload();
      else if (c.cmd === "back") goBack();
      else if (c.cmd === "pause") { paused = true; V.hush(); sound.pause(true); }   // (the voice stops mid-line; the next moment speaks again)
      else if (c.cmd === "resume") { paused = false; sound.pause(false); }
      else if (c.cmd === "roll") { if (beginAction) beginAction(); else if (screenRoll && turn === "throw") screenRoll(); }
      else if (c.cmd === "redraw") fetch("/redraw", { method: "POST" });
      else if (c.cmd === "pick" && deckKeys) deckKeys(String(c.n));   // the nth card, as its number key
    }
    const L = j.live || {}, key = JSON.stringify(L);
    if (key !== liveSeen) {                                     // each setting on its own: one that fails never stops the rest
      liveSeen = key;
      const step = (f) => { try { f(); } catch (e) { console.warn("[panel]", e); } };
      step(() => { tempo = Math.max(0.4, Math.min(2, +L.tempo || 1)); });
      step(() => { heritageMix = L.heritage == null ? 0.5 : Math.max(0, Math.min(1, +L.heritage)); });
      step(() => { fog.setScale(+L.type_scale || 1); });
      step(() => { if ((L.ui === "glass" || L.ui === "fog") && L.ui !== ui) applyUI(L.ui); });
      step(() => { if (L.animator) live.setAnimatorOpts(L.animator); });
      step(() => { V.setSubtitles(L.subtitles || ""); });
      step(() => { if (L.sound) sound.setMix(L.sound); });
      step(() => { V.setLive(L.bk); });   // speed, volume, line length, breath, which moments, the mic, the waiting: at once
      step(() => { voiceOn = L.voice !== false; });
      step(() => { if (L.font_event !== fontsNow[0] || L.font_option !== fontsNow[1]) { fontsNow = [L.font_event, L.font_option]; applyTypefaces(L.font_event, L.font_option); } });
      step(() => { const rules = L.world_rules === "continuous" ? "continuous" : "ever"; if (rules !== worldRules) { worldRules = rules; clock.run(EVER()); } });
      step(() => { if (!voiceOn && V.stat.state !== "off") { V.stop(); V.stat.note = "off on the panel"; } });   // off: at once (on: from the next life)
    }
  } catch (e) {}
}
setInterval(fromPanel, 600); fromPanel();
setInterval(() => {                                              // what the game is doing, for the panel
  const ev = T && T.events[evIdx], st = live.stat;
  fetch("/game/report", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({
    event: ev ? ev.title : (evIdx < 0 ? "not started" : "the end"), n: evIdx + 1, of: T ? T.events.length : 0, age: Math.floor(S.ageF),
    ui, ui_next: uiNext || "", avatar: S.avatar ? pMode : "none yet", portrait: st.portraitNote || "", portrait_ms: st.portraitMs || 0, body: st.body || "", screen_fps: st.drawFps || 0,
    world: EVER() ? (st.shotPrompt || worldOn || "") : (worldOn || ""), directed: st.directed || 0,
    shots: EVER() ? `ever-changing · ${clock.stat.shown} shown · ${clock.stat.last || "–"}${clock.stat.wait ? " · waiting: " + clock.stat.wait : ""}` : "continuous", director_error: st.directorError || "", paused, turn, tempo,
    place: S.place || "", gender: S.gender || "", wear: S.wear || "", screen: screenUp ? "on" : "off",
    voice: V.stat.state, voice_note: V.stat.note || "", voice_said: V.stat.said, voice_heard: V.stat.heard, voice_last: (V.stat.last || "").slice(0, 240), voice_heard_last: V.stat.heardLast || "", voice_heard_what: V.stat.heardWhat || "",
    voice_model: V.model, subtitles: V.showText,
    sound: sound.stat.ready ? (sound.stat.on ? [sound.stat.kits.join(" + ") || "quiet", sound.stat.bed].filter(Boolean).join(" · ") : "off") : (sound.stat.note || "waiting for a click") }) }).catch(() => {});
}, 1000);

// ---------- keys: cards = ← → Enter or 1–9 · R / Space = roll on screen · Space / Enter = BEGIN · F = fullscreen · D = debug · C = next camera ----------
document.addEventListener("keydown", (e) => {
  if (e.repeat || e.target instanceof HTMLInputElement) return;
  if (e.key === "f" || e.key === "F") { setFull(!document.fullscreenElement); return; }
  if (e.key === "d" || e.key === "D") { debugEl.hidden = !debugEl.hidden; return; }
  if (e.key === "c" || e.key === "C") { switchCamera(); return; }
  if (e.key === "u" || e.key === "U") {                         // (the panel hears of it too, so the two never disagree)
    const next = (uiNext || ui) === "fog" ? "glass" : "fog"; applyUI(next);
    fetch("/game/live", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ui: next }) }).catch(() => {});
    return;
  }
  if (deckKeys && (e.key.startsWith("Arrow") || e.key === "Enter" || e.key === " " || /^[1-9]$/.test(e.key))) { e.preventDefault(); deckKeys(e.key); return; }
  if ((e.key === " " || e.key === "Enter") && beginAction && !(e.target instanceof HTMLButtonElement)) { e.preventDefault(); beginAction(); return; }
  if ((e.key === "r" || e.key === "R" || e.key === " ") && screenRoll && turn === "throw") { e.preventDefault(); screenRoll(); return; }
});

// ---------- full screen ----------
function setFull(on) {                                          // real browser fullscreen; the camera window hides there
  if (on && !document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(() => {});
  if (!on && document.fullscreenElement) document.exitFullscreen?.();
}
document.addEventListener("fullscreenchange", () => document.body.classList.toggle("full", !!document.fullscreenElement));

// C: the next camera becomes the avatar camera (remembered). Its name shows for a few seconds in the debug line.
let camFlash = 0;
async function switchCamera() {
  const name = await live.nextCamera();
  camFlash = performance.now() + 4000; debugEl.hidden = false; debugEl.dataset.flash = "1";
  debugEl.textContent = "avatar camera: " + (name || "?");
}
function status() {                                             // the hidden debug line (D): never on screen otherwise
  if (debugEl.dataset.flash && performance.now() > camFlash) { delete debugEl.dataset.flash; debugEl.hidden = true; }
  if (!debugEl.hidden) {
    const st = live.stat;
    if (!debugEl.dataset.flash) debugEl.textContent = !st.online ? "server offline" : [`${st.fps} fps`, source && `chance ${source}`, `camera: ${st.camera || "?"}`, st.camNote, `die${diceSrc ? ` (${diceSrc})` : ""}: ${dieText}`, `turn: ${turn}`, `screen ${st.drawFps || 0} fps`, st.worldError ? `WORLD ERROR: ${st.worldError}` : (st.worldId ? `world ${st.worldId}${st.bgMs ? ` (${st.bgMs} ms)` : ""}` : ""), st.worldTokens > 77 ? `PROMPT TOO LONG (${st.worldTokens} tokens, 77 are read)` : "", EVER() ? `shots ${clock.stat.shown} (${clock.stat.last || "–"}; ahead ${clock.stat.queue}${clock.stat.failed ? `, failed ${clock.stat.failed}` : ""}${clock.stat.wait ? `; waiting: ${clock.stat.wait}` : ""})` : "continuous world",
    pMode === "portrait" ? `portrait${pShown.age >= 0 ? " at " + pShown.age : ""}${st.portraitMs ? ` ${st.portraitMs} ms` : ""}${st.portraitNote ? " · " + st.portraitNote : ""}` : (st.portraitNote || ""), pMode === "portrait" && st.body ? `body ${st.body}` : "", st.frameError || "", +WK.director ? (st.directorError ? `director: ${st.directorError}` : `directed ${st.directed || 0}`) : "director off",
    screenUp ? "" : "screen off: waiting for a throw", `voice: ${V.stat.state}${V.stat.note ? " (" + V.stat.note + ")" : ""}${V.on ? ` · said ${V.stat.said} · heard ${V.stat.heard}` : ""}`, st.note, st.seg].filter(Boolean).join(" · ");
  }
  setTimeout(status, 250);
}
status();
live.camera.catch(e => { screenTo(true, 0); say({ k: "NO CAMERA", s: esc(e.message || e.name), force: true }); });
life(false, takeResume()).catch(e => { screenTo(true, 0); say({ k: "COULDN'T START", s: esc(e.message || e), force: true }); });
</script>
