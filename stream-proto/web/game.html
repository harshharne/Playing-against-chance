<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Playing Against Chance</title>
<style>
/* One life, unfolding. The painted world fills the screen; text sits in soft translucent windows, one at a time;
   the options are a fanned deck of glass cards at the bottom (after H's reference). Minimal, a clean sans. */
:root {
  --ink: #141414; --dim: #8a8a8a; --line: #d6d6d6; --bg: #fff; --fade: 1.2s;
  --glass: rgba(255,255,255,0.52); --glass-hi: rgba(255,255,255,0.8); --edge: rgba(255,255,255,0.7);
  --cw: clamp(104px, 10.5vw, 150px); --gap: calc(var(--cw) * 0.5);
  color-scheme: light;
}
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Inter", ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", sans-serif; -webkit-font-smoothing: antialiased; }
.frame { box-sizing: border-box; height: 100%; padding: 14px 16px; display: grid; grid-template-rows: minmax(0, 1fr) auto; gap: 10px; }
.gen { position: relative; min-height: 0; border-radius: 10px; overflow: hidden; display: grid; place-items: center; background: #eceae6; }
.gen canvas { width: 100%; height: 100%; object-fit: cover; display: block; }
.pip { position: absolute; top: 14px; right: 14px; width: clamp(96px, 12%, 170px); aspect-ratio: 16 / 9; object-fit: cover; transform: scaleX(-1); border-radius: 8px; opacity: 0.85; background: #ddd; }
.status { position: absolute; left: 14px; bottom: 10px; font-size: 10px; letter-spacing: 0.04em; color: rgba(255,255,255,0.75); text-shadow: 0 1px 3px rgba(0,0,0,0.4); }
.status b { font-weight: 600; }

/* the age, counting up quietly */
.age { position: absolute; top: 16px; left: 20px; display: flex; flex-direction: column; color: #fff; text-shadow: 0 1px 10px rgba(0,0,0,0.35); transition: opacity var(--fade); }
.age small { font-size: 9px; font-weight: 600; letter-spacing: 0.2em; opacity: 0.8; }
.age span { font-size: 34px; font-weight: 250; line-height: 1; font-variant-numeric: tabular-nums; }
.age.off { opacity: 0; }

/* the one soft window */
.say { position: absolute; left: 50%; top: 9%; transform: translate(-50%, 8px); box-sizing: border-box; width: max-content; max-width: min(640px, calc(100% - 40px));
       padding: 18px 26px; border-radius: 18px; background: var(--glass); border: 1px solid var(--edge);
       backdrop-filter: blur(16px) saturate(1.15); -webkit-backdrop-filter: blur(16px) saturate(1.15); box-shadow: 0 10px 40px rgba(0,0,0,0.10);
       text-align: center; display: flex; flex-direction: column; gap: 6px; opacity: 0; pointer-events: none;
       transition: opacity var(--fade) ease, transform var(--fade) ease; }
.say.on { opacity: 1; transform: translate(-50%, 0); }
.say .k { font-size: 9.5px; font-weight: 600; letter-spacing: 0.18em; color: #6d6d6d; text-transform: uppercase; }
.say .t { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.2; text-wrap: balance; }
.say .s { font-size: 14.5px; line-height: 1.45; color: #333; text-wrap: balance; }
.say.bridge { top: 40%; padding: 20px 30px; background: rgba(255,255,255,0.36); }
.say.bridge .s { font-size: 19px; font-weight: 400; color: #1b1b1b; }
.say.small { top: auto; bottom: 14%; padding: 10px 18px; border-radius: 12px; background: rgba(255,255,255,0.3); box-shadow: none; }
.say.small .s { font-size: 12.5px; color: #333; }
.say.quote .s { font-size: 18px; font-style: italic; }
.say.end { top: 6%; text-align: left; width: min(640px, calc(100% - 40px)); max-height: 80%; overflow: auto; pointer-events: auto; gap: 10px; }
.say.end table { border-collapse: collapse; font-size: 13px; line-height: 1.4; }
.say.end td { padding: 3px 14px 3px 0; vertical-align: top; }
.say.end td:first-child { color: var(--dim); font-variant-numeric: tabular-nums; white-space: nowrap; }
.say.end td:nth-child(2) { color: #555; white-space: nowrap; }
.say.end i { color: #777; font-style: normal; }

/* the die, landed: big and alone */
.big { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; opacity: 0; transition: opacity var(--fade); }
.big.on { opacity: 1; }
.big .disc { width: clamp(180px, 38vh, 360px); aspect-ratio: 1; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
             background: rgba(255,255,255,0.72); border: 1px solid var(--edge); backdrop-filter: blur(18px) saturate(1.15); -webkit-backdrop-filter: blur(18px) saturate(1.15); box-shadow: 0 16px 50px rgba(0,0,0,0.14); color: var(--ink); }
.big b { font-size: clamp(90px, 22vh, 210px); font-weight: 200; line-height: 1; }
.big span { font-size: 12px; font-weight: 600; letter-spacing: 0.3em; text-transform: uppercase; color: #444; opacity: 0; transition: opacity 0.6s; }
.big span.on { opacity: 0.9; }

/* ---- the deck: glass plaques fanned in depth; hover one and it turns to face you ---- */
.deck { position: absolute; left: 50%; bottom: 7%; transform: translateX(-50%); height: calc(var(--cw) * 1.3 + 90px);
        width: calc((var(--n) - 1) * var(--gap) + var(--cw)); perspective: 1100px; perspective-origin: 50% 20%; }
.card { position: absolute; bottom: 30px; left: calc(var(--i) * var(--gap)); width: var(--cw); height: calc(var(--cw) * 1.3); box-sizing: border-box;
        padding: 14px 13px; border-radius: 16px; background: var(--glass); border: 1px solid var(--edge);
        backdrop-filter: blur(14px) saturate(1.2); -webkit-backdrop-filter: blur(14px) saturate(1.2);
        box-shadow: 0 14px 34px rgba(0,0,0,0.16), inset 0 1px 0 rgba(255,255,255,0.8);
        display: flex; flex-direction: column; gap: 8px; text-align: left; font: inherit; color: var(--ink); cursor: pointer;
        transform-origin: 50% 100%; transform: translateY(calc(var(--i) * -9px)) rotateX(6deg) rotateY(-34deg);
        transition: transform 0.75s cubic-bezier(.2,.75,.2,1), opacity 0.6s ease, left 0.9s cubic-bezier(.2,.75,.2,1), background 0.4s; }
.card .nm { font-size: 13px; font-weight: 650; line-height: 1.2; letter-spacing: -0.005em; max-width: calc(var(--gap) - 20px); }   /* resting: fits the strip you can see */
.deck.open .card:hover .nm, .deck.open .card.focus .nm, .card.locked .nm { max-width: none; }
.card .rv { font-size: 11.5px; line-height: 1.35; color: #3a3a3a; opacity: 0; transform: translateY(6px); transition: opacity 0.4s, transform 0.4s; }
.card .tg { margin-top: auto; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: #222; opacity: 0; transition: opacity 0.6s; }
.card .tg b { display: block; font-size: 20px; letter-spacing: -0.01em; font-weight: 600; }
.card .hint { font-size: 10px; letter-spacing: 0.08em; color: #555; opacity: 0; transition: opacity 0.6s; }
.card.pre { opacity: 0; transform: translateY(70px) rotateX(6deg) rotateY(-34deg); }
.deck.open .card:hover, .deck.open .card.focus { transform: translateY(-26px) translateZ(70px) rotateY(0deg) scale(1.12); background: var(--glass-hi); z-index: 50 !important; }
.deck.open .card:hover .rv, .deck.open .card.focus .rv { opacity: 1; transform: none; }
.deck.open.hovering .card:not(:hover):not(.focus) { opacity: 0.5; }
.card.locked { left: calc((var(--n) - 1) * var(--gap) / 2) !important; transform: translateY(-42%) scale(1.4); background: var(--glass-hi); z-index: 60 !important; cursor: default; }
.card.locked .rv { opacity: 1; transform: none; }
.card.locked.show .tg, .card.locked.show .hint { opacity: 1; }
.card.away { opacity: 0; transform: translateY(160px) rotateX(6deg) rotateY(-34deg); pointer-events: none; }
.card.gone { opacity: 0; }
.nav { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; transition: opacity 0.6s; }
.nav button { width: 22px; height: 22px; border-radius: 50%; border: 0; background: rgba(255,255,255,0.75); color: #333; font: inherit; font-size: 13px; line-height: 22px; padding: 0; cursor: pointer; }
.nav i { width: 5px; height: 5px; border-radius: 3px; background: rgba(255,255,255,0.7); transition: width 0.3s, background 0.3s; }
.nav i.on { width: 16px; background: #333; }
.deck:not(.open) .nav { opacity: 0; pointer-events: none; }

/* the allotted card, turning over */
.flip { position: absolute; left: 50%; top: 50%; width: calc(var(--cw) * 1.4); height: calc(var(--cw) * 1.82); transform: translate(-50%, -55%); perspective: 900px; opacity: 0; transition: opacity 0.8s; pointer-events: none; }
.flip.on { opacity: 1; }
.flip .in { position: absolute; inset: 0; transform-style: preserve-3d; transform: rotateY(180deg); transition: transform 1.8s cubic-bezier(.45,.05,.2,1); }
.flip.turn .in { transform: rotateY(0deg); }
.flip .face, .flip .back { position: absolute; inset: 0; box-sizing: border-box; border-radius: 18px; backface-visibility: hidden; -webkit-backface-visibility: hidden; border: 1px solid var(--edge); box-shadow: 0 14px 40px rgba(0,0,0,0.18); }
.flip .face { padding: 18px; background: var(--glass-hi); display: flex; flex-direction: column; gap: 10px; text-align: left; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.flip .face small { font-size: 9px; font-weight: 600; letter-spacing: 0.18em; color: #777; }
.flip .face b { font-size: 18px; line-height: 1.2; }
.flip .face span { font-size: 13px; line-height: 1.4; color: #333; }
.flip .back { transform: rotateY(180deg); background: repeating-linear-gradient(45deg, rgba(255,255,255,0.55) 0 8px, rgba(255,255,255,0.3) 8px 16px); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }

/* the bar under the picture */
.bar { display: grid; grid-template-columns: 1fr auto; gap: 18px; align-items: center; min-height: 52px; }
.left { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
.steps { display: flex; gap: 6px; align-items: center; font-size: 10px; font-weight: 600; letter-spacing: 0.14em; color: #bbb; }
.steps span.now { color: var(--ink); }
.steps span.done { color: var(--dim); }
.steps i { width: 16px; height: 1px; background: var(--line); }
.fs { font: inherit; font-size: 10px; font-weight: 600; letter-spacing: 0.1em; padding: 6px 11px; border: 1px solid #bbb; border-radius: 20px; background: #fff; color: var(--ink); cursor: pointer; }
.dicestat { font-size: 10px; font-weight: 600; letter-spacing: 0.1em; color: var(--dim); }
.dicestat b { color: var(--ink); }
.dicestat a { color: var(--ink); }
.go { font: inherit; font-size: 13px; font-weight: 600; letter-spacing: 0.1em; min-width: 150px; padding: 13px 22px; border: 0; border-radius: 30px; background: var(--ink); color: #fff; cursor: pointer; transition: opacity 0.4s; }
.go:disabled { opacity: 0; pointer-events: none; }
button:focus-visible { outline: 3px solid #888; outline-offset: 2px; }

body.full .frame { padding: 0; gap: 0; grid-template-rows: minmax(0, 1fr); }
body.full .gen { border-radius: 0; }
body.full .bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; padding: 8px 18px; background: linear-gradient(transparent, rgba(255,255,255,0.55)); }
body.full .deck { bottom: 70px; }
@media (max-width: 760px) { .bar { grid-template-columns: 1fr; } .go { width: 100%; } }
@media (prefers-reduced-motion: reduce) { .card, .flip .in, .say { transition-duration: 0.01s !important; } }
</style>
</head>
<body>
<div class="frame">
  <div class="gen" id="gen">
    <canvas id="out" width="640" height="384" aria-label="The life"></canvas>
    <video id="pip" class="pip" muted playsinline aria-label="Your camera"></video>
    <div class="age off" id="age" aria-live="off"><small>AGE</small><span id="ageN">0</span></div>
    <div class="say" id="say" aria-live="polite"></div>
    <div class="big" id="big" aria-live="polite"><div class="disc"><b id="bigN"></b><span id="bigW"></span></div></div>
    <div class="deck" id="deck" role="group" aria-label="Your options" hidden></div>
    <div class="flip" id="flip" aria-live="polite"><div class="in"><div class="face" id="flipFace"></div><div class="back"></div></div></div>
    <div class="status" id="status">connecting…</div>
  </div>
  <div class="bar">
    <div class="left">
      <div class="steps" id="steps"></div>
      <button class="fs" id="fs" title="Full screen (F). Esc leaves it.">FULL SCREEN</button>
      <div class="dicestat" id="dice" aria-live="polite">DIE · …</div>
    </div>
    <button class="go" id="go" disabled>…</button>
  </div>
</div>

<script type="module">
// ============================================================================
//  Playing Against Chance — Life Trajectory v1. One life, 19 events, from trajectory.json.
//  Chosen = you pick a card and throw the die; a miss is allotted by random.org.
//  Happens = random.org picks one of three hidden outcomes. Fluke = something tiny, paid off later.
//  The unfolding (the beats, all minimums, all in trajectory.json "pacing", tuned live on /panel):
//    ARRIVE  bridge line · the age counts up · the world paints from the last one · the avatar ages
//    SETTLE  name + setup in a soft window      CARDS  rise one by one, wait for you
//    LOCK    your card to the centre, the target   THROW  waits for the die; everything holds still while it rolls
//    LAND    the number, big and alone, then hit or miss   MISS  the allotted card turns over
//    LINGER  what happened stays while the new world paints in
//  Never shown: odds, percentages, the hidden outcomes, that a fluke mattered (until it does).
// ============================================================================
import { createLive } from "./live.js";
import { createDiceReader } from "./dice.js";
import { createDiceReader as createRemoteReader } from "./dice-remote.js";
import { findCamera } from "./cameras.js";

const $ = (id) => document.getElementById(id);
const sayEl = $("say"), bigEl = $("big"), deckEl = $("deck"), flipEl = $("flip"), go = $("go"), statusEl = $("status");
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const up = (s) => String(s).toUpperCase();
const nextFrame = () => new Promise(r => requestAnimationFrame(() => r()));

const live = createLive({ out: $("out"), video: $("pip"), params: () => ({}) });

// ---------- the life and its timings (trajectory.json; the timings change live from /panel) ----------
let T = null, P = {}, WK = { keep: 0.5, chapter_keep: 0.25 };
const sec = (k) => Math.max(0, +P[k] || 0) * 1000;
function setPacing(doc) {
  P = doc.pacing || {}; WK = doc.world || WK;
  document.documentElement.style.setProperty("--fade", (sec("fade") / 1000) + "s");
}
async function loadLife() {
  const doc = await (await fetch("/trajectory", { cache: "no-store" })).json();
  if (doc.error) throw new Error(doc.error);
  T = doc; setPacing(doc);
}
let paceSeen = null;
setInterval(async () => {                                     // a slider moved on /panel: take the new timings now
  try {
    const m = await (await fetch("/config", { cache: "no-store" })).json();
    if (paceSeen !== null && m.pace !== paceSeen) setPacing(await (await fetch("/trajectory", { cache: "no-store" })).json());
    paceSeen = m.pace;
  } catch (e) {}
}, 1500);

// ---------- chance: random.org (through the server) ----------
let source = "";
async function draw(lo, hi) {
  try {
    const r = await (await fetch(`/draw?n=1&lo=${lo}&hi=${hi}`, { cache: "no-store" })).json();
    source = r.source; return r.values[0];
  } catch (e) { source = "LOCAL"; return lo + Math.floor(Math.random() * (hi - lo + 1)); }
}

// ---------- the one soft window: the old text fades out fully before the new one fades in ----------
let sayOn = false;
async function unsay() {
  if (!sayOn) return;
  sayOn = false; sayEl.classList.remove("on");
  await sleep(sec("fade"));
}
async function say({ k = "", t = "", s = "", cls = "" }) {
  await unsay();
  sayEl.className = "say " + cls;
  sayEl.innerHTML = (k ? `<span class="k">${k}</span>` : "") + (t ? `<span class="t">${t}</span>` : "") + (s ? `<span class="s">${s}</span>` : "");
  await nextFrame(); await nextFrame();
  sayEl.classList.add("on"); sayOn = true;
  await sleep(sec("fade"));
}
const kick = (ev) => `AGE ${Math.floor(S.ageF)} · ${esc(ev.title)}`;    // over an outcome
const kickAge = () => `AGE ${Math.floor(S.ageF)}`;                           // over the event's own name

// ---------- the age, the avatar, the world ----------
let S;                                                         // this life
function freshLife() { return { ageF: 0, gender: null, place: "", wear: "", ledger: [], planted: {}, phase: 0 }; }
const AGES = [                                                 // the avatar between these: blended, so it ages continuously
  [0, "a newborn baby wrapped in a soft blanket"], [2, "a toddler"], [6, "a small {child}"], [11, "a {child}"],
  [15, "a teenage {kid}"], [19, "a young {adult}, late teens"], [25, "a young {adult} in their twenties"],
  [33, "a {adult} in their thirties"], [45, "a middle-aged {adult}"], [57, "an older {adult} with greying hair"],
  [68, "an elderly {adult} with white hair and wrinkles"], [82, "a very old frail {adult}, deep wrinkles, white hair"],
  [95, "an extremely old {adult}, frail and very wrinkled"],
];
function who(desc, age) {
  const g = S.gender, w = { child: g === "boy" ? "boy" : g === "girl" ? "girl" : "child", kid: g === "boy" ? "boy" : g === "girl" ? "girl" : "kid",
                           adult: g === "boy" ? "man" : g === "girl" ? "woman" : "person" };
  let d = desc.replace(/\{(\w+)\}/g, (_, k) => w[k]);
  if (g === "nb" && age >= 2) d += ", androgynous";
  if (S.wear && age >= 2) d += `, in ${S.wear}`;
  return d + ", painterly portrait";
}
function avatarAt(age) {
  let i = 0;
  while (i < AGES.length - 2 && age >= AGES[i + 1][0]) i++;
  const [a0, d0] = AGES[i], [a1, d1] = AGES[i + 1];
  const mix = Math.max(0, Math.min(1, (age - a0) / (a1 - a0)));
  live.setPerson(who(d0, age), who(d1, age), mix);
}
function showAge() { $("ageN").textContent = Math.floor(S.ageF); }
async function ageTo(to, ms) {                                 // the age runs on; the avatar ages with it
  const from = S.ageF, t0 = performance.now();
  if (to <= from) { avatarAt(S.ageF); return; }
  for (;;) {
    const k = Math.min(1, (performance.now() - t0) / Math.max(1, ms)), e = k * k * (3 - 2 * k);
    S.ageF = from + (to - from) * e; showAge(); avatarAt(S.ageF);
    if (k >= 1) return;
    await sleep(60);
  }
}
let worldDone = Promise.resolve();
function world(scene, keep, fresh = false) {                   // the next world, painted out of the last one
  const prompt = scene + (S.place ? ", " + S.place : "");
  worldDone = live.setBackground(prompt, { keep, fade: sec("world_fade"), fresh }).then(() => sleep(sec("world_fade")));
  return worldDone;
}

// ---------- the die (dice_reader.py, the browser reader, or ROLL on screen) ----------
let diceOn = false, diceSrc = "", rollWaiter = null, sawThrow = false;
const diceEl = $("dice");
const chip = (html) => { diceEl.innerHTML = `DIE${diceSrc ? ` (${diceSrc})` : ""} · ${html}`; };
let turn = "watch";
const TURN = { watch: "not your turn: watch", pick: "pick a card", throw: "<b>throw it</b>", begin: "<b>throw to begin</b>" };
function setTurn(t) { turn = t; if (diceOn) chip(TURN[t]); if (t !== "throw") live.hold(false); }
const READING = { rolling: "rolling…", settling: "landing…", reading: "reading…", unclear: "can't read it, throw again" };
const diceEvents = {
  onState: (s) => {
    if (s === "rolling") { sawThrow = true; if (turn === "throw") live.hold(true); }   // while it rolls, everything holds still
    if (s === "unclear") live.hold(false);
    if (!diceOn) return;
    if (s === "needs empty tray") chip('<a href="/dice.html">set up the empty tray</a>');
    else if (READING[s] && (turn === "throw" || turn === "begin")) chip(`<b>${READING[s]}</b>`);
    else chip(TURN[turn]);
  },
  onRoll: (n) => {
    if (turn !== "throw" && turn !== "begin") return;       // not your turn: a throw now means nothing
    if (!sawThrow) { chip(`<b>${n}</b> ignored: no throw seen`); return; }
    sawThrow = false; chip(`<b>${n}</b>`);
    if (rollWaiter) rollWaiter(n, true);
  },
};
function diceReady(src) { diceOn = true; diceSrc = src; chip(TURN[turn]); }
let browserDice = null;
async function tryPython() {
  try { await createRemoteReader(diceEvents).start(); if (browserDice) { browserDice.stop(); browserDice = null; } diceReady("python"); return true; }
  catch (e) { return false; }
}
(async () => {
  if (await tryPython()) return;
  const look = setInterval(async () => { if (await tryPython()) clearInterval(look); }, 3000);
  let cam = "";
  try { cam = await findCamera("pac-dice-cam"); } catch (e) {}
  if (!cam) { diceEl.innerHTML = 'DIE · <a href="/dice.html">start dice_reader.py, or set up</a> · R rolls on screen'; return; }
  const dice = createDiceReader({ video: Object.assign(document.createElement("video"), { muted: true, playsInline: true }), ...diceEvents });
  try { await dice.start(cam); if (diceSrc !== "python") { browserDice = dice; diceReady("browser"); } else dice.stop(); }
  catch (e) { if (!diceOn) diceEl.innerHTML = 'DIE · <a href="/dice.html">camera not found</a>'; }
})();

// one throw: the physical die, or ROLL / R on screen (random.org) when there's no die
function waitThrow(kind = "throw") {
  setTurn(kind); sawThrow = false;
  return new Promise(resolve => {
    const done = (n, die) => { rollWaiter = null; screenRoll = null; go.disabled = true; resolve({ n, die }); };
    rollWaiter = done;
    screenRoll = async () => { screenRoll = null; go.disabled = true; live.hold(true); await sleep(500); done(await draw(1, 6), false); };
    if (kind === "begin") button(diceOn ? null : "BEGIN", () => { screenRoll = null; done(0, false); });
    else button(diceOn ? null : "ROLL", () => screenRoll && screenRoll());
  });
}
let screenRoll = null, goAction = null;
function button(label, fn) { go.textContent = label || "…"; go.disabled = !label; goAction = label ? fn : null; }
go.addEventListener("click", () => { if (!go.disabled && goAction) goAction(); });

// ---------- the deck ----------
let deckKeys = null;
function deck(cards) {                                         // cards rise one by one; resolves with the one you pick
  deckEl.hidden = false; deckEl.className = "deck";
  deckEl.style.setProperty("--n", cards.length);
  deckEl.innerHTML = cards.map((c, i) => `<button type="button" class="card pre" style="--i:${i};z-index:${i + 1}" aria-label="${esc(c.name)}: ${esc(c.reveals)}">
      <span class="nm">${esc(c.name)}</span><span class="rv">${esc(c.reveals)}</span><span class="tg"></span><span class="hint"></span></button>`).join("")
    + `<div class="nav"><button type="button" data-d="-1" aria-label="Previous">‹</button>${cards.map(() => "<i></i>").join("")}<button type="button" data-d="1" aria-label="Next">›</button></div>`;
  const els = [...deckEl.querySelectorAll(".card")], dots = [...deckEl.querySelectorAll(".nav i")];
  const cw = els[0].offsetWidth, room = $("gen").clientWidth * 0.74;   // spread the deck so each name shows, within the screen
  deckEl.style.setProperty("--gap", Math.round(Math.max(cw * 0.42, Math.min(cw * 0.8, (room - cw) / Math.max(1, cards.length - 1)))) + "px");
  return new Promise(async resolve => {
    for (const el of els) { el.classList.remove("pre"); await sleep(sec("card_rise")); }
    await sleep(500);
    deckEl.classList.add("open"); setTurn("pick");
    let focus = -1;
    const setFocus = (i) => { focus = (i + els.length) % els.length; els.forEach((e, k) => e.classList.toggle("focus", k === focus)); dots.forEach((d, k) => d.classList.toggle("on", k === focus)); deckEl.classList.add("hovering"); };
    const pick = (i) => { if (!deckEl.classList.contains("open")) return; deckEl.classList.remove("open", "hovering"); deckKeys = null; resolve({ i, els }); };
    els.forEach((el, i) => {
      el.addEventListener("click", () => pick(i));
      el.addEventListener("mouseenter", () => { els.forEach(e => e.classList.remove("focus")); dots.forEach((d, k) => d.classList.toggle("on", k === i)); focus = i; deckEl.classList.add("hovering"); });
      el.addEventListener("mouseleave", () => deckEl.classList.remove("hovering"));
    });
    deckEl.querySelectorAll(".nav button").forEach(b => b.addEventListener("click", () => setFocus(focus + +b.dataset.d)));
    deckKeys = (key) => {
      if (key === "ArrowRight") setFocus(focus + 1);
      else if (key === "ArrowLeft") setFocus(focus - 1);
      else if ((key === "Enter" || key === " ") && focus >= 0) pick(focus);
      else { const n = parseInt(key, 10); if (n >= 1 && n <= els.length) pick(n - 1); }
    };
  });
}
async function lock(els, i, label) {                           // your card glides to the centre; the others sink away
  els.forEach((e, k) => { e.classList.remove("focus"); e.classList.toggle("locked", k === i); e.classList.toggle("away", k !== i); });
  await sleep(sec("lock"));
  els[i].querySelector(".tg").innerHTML = `throw<b>${esc(label)}</b>`;
  els[i].classList.add("show");
  await sleep(700);
}
const cardHint = (el, html) => { el.querySelector(".hint").innerHTML = html; };
function deckGone() { deckEl.hidden = true; deckEl.innerHTML = ""; }

// "3 or more" · "a 6" · "exactly 1": the target is written the way the player sees it
function target(text) {
  const t = String(text), m = /(\d)\s*or more/i.exec(t);
  if (m) { const v = +m[1]; return { hit: (n) => n >= v, label: t }; }
  const v = +(/(\d)/.exec(t) || [0, 6])[1];
  return { hit: (n) => n === v, label: t };
}

// the number, big and alone; then hit or miss
async function land(n, hit) {
  $("bigN").textContent = n; $("bigW").textContent = hit ? "hit" : "miss"; $("bigW").classList.remove("on");
  bigEl.classList.add("on");
  await sleep(Math.max(600, sec("land") * 0.55));
  $("bigW").classList.add("on");
  await sleep(Math.max(500, sec("land") * 0.45));
  bigEl.classList.remove("on"); await sleep(sec("fade"));
}
async function turnOver(card, note) {                          // the allotted card turns over slowly
  $("flipFace").innerHTML = `<small>${esc(note)}</small><b>${esc(card.name)}</b><span>${esc(card.reveals)}</span>`;
  flipEl.className = "flip"; await nextFrame(); await nextFrame();
  flipEl.classList.add("on"); await sleep(700);
  flipEl.classList.add("turn"); await sleep(Math.max(1900, sec("miss")));
  flipEl.classList.remove("on"); await sleep(800);
  flipEl.className = "flip";
}

// ---------- the events ----------
function apply(c) {
  if (c.gender) S.gender = c.gender;
  if (c.place) S.place = c.place;
  if (c.wear) S.wear = c.wear;
}
async function linger(key, extraAge) {                         // what happened stays while the new world paints in
  await Promise.all([sleep(sec(key)), worldDone, extraAge ? ageTo(extraAge, sec(key) * 0.8) : null]);
}

async function chosen(ev) {
  await say({ k: kickAge(), t: esc(ev.title), s: esc(ev.setup) });
  await sleep(sec("settle"));
  const { i, els } = await deck(ev.cards);
  const c = ev.cards[i], tg = target(c.target);
  await Promise.all([unsay(), lock(els, i, tg.label)]);
  const tries = Math.max(1, ev.tries || 1);
  let hit = false, n = 0, t = 1;
  for (; t <= tries; t++) {
    if (tries > 1) cardHint(els[i], t === 1 ? `${tries} throws` : `${tries - t + 1} ${tries - t + 1 === 1 ? "throw" : "throws"} left`);
    ({ n } = await waitThrow());
    setTurn("watch"); live.hold(false);
    els[i].classList.add("gone"); await sleep(500);
    hit = tg.hit(n);
    await land(n, hit);
    if (hit || t === tries) break;
    els[i].classList.remove("gone"); await sleep(600);
  }
  deckGone();
  let got = c, how = "hit";
  if (!hit) {
    if (ev.allot === false) how = "none";
    else {
      await sleep(sec("miss") * 0.4);
      const others = ev.cards.filter(x => x !== c);
      got = others[(await draw(1, others.length)) - 1];
      how = tries > 1 ? "override" : "allotted";
      await turnOver(got, how === "override" ? "THE OVERRIDE" : "ALLOTTED");
    }
  }
  if (how === "none") {
    world(ev.miss.scene, WK.keep);
    S.ledger.push([S.ageF, ev.title, `${ev.miss.text.replace(/\.$/, "")}`, `went to: ${c.name}`]);
    await say({ k: kick(ev), t: esc(ev.miss.text) });
  } else {
    apply(got); world(got.scene, WK.keep);
    const note = how === "hit" ? "" : how === "override" ? `${tries} throws, then the override.` : `You went for ${esc(c.name)}. Chance allotted this.`;
    S.ledger.push([S.ageF, ev.title, got.name, how === "hit" ? "" : how === "override" ? `went for ${c.name}; ${tries} throws, then the override` : `went for ${c.name}`]);
    await say({ k: kick(ev), t: esc(got.name), s: esc(got.reveals) + (note ? `<br><span style="color:#777;font-size:12px">${note}</span>` : "") });
  }
  avatarAt(S.ageF);                                           // a new outfit / gender: the avatar morphs to it
  await linger("linger", how !== "none" && got.age);
}

async function happens(ev) {
  if (ev.reveals && S.planted[ev.reveals]) {                  // the fluke comes back: slow, the original line word for word
    const p = S.planted[ev.reveals];
    await say({ k: kickAge(), t: esc(ev.title) });
    await sleep(sec("settle") * 0.6);
    await unsay(); await sleep(sec("fade") * 0.5);
    await say({ k: `AT ${p.age}`, s: `“${esc(p.text)}”`, cls: "quote" });
    await sleep(sec("reveal"));
  } else {
    await say({ k: kickAge(), t: esc(ev.title), s: "Something happens." });
    await sleep(sec("happen_hold"));
  }
  const key = ["good", "bad", "neutral"][(await draw(1, 3)) - 1], o = ev.outcomes[key];
  world(o.scene, WK.keep);
  S.ledger.push([S.ageF, ev.title, o.text, ""]);
  await say({ k: kick(ev), t: "", s: `<span style="font-size:18px;color:#111">${esc(o.text)}</span>` });
  await linger("happen_linger");
}

async function fluke(ev) {                                     // deliberately understated
  if (ev.plant) {
    world(ev.scene, WK.keep);
    S.planted[ev.id] = { age: Math.floor(S.ageF), text: ev.text };
    S.ledger.push([S.ageF, ev.title, ev.text, ""]);
    await say({ s: esc(ev.text), cls: "small" });
    await sleep(sec("fluke_hold"));
    await unsay();
    return;
  }
  const f = ev.flukes[(await draw(1, ev.flukes.length)) - 1];   // which small thing finds you work
  await say({ s: esc(f.text), cls: "small" });
  await sleep(sec("fluke_hold"));
  world(f.scene, WK.keep);
  S.ledger.push([S.ageF, ev.title, f.job, f.text]);
  await say({ k: kick(ev), t: esc(f.job) });
  await linger("fluke_linger");
}

// ---------- the run ----------
const PHASES = ["BASELINE", "CRUST", "ADULTHOOD", "LATER LIFE"];
$("steps").innerHTML = PHASES.map(p => `<span>${p}</span>`).join("<i></i>");
function setPhase(i) {
  [...$("steps").querySelectorAll("span")].forEach((s, k) => { s.className = k < i ? "done" : k === i ? "now" : ""; });
  phaseRef(i);
}
async function phaseRef(i) {                                   // optional: a style reference painting per phase (trajectory.json phase_refs)
  const url = T && T.phase_refs && T.phase_refs[i];
  if (!url) return;
  try {
    const img = await (await fetch(url, { cache: "force-cache" })).blob();
    for (const side of ["person", "background"])
      await fetch(`/reference?side=${side}&kind=style`, { method: "POST", body: img, headers: { "Content-Type": img.type || "image/jpeg" } });
    live.refresh();
  } catch (e) { console.warn("[phase ref]", url, e); }
}

async function arrive(ev, prev) {                              // the bridge, the years, the world and the avatar, together
  const chapter = !!(prev && prev.chapter);
  if (chapter) { S.phase = Math.min(PHASES.length - 1, S.phase + 1); setPhase(S.phase); }
  const dur = sec(chapter ? "chapter" : "arrive");
  if (prev && prev.bridge) await say({ s: esc(prev.bridge), cls: "bridge" });
  const w = world(ev.scene, chapter ? WK.chapter_keep : WK.keep);
  await Promise.all([ageTo(ev.age, dur * 0.85), sleep(dur), w]);
  await unsay();
}

async function life() {
  if (!T) await loadLife();
  S = freshLife(); setPhase(0);
  deckGone(); bigEl.classList.remove("on");
  $("age").classList.add("off"); showAge();
  live.setPerson(null);
  await live.whenReady();
  world(T.events[0].scene, 0, true);                           // a new life: a fresh world
  await say({ k: "PLAYING AGAINST CHANCE", t: `One life. ${T.events.length} moments.`, s: diceOn ? "Throw the die to begin." : "Press BEGIN." });
  await waitThrow("begin");
  setTurn("watch"); live.hold(false);
  await unsay();
  $("age").classList.remove("off");
  avatarAt(0);
  await sleep(sec("arrive") * 0.6);
  let prev = null;
  for (const ev of T.events) {
    if (prev) await arrive(ev, prev);
    if (ev.type === "chosen") await chosen(ev);
    else if (ev.type === "happens") await happens(ev);
    else await fluke(ev);
    await unsay();
    prev = ev;
  }
  if (prev && prev.bridge) { await say({ s: esc(prev.bridge), cls: "bridge" }); await sleep(sec("arrive")); await unsay(); }
  await sleep(sec("final_silence"));                           // a final silence before anything else
  await ending();
  await waitThrow("begin");
  setTurn("watch"); await unsay();
  T = null;                                                     // the next life re-reads trajectory.json (edits show up)
  life();
}

async function ending() {                                       // the life, read back
  setPhase(PHASES.length);
  const rows = S.ledger.map(([a, t, what, note]) => `<tr><td>${Math.floor(a)}</td><td>${esc(t)}</td><td>${esc(what)}${note ? ` <i>(${esc(note)})</i>` : ""}</td></tr>`).join("");
  await say({ k: "A LIFE", t: "", s: `<table>${rows}</table>`, cls: "end" });
  sayEl.querySelector(".s").insertAdjacentHTML("afterend", `<span class="k">${diceOn ? "THROW THE DIE FOR ANOTHER LIFE" : "PRESS BEGIN FOR ANOTHER LIFE"}</span>`);
}

// ---------- keys: cards = ← → Enter or 1–9 · R = roll on screen · Space/Enter = the button · F = full screen ----------
document.addEventListener("keydown", (e) => {
  if (e.repeat || e.target instanceof HTMLInputElement) return;
  if (e.key === "f" || e.key === "F") { setFull(!document.body.classList.contains("full")); return; }
  if (deckKeys && (e.key.startsWith("Arrow") || e.key === "Enter" || e.key === " " || /^[1-9]$/.test(e.key))) { e.preventDefault(); deckKeys(e.key); return; }
  if ((e.key === "r" || e.key === "R") && screenRoll) { screenRoll(); return; }
  if ((e.key === " " || e.key === "Enter") && !(e.target instanceof HTMLButtonElement)) { e.preventDefault(); go.click(); }
});

// ---------- full screen ----------
function setFull(on) {
  if (on && !document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(() => {});
  if (!on && document.fullscreenElement) document.exitFullscreen?.();
  document.body.classList.toggle("full", on);
  $("fs").textContent = on ? "EXIT FULL SCREEN" : "FULL SCREEN";
}
$("fs").addEventListener("click", () => setFull(!document.body.classList.contains("full")));
document.addEventListener("fullscreenchange", () => { if (!document.fullscreenElement) setFull(false); });

function status() {
  const st = live.stat;
  statusEl.innerHTML = !st.online ? "<b>server offline</b>" : [`<b>${st.fps}</b> fps`, source && `chance <b>${source}</b>`, st.note, st.seg].filter(Boolean).join(" · ");
  requestAnimationFrame(status);
}
status();
live.camera.catch(e => say({ k: "NO CAMERA", s: esc(e.message || e.name) }));
life().catch(e => say({ k: "COULDN'T START", s: esc(e.message || e) }));
</script>
