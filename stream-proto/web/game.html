<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Playing Against Chance</title>
<style>
/* One life, unfolding. The painted world fills the whole window, edge to edge; the only text is one soft
   narrative window at the bottom and the option cards, spread evenly across the bottom. Minimal, a clean sans.
   F = real fullscreen (the camera window hides there). D = a hidden debug line (die, fps). */
:root {
  --ink: #141414; --dim: #8a8a8a; --bg: #fff; --fade: 1.2s;
  --glass: rgba(255,255,255,0.52); --glass-hi: rgba(255,255,255,0.82); --edge: rgba(255,255,255,0.7);
  --cw: clamp(92px, 9.5vw, 138px); --ch: calc(var(--cw) * 1.22); --deck-h: calc(var(--ch) + 40px);
  color-scheme: light;
}
html, body { height: 100%; margin: 0; overflow: hidden; }
body { background: var(--bg); color: var(--ink); font-family: "Inter", ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", sans-serif; -webkit-font-smoothing: antialiased; }
.gen { position: fixed; inset: 0; overflow: hidden; background: #eceae6; }
.gen canvas { width: 100%; height: 100%; object-fit: cover; display: block; }
.gen canvas.birth, .gen canvas.baby { position: absolute; inset: 0; opacity: 0; pointer-events: none; }   /* drawn scenes and the baby, over the live picture */
.pip { position: absolute; top: 14px; right: 14px; width: clamp(96px, 12%, 170px); aspect-ratio: 16 / 9; object-fit: cover; transform: scaleX(-1); border-radius: 8px; opacity: 0.85; background: #ddd; transition: opacity 0.4s; }
body.full .pip { opacity: 0; pointer-events: none; }        /* fullscreen: no camera window (the camera still runs) */
.debug { position: absolute; left: 12px; top: 10px; font: 11px/1.4 ui-monospace, Menlo, monospace; color: #111; background: rgba(255,255,255,0.8); padding: 4px 8px; border-radius: 6px; }
.debug[hidden] { display: none; }

/* the one soft window, at the bottom; it lifts above the cards while they're up */
.say { position: absolute; left: 50%; bottom: 5%; transform: translate(-50%, 8px); box-sizing: border-box; width: max-content; max-width: min(680px, calc(100% - 40px));
       padding: 16px 26px; border-radius: 18px; background: var(--glass); border: 1px solid var(--edge);
       backdrop-filter: blur(16px) saturate(1.15); -webkit-backdrop-filter: blur(16px) saturate(1.15); box-shadow: 0 10px 40px rgba(0,0,0,0.10);
       text-align: center; display: flex; flex-direction: column; gap: 6px; opacity: 0; pointer-events: none;
       transition: opacity var(--fade) ease, transform var(--fade) ease, bottom 0.7s cubic-bezier(.2,.75,.2,1); }
.say.on { opacity: 1; transform: translate(-50%, 0); }
body.cards .say { bottom: calc(var(--deck-h) + 4% + 14px); }
.say .k { font-size: 9.5px; font-weight: 600; letter-spacing: 0.18em; color: #6d6d6d; text-transform: uppercase; }
.say .t { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.2; text-wrap: balance; }
.say .s { font-size: 14.5px; line-height: 1.45; color: #333; text-wrap: balance; }
.say .go { pointer-events: auto; }
.say.bridge { padding: 18px 30px; background: rgba(255,255,255,0.4); }
.say.bridge .s { font-size: 19px; font-weight: 400; color: #1b1b1b; }
.say.small { padding: 10px 18px; border-radius: 12px; background: rgba(255,255,255,0.3); box-shadow: none; }
.say.small .s { font-size: 12.5px; color: #333; }
.say.quote .s { font-size: 18px; font-style: italic; }
.say.end { text-align: left; width: min(640px, calc(100% - 40px)); max-height: 78%; overflow: auto; pointer-events: auto; gap: 10px; }
.say.end table { border-collapse: collapse; font-size: 13px; line-height: 1.4; }
.say.end td { padding: 3px 14px 3px 0; vertical-align: top; }
.say.end td:first-child { color: var(--dim); font-variant-numeric: tabular-nums; white-space: nowrap; }
.say.end td:nth-child(2) { color: #555; white-space: nowrap; }
.say.end i { color: #777; font-style: normal; }
.go { align-self: center; margin-top: 6px; font: inherit; font-size: 12px; font-weight: 600; letter-spacing: 0.14em; padding: 11px 26px; border: 0; border-radius: 30px; background: var(--ink); color: #fff; cursor: pointer; }
.say.end .go { align-self: flex-start; }
button:focus-visible { outline: 3px solid #888; outline-offset: 2px; }

/* the die, landed: big and alone */
.big { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; opacity: 0; transition: opacity var(--fade); }
.big.on { opacity: 1; }
.big .disc { width: clamp(180px, 38vh, 360px); aspect-ratio: 1; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
             background: rgba(255,255,255,0.72); border: 1px solid var(--edge); backdrop-filter: blur(18px) saturate(1.15); -webkit-backdrop-filter: blur(18px) saturate(1.15); box-shadow: 0 16px 50px rgba(0,0,0,0.14); color: var(--ink); }
.big b { font-size: clamp(90px, 22vh, 210px); font-weight: 200; line-height: 1; }
.big span { font-size: 12px; font-weight: 600; letter-spacing: 0.3em; text-transform: uppercase; color: #444; opacity: 0; transition: opacity 0.6s; }
.big span.on { opacity: 0.9; }

/* ---- the cards: glass plaques spread evenly across the full width of the bottom ---- */
.deck { position: absolute; left: 3%; right: 3%; bottom: 4%; height: var(--deck-h); display: flex; justify-content: space-evenly; align-items: flex-end; }
.deck[hidden] { display: none; }
.card { position: relative; flex: none; width: var(--cw); height: var(--ch); box-sizing: border-box;
        padding: 11px 11px; border-radius: 14px; background: var(--glass); border: 1px solid var(--edge);
        backdrop-filter: blur(14px) saturate(1.2); -webkit-backdrop-filter: blur(14px) saturate(1.2);
        box-shadow: 0 14px 34px rgba(0,0,0,0.14), inset 0 1px 0 rgba(255,255,255,0.8);
        display: flex; flex-direction: column; gap: 6px; text-align: left; font: inherit; color: var(--ink); cursor: pointer;
        transform-origin: 50% 100%;
        transition: transform 0.8s cubic-bezier(.2,.75,.2,1), opacity 0.6s ease, height 0.6s ease, background 0.4s; }
.card .nm { font-size: 12px; font-weight: 650; line-height: 1.2; letter-spacing: -0.005em; }
.card .rv { font-size: 10.5px; line-height: 1.32; color: #3a3a3a; opacity: 0; transform: translateY(6px); transition: opacity 0.4s, transform 0.4s; }
.card .tg { margin-top: auto; font-size: 9.5px; font-weight: 600; letter-spacing: 0.06em; color: #222; opacity: 0; transition: opacity 0.6s; }
.card .tg b { display: block; font-size: 15px; letter-spacing: -0.01em; font-weight: 600; }
.card .hint { font-size: 9px; letter-spacing: 0.08em; color: #555; opacity: 0; transition: opacity 0.6s; }
.card.pre { opacity: 0; transform: translateY(60px); }
.deck.open .card:hover, .deck.open .card.focus { transform: translateY(-14px) scale(1.08); background: var(--glass-hi); z-index: 5; }
.deck.open .card:hover .rv, .deck.open .card.focus .rv { opacity: 1; transform: none; }
.deck.open.hovering .card:not(:hover):not(.focus) { opacity: 0.55; }
.card.locked { transform: translate(var(--dx, 0px), -8px) scale(1.2); height: calc(var(--cw) * 1.6); background: var(--glass-hi); z-index: 6; cursor: default; }
.card.locked .rv { opacity: 1; transform: none; }
.card.locked.show .tg, .card.locked.show .hint { opacity: 1; }
.card.away { opacity: 0; transform: translateY(120px); pointer-events: none; }
.card.locked.gone { opacity: 0; }

/* the allotted card, turning over, where your card was locked */
.flip { position: absolute; left: 50%; bottom: calc(4% + 8px); width: calc(var(--cw) * 1.3); height: calc(var(--cw) * 1.6); transform: translateX(-50%); perspective: 900px; opacity: 0; transition: opacity 0.8s; pointer-events: none; }
.flip.on { opacity: 1; }
.flip .in { position: absolute; inset: 0; transform-style: preserve-3d; transform: rotateY(180deg); transition: transform 1.8s cubic-bezier(.45,.05,.2,1); }
.flip.turn .in { transform: rotateY(0deg); }
.flip .face, .flip .back { position: absolute; inset: 0; box-sizing: border-box; border-radius: 18px; backface-visibility: hidden; -webkit-backface-visibility: hidden; border: 1px solid var(--edge); box-shadow: 0 14px 40px rgba(0,0,0,0.18); }
.flip .face { padding: 12px; background: var(--glass-hi); display: flex; flex-direction: column; gap: 10px; text-align: left; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.flip .face small { font-size: 9px; font-weight: 600; letter-spacing: 0.18em; color: #777; }
.flip .face b { font-size: 14px; line-height: 1.2; }
.flip .face span { font-size: 11px; line-height: 1.35; color: #333; }
.flip .back { transform: rotateY(180deg); background: repeating-linear-gradient(45deg, rgba(255,255,255,0.55) 0 8px, rgba(255,255,255,0.3) 8px 16px); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
@media (prefers-reduced-motion: reduce) { .card, .flip .in, .say { transition-duration: 0.01s !important; } }
</style>
</head>
<body>
<div class="gen" id="gen">
  <canvas id="out" width="640" height="384" aria-label="The life"></canvas>
  <canvas id="baby" class="baby" aria-hidden="true"></canvas>
  <canvas id="birth" class="birth" aria-hidden="true"></canvas>
  <canvas id="map" class="birth" aria-hidden="true"></canvas>
  <canvas id="house" class="birth" aria-hidden="true"></canvas>
  <video id="pip" class="pip" muted playsinline aria-label="Your camera"></video>
  <div class="say" id="say" aria-live="polite"></div>
  <div class="big" id="big" aria-live="polite"><div class="disc"><b id="bigN"></b><span id="bigW"></span></div></div>
  <div class="deck" id="deck" role="group" aria-label="Your options" hidden></div>
  <div class="flip" id="flip" aria-live="polite"><div class="in"><div class="face" id="flipFace"></div><div class="back"></div></div></div>
  <div class="debug" id="debug" hidden></div>
</div>

<script type="module">
// ============================================================================
//  Playing Against Chance — Life Trajectory v1. One life, 19 events, from trajectory.json.
//  Chosen = you pick a card and throw the die; a miss is allotted by random.org.
//  Happens = random.org picks one of three hidden outcomes. Fluke = something tiny, paid off later.
//  The unfolding (the beats, all minimums, all in trajectory.json "pacing", tuned live on /panel):
//    ARRIVE  bridge line · the age counts up · the world paints from the last one · the avatar ages
//    SETTLE  name + setup in a soft window      CARDS  rise one by one, wait for you
//    LOCK    your card to the centre, the target   THROW  waits for the die; everything holds still while it rolls
//    LAND    the number, big and alone, then hit or miss   MISS  the allotted card turns over
//    LINGER  what happened stays while the new world paints in
//  Never shown: odds, percentages, the hidden outcomes, that a fluke mattered (until it does).
// ============================================================================
import { createLive } from "./live.js";
import { createDiceReader } from "./dice.js";
import { createDiceReader as createRemoteReader } from "./dice-remote.js";
import { findCamera } from "./cameras.js";
import { createBirth } from "./birth.js";
import { createWorldMap } from "./worldmap.js";
import { createHouse } from "./house.js";
import { createBaby } from "./baby.js";

const $ = (id) => document.getElementById(id);
const sayEl = $("say"), bigEl = $("big"), deckEl = $("deck"), flipEl = $("flip"), debugEl = $("debug");
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const up = (s) => String(s).toUpperCase();
const nextFrame = () => new Promise(r => requestAnimationFrame(() => r()));

const live = createLive({ out: $("out"), video: $("pip"), params: () => ({}) });
const birth = createBirth($("birth"));                         // the egg and the sperm (Birth: "drawn": "egg")
const worldmap = createWorldMap($("map"));                     // Where: the world map ("map")
const house = createHouse($("house"));                         // Whom: the home being built ("house")
const baby = createBaby($("baby"), live);                      // Body: the baby, then the live kid takes over ("baby")
const SCENES = { egg: birth, map: worldmap, house };
let scene = null;                                              // the drawn scene on screen now
let held = false;
function holdAll(on) { held = !!on; live.hold(on); for (const x of [birth, worldmap, house, baby]) x.hold(on); }   // while the die rolls, everything holds still
async function toScene(name) {                                 // crossfade from one drawn scene to the next (or to the painted world)
  const next = SCENES[name] || null;
  if (next === scene) return;
  if (scene) scene.hide(sec("world_fade") * 1.4);
  scene = next;
  if (next) await next.show(sec("world_fade"));
}

// ---------- the life and its timings (trajectory.json; the timings change live from /panel) ----------
let T = null, P = {}, WK = { keep: 0.5, chapter_keep: 0.25, breathe: 5, breathe_keep: 0.6, morph_steps: 3, director: 1, director_lines: 0, director_wait: 2 };
const sec = (k) => Math.max(0, +P[k] || 0) * 1000;
function setPacing(doc) {
  P = doc.pacing || {}; WK = doc.world || WK;
  document.documentElement.style.setProperty("--fade", (sec("fade") / 1000) + "s");
}
async function loadLife() {
  const doc = await (await fetch("/trajectory", { cache: "no-store" })).json();
  if (doc.error) throw new Error(doc.error);
  T = doc; setPacing(doc);
}
let paceSeen = null;
setInterval(async () => {                                     // a slider moved on /panel: take the new timings now
  try {
    const m = await (await fetch("/config", { cache: "no-store" })).json();
    if (paceSeen !== null && m.pace !== paceSeen) setPacing(await (await fetch("/trajectory", { cache: "no-store" })).json());
    paceSeen = m.pace;
  } catch (e) {}
}, 1500);

// ---------- chance: random.org (through the server) ----------
let source = "";
async function draw(lo, hi) {
  try {
    const r = await (await fetch(`/draw?n=1&lo=${lo}&hi=${hi}`, { cache: "no-store" })).json();
    source = r.source; return r.values[0];
  } catch (e) { source = "LOCAL"; return lo + Math.floor(Math.random() * (hi - lo + 1)); }
}

// ---------- the one soft window: the old text fades out fully before the new one fades in ----------
let sayOn = false;
async function unsay() {
  if (!sayOn) return;
  sayOn = false; sayEl.classList.remove("on");
  await sleep(sec("fade"));
}
async function say({ k = "", t = "", s = "", cls = "", begin = false }) {
  await unsay();
  sayEl.className = "say " + cls;
  sayEl.innerHTML = (k ? `<span class="k">${k}</span>` : "") + (t ? `<span class="t">${t}</span>` : "") + (s ? `<span class="s">${s}</span>` : "")
    + (begin ? `<button type="button" class="go" id="begin">BEGIN</button>` : "");           // the only button there is
  if (begin) $("begin").addEventListener("click", () => beginAction && beginAction());
  await nextFrame(); await nextFrame();
  sayEl.classList.add("on"); sayOn = true;
  await sleep(sec("fade"));
}
const kick = (ev) => `AGE ${Math.floor(S.ageF)} · ${esc(ev.title)}`;    // over an outcome
const kickAge = () => `AGE ${Math.floor(S.ageF)}`;                           // over the event's own name

// ---------- the age, the avatar, the world ----------
let S;                                                         // this life
function freshLife() { return { ageF: 0, gender: null, place: "", wear: "", ledger: [], planted: {}, phase: 0, avatar: false, life: [], baby: "" }; }
const AGES = [                                                 // the avatar between these: blended, so it ages continuously
  [0, "a newborn baby wrapped in a soft blanket"], [2, "a toddler"], [6, "a small {child}"], [11, "a {child}"],
  [15, "a teenage {kid}"], [19, "a young {adult}, late teens"], [25, "a young {adult} in their twenties"],
  [33, "a {adult} in their thirties"], [45, "a middle-aged {adult}"], [57, "an older {adult} with greying hair"],
  [68, "an elderly {adult} with white hair and wrinkles"], [82, "a very old frail {adult}, deep wrinkles, white hair"],
  [95, "an extremely old {adult}, frail and very wrinkled"],
];
function who(desc, age) {
  const g = S.gender, w = { child: g === "boy" ? "boy" : g === "girl" ? "girl" : "child", kid: g === "boy" ? "boy" : g === "girl" ? "girl" : "kid",
                           adult: g === "boy" ? "man" : g === "girl" ? "woman" : "person" };
  let d = desc.replace(/\{(\w+)\}/g, (_, k) => w[k]);
  if (g === "nb" && age >= 2) d += ", androgynous";
  if (S.wear && age >= 2) d += `, in ${S.wear}`;
  if (S.life.length) d += ", " + S.life.join(", ");             // what the Body throw gave: eyes, a birthmark, your skin
  return d + ", painterly portrait";
}
function avatarAt(age) {
  live.setControl({ age });
  if (!S.avatar) return;                                       // no live avatar until the kid takes over from the baby
  let i = 0;
  while (i < AGES.length - 2 && age >= AGES[i + 1][0]) i++;
  const [a0, d0] = AGES[i], [a1, d1] = AGES[i + 1];
  const mix = Math.max(0, Math.min(1, (age - a0) / (a1 - a0)));
  live.setPerson(who(d0, age), who(d1, age), mix);
}
function showAge() {}                                          // the age isn't shown: it lives in the avatar and the bridge lines
async function ageTo(to, ms) {                                 // the age runs on; the avatar ages with it
  const from = S.ageF, t0 = performance.now();
  if (to <= from) { avatarAt(S.ageF); return; }
  for (;;) {
    const k = Math.min(1, (performance.now() - t0) / Math.max(1, ms)), e = k * k * (3 - 2 * k);
    S.ageF = from + (to - from) * e; showAge(); avatarAt(S.ageF);
    if (k >= 1) return;
    await sleep(60);
  }
}
let worldDone = Promise.resolve(), worldScene = null, worldGen = 0, worldBreaths = null, breathN = 0;
// The next world, grown out of the last one. Between two scenes it morphs in steps (WK.morph_steps): each step is
// painted from the one before, with the words moving from the old scene to the new; the last step is the new scene
// itself and becomes the event's own world. Keep is split across the steps, so the whole morph keeps about as much
// of the old place as one jump would have.
function world(scene, keep, fresh = false, breaths = null) {
  const prompt = scene + (S.place ? ", " + S.place : "");
  const from = worldScene, n = fresh || !from || from === prompt ? 1 : Math.max(1, Math.round(WK.morph_steps || 1));
  const my = ++worldGen;
  worldScene = prompt;
  worldBreaths = breaths && breaths.length ? breaths.map(b => b + (S.place ? ", " + S.place : "")) : null;
  const fade = sec("world_fade") / n, k = n > 1 ? Math.pow(Math.max(0.01, keep), 1 / n) : keep;
  worldDone = (async () => {
    for (let i = 1; i <= n && my === worldGen; i++) {
      const last = i === n;
      await live.setBackground(last ? prompt : from, { keep: k, fade, fresh: fresh && i === 1, to: last ? "" : prompt, mix: last ? 0 : i / n, anchor: last });
      await sleep(fade);
    }
  })();
  return worldDone;
}
// ---------- the director: an LLM writes each moment's world (and its variations, clothes, a line) from the life so far ----------
// It is asked AHEAD: the next event's arrival as soon as this one's outcome is known, and every branch of an event as it
// begins, so the answers are there when the die lands. Not there in time (WK.director_wait), off, or rejected: the
// written scene, exactly as before. It never decides anything; chance does.
const D = new Map();                                           // moment key -> its answer, null (none), or a pending promise
let evIdx = -1;
const lifeNow = () => ({ age: S.ageF, gender: S.gender, place: S.place, wear: S.wear, traits: S.life,
  ledger: S.ledger.map(([a, t, w, n]) => [a, t, w, n || ""]), planted: Object.values(S.planted) });
function momentsOf(ev) {
  const m = [{ key: `${ev.id}:arrive`, what: "arriving at this event, before anything is decided", scene: ev.scene || "" }];
  if (ev.type === "chosen") {
    for (const c of ev.cards || []) if (c.scene) m.push({ key: `${ev.id}:card:${c.name}`, what: `it went: ${c.name}`, scene: c.scene, reveals: c.reveals || "" });
    if (ev.miss && ev.miss.scene) m.push({ key: `${ev.id}:miss`, what: ev.miss.text, scene: ev.miss.scene });
  } else if (ev.type === "happens") {
    for (const k of ["good", "bad", "neutral"]) { const o = (ev.outcomes || {})[k]; if (o && o.scene) m.push({ key: `${ev.id}:out:${k}`, what: o.text, scene: o.scene }); }
  } else (ev.flukes || []).forEach((f, i) => { if (f.scene) m.push({ key: `${ev.id}:fluke:${i}`, what: `${f.text} (${f.job})`, scene: f.scene }); });
  return m.filter(x => x.scene);
}
function ask(ev, list) {
  if (!list.length) return;
  const p = fetch("/direct", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ life: lifeNow(), event: { id: ev.id, title: ev.title, type: ev.type, setup: ev.setup || ev.text || "" }, moments: list }) })
    .then(r => r.json()).then(j => { live.stat.directorError = j.error || ""; for (const m of list) D.set(m.key, (j.moments || {})[m.key] || null); })
    .catch(() => { for (const m of list) D.set(m.key, null); });
  for (const m of list) D.set(m.key, p.then(() => D.get(m.key)));
}
function prewrite(ev) {                                        // the arrival on its own (needed first, quick), then every branch
  if (!ev || !(+WK.director)) return;
  const ms = momentsOf(ev).filter(m => !D.has(m.key));
  ask(ev, ms.filter(m => m.key.endsWith(":arrive")));
  ask(ev, ms.filter(m => !m.key.endsWith(":arrive")));
}
const prewriteNext = () => T && prewrite(T.events[evIdx + 1]);
async function directed(key) {
  if (!(+WK.director) || !D.has(key)) return null;
  let v = D.get(key);
  if (v && typeof v.then === "function") v = await Promise.race([v, sleep((+WK.director_wait || 0) * 1000).then(() => null)]);
  return v && v.world ? v : null;
}
// the world for a moment: the director's if it's ready, the written scene if not. outcome: its clothes count too.
function worldFor(key, scene, keep, outcome = false) {
  const p = (async () => {
    const d = await directed(key);
    if (d && outcome && d.clothes) S.wear = d.clothes;
    if (d) { live.stat.directed = (live.stat.directed || 0) + 1; dispatchEvent(new CustomEvent("pac-moment", { detail: { key, line: d.line, world: d.world, written: scene } })); }
    lastLine = d && +WK.director_lines ? d.line : "";
    await world(d ? d.world : scene, keep, false, d ? d.breathe : null);
  })();
  worldDone = p;
  return p;
}
let lastLine = "";
const dline = () => lastLine ? `<br><span style="color:#555;font-style:italic">${esc(lastLine)}</span>` : "";

// Inside an event the world keeps changing: every WK.breathe seconds a new variation of the event's own world
// (WK.breathe_keep of it survives), crossfaded in. Never while the die rolls, never during a morph.
(async function breathe() {
  for (;;) {
    const every = +WK.breathe || 0;
    await sleep(every > 0 ? every * 1000 : 1500);
    if (!(every > 0) || !worldScene || held || scene || document.hidden) continue;   // not under the egg, map or house
    const my = worldGen;
    await worldDone;
    if (my !== worldGen || held) continue;
    const p = worldBreaths ? worldBreaths[breathN++ % worldBreaths.length] : worldScene;   // the director's variations, if it wrote them
    await live.setBackground(p, { keep: +WK.breathe_keep || 0.6, fade: Math.min(every * 800, Math.max(1200, sec("world_fade"))), base: "anchor" });
  }
})();

// ---------- the die (dice_reader.py, the browser reader, or ROLL on screen) ----------
let diceOn = false, diceSrc = "", rollWaiter = null, sawThrow = false;
let dieText = "not connected (R rolls on screen)";              // shown only in the hidden debug line (D)
const chip = (html) => { dieText = html.replace(/<[^>]+>/g, ""); };
let turn = "watch";
const TURN = { watch: "not your turn: watch", pick: "pick a card", throw: "<b>throw it</b>", begin: "<b>throw to begin</b>" };
function setTurn(t) { turn = t; if (diceOn) chip(TURN[t]); if (t !== "throw") holdAll(false); }
const READING = { rolling: "rolling…", settling: "landing…", reading: "reading…", unclear: "can't read it, throw again" };
const diceEvents = {
  onState: (s) => {
    if (s === "rolling") { sawThrow = true; if (turn === "throw") holdAll(true); }   // while it rolls, everything holds still
    if (s === "unclear") holdAll(false);
    if (!diceOn) return;
    if (s === "needs empty tray") chip('<a href="/dice.html">set up the empty tray</a>');
    else if (READING[s] && (turn === "throw" || turn === "begin")) chip(`<b>${READING[s]}</b>`);
    else chip(TURN[turn]);
  },
  onRoll: (n) => {
    if (turn !== "throw" && turn !== "begin") return;       // not your turn: a throw now means nothing
    if (!sawThrow) { chip(`<b>${n}</b> ignored: no throw seen`); return; }
    sawThrow = false; chip(`<b>${n}</b>`);
    if (rollWaiter) rollWaiter(n, true);
  },
};
function diceReady(src) { diceOn = true; diceSrc = src; chip(TURN[turn]); }
let browserDice = null;
async function tryPython() {
  try { await createRemoteReader(diceEvents).start(); if (browserDice) { browserDice.stop(); browserDice = null; } diceReady("python"); return true; }
  catch (e) { return false; }
}
(async () => {
  if (await tryPython()) return;
  const look = setInterval(async () => { if (await tryPython()) clearInterval(look); }, 3000);
  let cam = "";
  try { cam = await findCamera("pac-dice-cam"); } catch (e) {}
  if (!cam) { dieText = "none: start dice_reader.py, or set one up on /dice.html (R rolls on screen)"; return; }
  const dice = createDiceReader({ video: Object.assign(document.createElement("video"), { muted: true, playsInline: true }), ...diceEvents });
  try { await dice.start(cam); if (diceSrc !== "python") { browserDice = dice; diceReady("browser"); } else dice.stop(); }
  catch (e) { if (!diceOn) dieText = "dice camera not found (R rolls on screen)"; }
})();

// one throw: the physical die, or R / Space on screen (random.org) when there's no die. "begin": also BEGIN.
function waitThrow(kind = "throw") {
  setTurn(kind); sawThrow = false;
  return new Promise(resolve => {
    const done = (n, die) => { rollWaiter = null; screenRoll = null; beginAction = null; resolve({ n, die }); };
    rollWaiter = done;
    screenRoll = async () => { screenRoll = null; holdAll(true); await sleep(500); done(await draw(1, 6), false); };
    if (kind === "begin") beginAction = () => done(0, false);
  });
}
let screenRoll = null, beginAction = null;

// ---------- the deck ----------
let deckKeys = null;
function deck(cards, onHover = null) {                         // cards rise one by one; resolves with the one you pick
  deckEl.hidden = false; deckEl.className = "deck";
  document.body.classList.add("cards");                         // the narrative box lifts above the row
  deckEl.innerHTML = cards.map((c) => `<button type="button" class="card pre" aria-label="${esc(c.name)}: ${esc(c.reveals)}">
      <span class="nm">${esc(c.name)}</span><span class="rv">${esc(c.reveals)}</span><span class="tg"></span><span class="hint"></span></button>`).join("");
  const els = [...deckEl.querySelectorAll(".card")];
  return new Promise(async resolve => {
    for (const el of els) { el.classList.remove("pre"); await sleep(sec("card_rise")); }
    await sleep(500);
    deckEl.classList.add("open"); setTurn("pick");
    let focus = -1;
    const setFocus = (i) => { focus = (i + els.length) % els.length; els.forEach((e, k) => e.classList.toggle("focus", k === focus)); deckEl.classList.add("hovering"); onHover && onHover(focus); };
    const pick = (i) => { if (!deckEl.classList.contains("open")) return; deckEl.classList.remove("open", "hovering"); deckKeys = null; onHover && onHover(-1); resolve({ i, els }); };
    els.forEach((el, i) => {
      el.addEventListener("click", () => pick(i));
      el.addEventListener("mouseenter", () => { els.forEach(e => e.classList.remove("focus")); focus = i; deckEl.classList.add("hovering"); onHover && onHover(i); });
      el.addEventListener("mouseleave", () => { deckEl.classList.remove("hovering"); onHover && onHover(-1); });
    });
    deckKeys = (key) => {
      if (key === "ArrowRight") setFocus(focus + 1);
      else if (key === "ArrowLeft") setFocus(focus - 1);
      else if ((key === "Enter" || key === " ") && focus >= 0) pick(focus);
      else { const n = parseInt(key, 10); if (n >= 1 && n <= els.length) pick(n - 1); }
    };
  });
}
async function lock(els, i, label) {                           // your card glides to the centre; the others sink away
  const d = deckEl.getBoundingClientRect(), r = els[i].getBoundingClientRect();
  els[i].style.setProperty("--dx", Math.round(d.left + d.width / 2 - (r.left + r.width / 2)) + "px");
  els.forEach((e, k) => { e.classList.remove("focus"); e.classList.toggle("locked", k === i); e.classList.toggle("away", k !== i); });
  await sleep(sec("lock"));
  els[i].querySelector(".tg").innerHTML = `throw<b>${esc(label)}</b>`;
  if (!diceOn) cardHint(els[i], "press R to roll");
  els[i].classList.add("show");
  await sleep(700);
}
const cardHint = (el, html) => { el.querySelector(".hint").innerHTML = html; };
function deckGone() { deckEl.hidden = true; deckEl.innerHTML = ""; document.body.classList.remove("cards"); }

// "3 or more" · "a 6" · "exactly 1": the target is written the way the player sees it
function target(text) {
  const t = String(text), m = /(\d)\s*or more/i.exec(t);
  if (m) { const v = +m[1]; return { hit: (n) => n >= v, label: t }; }
  const v = +(/(\d)/.exec(t) || [0, 6])[1];
  return { hit: (n) => n === v, label: t };
}

// the number, big and alone; then hit or miss
async function land(n, hit) {
  $("bigN").textContent = n; $("bigW").textContent = hit ? "hit" : "miss"; $("bigW").classList.remove("on");
  bigEl.classList.add("on");
  await sleep(Math.max(600, sec("land") * 0.55));
  $("bigW").classList.add("on");
  await sleep(Math.max(500, sec("land") * 0.45));
  bigEl.classList.remove("on"); await sleep(sec("fade"));
}
async function turnOver(card, note) {                          // the allotted card turns over slowly
  $("flipFace").innerHTML = `<small>${esc(note)}</small><b>${esc(card.name)}</b><span>${esc(card.reveals)}</span>`;
  flipEl.className = "flip"; await nextFrame(); await nextFrame();
  flipEl.classList.add("on"); await sleep(700);
  flipEl.classList.add("turn"); await sleep(Math.max(1900, sec("miss")));
  flipEl.classList.remove("on"); await sleep(800);
  flipEl.className = "flip";
}

// ---------- the events ----------
function apply(c) {
  if (c.gender) S.gender = c.gender;
  if (c.place) S.place = c.place;
  if (c.wear) S.wear = c.wear;
}
async function linger(key, extraAge) {                         // what happened stays while the new world paints in
  await Promise.all([sleep(sec(key)), worldDone, extraAge ? ageTo(extraAge, sec(key) * 0.8) : null]);
}

async function chosen(ev) {
  if (ev.drawn && SCENES[ev.drawn]) toScene(ev.drawn);
  if (ev.drawn === "baby") await babyArrives();
  await say({ k: kickAge(), t: esc(ev.title), s: esc(ev.setup) });
  await sleep(sec("settle"));
  const { i, els } = await deck(ev.cards, ev.drawn === "map" ? (k) => worldmap.hover(k >= 0 ? ev.cards[k].name : null) : null);
  const c = ev.cards[i], tg = target(c.target);
  await Promise.all([unsay(), lock(els, i, tg.label)]);
  const tries = Math.max(1, ev.tries || 1);
  let hit = false, n = 0, t = 1;
  for (; t <= tries; t++) {
    if (tries > 1) cardHint(els[i], (t === 1 ? `${tries} throws` : `${tries - t + 1} ${tries - t + 1 === 1 ? "throw" : "throws"} left`) + (diceOn ? "" : " · press R"));
    if (ev.drawn === "egg") birth.ready(true);
    ({ n } = await waitThrow());
    setTurn("watch"); holdAll(false);
    els[i].classList.add("gone"); await sleep(500);
    hit = tg.hit(n);
    await land(n, hit);
    if (ev.drawn === "egg") await birth.attempt(hit);           // one reaches the egg, or they all fall short
    if (hit || t === tries) break;
    els[i].classList.remove("gone"); await sleep(600);
  }
  deckGone();
  let got = c, how = "hit";
  if (!hit) {
    if (ev.allot === false) how = "none";
    else {
      await sleep(sec("miss") * 0.4);
      const others = ev.cards.filter(x => x !== c);
      got = others[(await draw(1, others.length)) - 1];
      how = tries > 1 ? "override" : "allotted";
      await turnOver(got, how === "override" ? "THE OVERRIDE" : "ALLOTTED");
      if (ev.drawn === "egg") await birth.win();                // chance's override: one makes it anyway
    }
  }
  if (ev.drawn === "map" && how !== "none") await worldmap.reveal(got.name, how !== "hit");   // the region fills in on the map
  if (how === "none") {
    const w = worldFor(`${ev.id}:miss`, ev.miss.scene, WK.keep, true);
    S.ledger.push([S.ageF, ev.title, `${ev.miss.text.replace(/\.$/, "")}`, `went to: ${c.name}`]); prewriteNext();
    await Promise.race([w, sleep(250)]);
    await say({ k: kick(ev), t: esc(ev.miss.text), s: dline() });
  } else {
    apply(got);
    const w = got.scene ? worldFor(`${ev.id}:card:${got.name}`, got.scene, WK.keep, true) : null;
    if (ev.drawn === "house") house.build(got.name, sec("linger") * 0.9);                  // the home, built while it lingers
    const note = how === "hit" ? "" : how === "override" ? `${tries} throws, then the override.` : `You went for ${esc(c.name)}. Chance allotted this.`;
    S.ledger.push([S.ageF, ev.title, got.name, how === "hit" ? "" : how === "override" ? `went for ${c.name}; ${tries} throws, then the override` : `went for ${c.name}`]); prewriteNext();
    if (w) await Promise.race([w, sleep(250)]);
    await say({ k: kick(ev), t: esc(got.name), s: esc(got.reveals) + dline() + (note ? `<br><span style="color:#777;font-size:12px">${note}</span>` : "") });
  }
  avatarAt(S.ageF);                                           // a new outfit / gender: the avatar morphs to it
  if (ev.drawn === "baby") { await sleep(sec("settle")); await emerge(ev, got); return; }
  await linger("linger", how !== "none" && got.age);
}

// ---------- Body: the baby, painted once, its traits emerging one by one ----------
async function portrait(prompt, base, strength = 0.38) {
  try {
    const r = await fetch(`/portrait?prompt=${encodeURIComponent(prompt)}&base=${base ? 1 : 0}&strength=${strength}`, { cache: "no-store" });
    return r.ok ? await createImageBitmap(await r.blob()) : null;
  } catch (e) { return null; }
}
function skinWords(rgb) {                                       // your own skin, from the camera; never chosen, never ranked
  if (!rgb) return "skin like the player's own";
  const L = 0.299 * rgb[0] + 0.587 * rgb[1] + 0.114 * rgb[2];
  return L > 205 ? "very fair skin" : L > 175 ? "fair skin" : L > 145 ? "light brown skin" : L > 115 ? "brown skin" : L > 85 ? "dark brown skin" : "deep brown skin";
}
async function babyArrives() {                                  // the painted home is underneath; the baby fades in over it
  const g = S.gender, who = g === "boy" ? "baby boy" : g === "girl" ? "baby girl" : "baby";
  S.baby = `a newborn ${who} lying in a cot, wrapped in a soft blanket, eyes open looking up, tiny hands near the face, close-up portrait, soft window light`;
  const bmp = await portrait(S.baby, false);
  if (bmp) await baby.show(bmp, sec("world_fade"));
}
async function emerge(ev, got) {
  const genes = [{ label: "Your skin", words: skinWords(live.skinTone()), life: true }, ...(got.genes || [])];
  let words = S.baby;
  for (const gn of genes) {
    words += ", " + gn.words;
    const next = portrait(words, true);
    await say({ k: kick(ev), t: esc(gn.label) + "." });
    const bmp = await next;
    if (bmp) await baby.update(bmp, 1200);
    if (gn.life) S.life.push(gn.words);
    await sleep(sec("gene"));
  }
}
async function takeover(ms) {                                   // the live kid emerges from the baby: the avatar fades in while
  S.avatar = true;                                              // its generation strength ramps up from loose to full
  live.setPersonAlpha(0); live.setControl({ age: S.ageF, ramp: 0 }); avatarAt(S.ageF);
  const t0 = performance.now();
  for (;;) {
    const k = Math.min(1, (performance.now() - t0) / Math.max(1, ms)), e = k * k * (3 - 2 * k);
    live.setPersonAlpha(e); baby.alpha(1 - e); live.setControl({ ramp: e });
    if (k >= 1) break;
    await sleep(60);
  }
  baby.hide(400);
}

async function happens(ev) {
  if (ev.reveals && S.planted[ev.reveals]) {                  // the fluke comes back: slow, the original line word for word
    const p = S.planted[ev.reveals];
    await say({ k: kickAge(), t: esc(ev.title) });
    await sleep(sec("settle") * 0.6);
    await unsay(); await sleep(sec("fade") * 0.5);
    await say({ k: `AT ${p.age}`, s: `“${esc(p.text)}”`, cls: "quote" });
    await sleep(sec("reveal"));
  } else {
    await say({ k: kickAge(), t: esc(ev.title), s: "Something happens." });
    await sleep(sec("happen_hold"));
  }
  const key = ["good", "bad", "neutral"][(await draw(1, 3)) - 1], o = ev.outcomes[key];
  const w = worldFor(`${ev.id}:out:${key}`, o.scene, WK.keep, true);
  S.ledger.push([S.ageF, ev.title, o.text, ""]); prewriteNext();
  await Promise.race([w, sleep(250)]);
  await say({ k: kick(ev), t: "", s: `<span style="font-size:18px;color:#111">${esc(o.text)}</span>` + dline() });
  await linger("happen_linger");
}

async function fluke(ev) {                                     // deliberately understated
  if (ev.plant) {
    S.planted[ev.id] = { age: Math.floor(S.ageF), text: ev.text };
    S.ledger.push([S.ageF, ev.title, ev.text, ""]); prewriteNext();
    await say({ s: esc(ev.text), cls: "small" });
    await sleep(sec("fluke_hold"));
    await unsay();
    return;
  }
  const fi = (await draw(1, ev.flukes.length)) - 1, f = ev.flukes[fi];   // which small thing finds you work
  await say({ s: esc(f.text), cls: "small" });
  await sleep(sec("fluke_hold"));
  worldFor(`${ev.id}:fluke:${fi}`, f.scene, WK.keep, true);
  S.ledger.push([S.ageF, ev.title, f.job, f.text]); prewriteNext();
  await say({ k: kick(ev), t: esc(f.job) });
  await linger("fluke_linger");
}

// ---------- the run ----------
const PHASES = ["BASELINE", "CRUST", "ADULTHOOD", "LATER LIFE"];   // not shown on screen; they still pick the phase references
function setPhase(i) { phaseRef(i); }
async function phaseRef(i) {                                   // optional: a style reference painting per phase (trajectory.json phase_refs)
  const url = T && T.phase_refs && T.phase_refs[i];
  if (!url) return;
  try {
    const img = await (await fetch(url, { cache: "force-cache" })).blob();
    for (const side of ["person", "background"])
      await fetch(`/reference?side=${side}&kind=style`, { method: "POST", body: img, headers: { "Content-Type": img.type || "image/jpeg" } });
    live.refresh();
  } catch (e) { console.warn("[phase ref]", url, e); }
}

async function arrive(ev, prev) {                              // the bridge, the years, the world and the avatar, together
  const chapter = !!(prev && prev.chapter);
  if (chapter) { S.phase = Math.min(PHASES.length - 1, S.phase + 1); setPhase(S.phase); }
  const dur = sec(chapter ? "chapter" : "arrive");
  let handover = null;
  if (prev && prev.drawn === "baby") handover = takeover(sec("takeover"));     // the baby becomes the live kid
  else if ((ev.drawn || null) !== (prev && prev.drawn || null)) toScene(ev.drawn === "baby" ? null : ev.drawn);   // drawn scene -> the next one, or the painted world
  if (prev && prev.bridge) await say({ s: esc(prev.bridge), cls: "bridge" });
  const w = ev.scene ? worldFor(`${ev.id}:arrive`, ev.scene, chapter ? WK.chapter_keep : WK.keep) : null;
  prewrite(ev);                                                 // its branches, if they weren't asked for yet
  await Promise.all([ageTo(ev.age, dur * 0.85), sleep(dur), w, handover]);
  await unsay();
}

async function life() {
  if (!T) await loadLife();
  S = freshLife(); setPhase(0); D.clear(); evIdx = -1; lastLine = "";
  deckGone(); bigEl.classList.remove("on");
  live.setPerson(null); live.setReal(false); live.setPersonAlpha(1); live.setControl({ age: 0, ramp: 1 });
  baby.hide(0); worldmap.reset(); house.reset(); if (scene) scene.hide(0); scene = null;
  worldmap.load().catch(() => {}); baby.preload();
  await live.whenReady();
  world(T.events[0].scene, 0, true);                           // a new life: a fresh world
  if (T.events[0].drawn === "egg") { birth.reset(); toScene("egg"); }
  await say({ k: "PLAYING AGAINST CHANCE", t: `One life. ${T.events.length} moments.`, s: diceOn ? "Throw the die to begin." : "", begin: true });
  await waitThrow("begin");
  setTurn("watch"); holdAll(false);
  await unsay();
  avatarAt(0);
  await sleep(sec("arrive") * 0.6);
  let prev = null;
  for (const ev of T.events) {
    evIdx++;
    if (!prev) { prewrite(ev); prewriteNext(); }
    if (prev) await arrive(ev, prev);
    if (ev.type === "chosen") await chosen(ev);
    else if (ev.type === "happens") await happens(ev);
    else await fluke(ev);
    await unsay();
    prev = ev;
  }
  if (prev && prev.bridge) { await say({ s: esc(prev.bridge), cls: "bridge" }); await sleep(sec("arrive")); await unsay(); }
  await sleep(sec("final_silence"));                           // a final silence before anything else
  await ending();
  await waitThrow("begin");
  setTurn("watch"); await unsay();
  T = null;                                                     // the next life re-reads trajectory.json (edits show up)
  life();
}

async function ending() {                                       // the life, read back
  setPhase(PHASES.length);
  const rows = S.ledger.map(([a, t, what, note]) => `<tr><td>${Math.floor(a)}</td><td>${esc(t)}</td><td>${esc(what)}${note ? ` <i>(${esc(note)})</i>` : ""}</td></tr>`).join("");
  await say({ k: "A LIFE", t: "", s: `<table>${rows}</table>` + (diceOn ? `<br><span style="color:#777;font-size:12px">Throw the die for another life.</span>` : ""), cls: "end", begin: true });
}

// ---------- keys: cards = ← → Enter or 1–9 · R / Space = roll on screen · Space / Enter = BEGIN · F = fullscreen · D = debug · C = next camera ----------
document.addEventListener("keydown", (e) => {
  if (e.repeat || e.target instanceof HTMLInputElement) return;
  if (e.key === "f" || e.key === "F") { setFull(!document.fullscreenElement); return; }
  if (e.key === "d" || e.key === "D") { debugEl.hidden = !debugEl.hidden; return; }
  if (e.key === "c" || e.key === "C") { switchCamera(); return; }
  if (deckKeys && (e.key.startsWith("Arrow") || e.key === "Enter" || e.key === " " || /^[1-9]$/.test(e.key))) { e.preventDefault(); deckKeys(e.key); return; }
  if ((e.key === " " || e.key === "Enter") && beginAction && !(e.target instanceof HTMLButtonElement)) { e.preventDefault(); beginAction(); return; }
  if ((e.key === "r" || e.key === "R" || e.key === " ") && screenRoll && turn === "throw") { e.preventDefault(); screenRoll(); return; }
});

// ---------- full screen ----------
function setFull(on) {                                          // real browser fullscreen; the camera window hides there
  if (on && !document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(() => {});
  if (!on && document.fullscreenElement) document.exitFullscreen?.();
}
document.addEventListener("fullscreenchange", () => document.body.classList.toggle("full", !!document.fullscreenElement));

// C: the next camera becomes the avatar camera (remembered). Its name shows for a few seconds in the debug line.
let camFlash = 0;
async function switchCamera() {
  const name = await live.nextCamera();
  camFlash = performance.now() + 4000; debugEl.hidden = false; debugEl.dataset.flash = "1";
  debugEl.textContent = "avatar camera: " + (name || "?");
}
function status() {                                             // the hidden debug line (D): never on screen otherwise
  if (debugEl.dataset.flash && performance.now() > camFlash) { delete debugEl.dataset.flash; debugEl.hidden = true; }
  if (!debugEl.hidden) {
    const st = live.stat;
    if (!debugEl.dataset.flash) debugEl.textContent = !st.online ? "server offline" : [`${st.fps} fps`, source && `chance ${source}`, `camera: ${st.camera || "?"}`, st.camNote, `die${diceSrc ? ` (${diceSrc})` : ""}: ${dieText}`, `turn: ${turn}`, st.worldError ? `WORLD ERROR: ${st.worldError}` : (st.worldChange ? `world change ${st.worldChange}` : ""), +WK.director ? (st.directorError ? `director: ${st.directorError}` : `directed ${st.directed || 0}`) : "director off", st.note, st.seg].filter(Boolean).join(" · ");
  }
  setTimeout(status, 250);
}
status();
live.camera.catch(e => say({ k: "NO CAMERA", s: esc(e.message || e.name) }));
life().catch(e => say({ k: "COULDN'T START", s: esc(e.message || e) }));
</script>
</body>
</html>
