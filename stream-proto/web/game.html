<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Playing Against Chance</title>
<style>
/* Layout: the live picture fills the framed screen; one short message sits centred at its bottom edge.
   Underneath: the four stages (left), the choices for this round (centre), one big button (right). White, minimal. */
:root { --ink: #111; --dim: #8a8a8a; --line: #d6d6d6; --bg: #fff; --miss: #c0392b; color-scheme: light; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", sans-serif; }
.frame { box-sizing: border-box; height: 100%; max-width: 1240px; margin: 0 auto; padding: 24px; display: grid; grid-template-rows: minmax(0, 1fr) auto; gap: 16px; }
.gen { position: relative; min-height: 0; border: 1.5px solid var(--ink); border-radius: 4px; overflow: hidden; display: grid; place-items: center; background: #f5f5f5; }
.gen canvas { width: 100%; height: 100%; object-fit: contain; display: block; }
.pip { position: absolute; top: 12px; right: 12px; width: clamp(110px, 16%, 200px); aspect-ratio: 16 / 9; object-fit: cover; transform: scaleX(-1); border: 1.5px solid var(--ink); border-radius: 3px; background: #ddd; }
.status { position: absolute; top: 12px; left: 14px; font-size: 11px; letter-spacing: 0.04em; color: var(--dim); background: rgba(255,255,255,0.85); padding: 3px 7px; border-radius: 3px; }
.status b { font-weight: 600; color: var(--ink); }

/* the message: centred along the bottom of the picture */
.msg { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); width: max-content; max-width: min(720px, calc(100% - 28px)); box-sizing: border-box; padding: 12px 20px; background: rgba(255,255,255,0.94); border: 1.5px solid var(--ink); border-radius: 4px; text-align: center; display: flex; flex-direction: column; gap: 5px; }
.msg[hidden] { display: none; }
.msg .kicker { font-size: 10px; font-weight: 600; letter-spacing: 0.14em; color: var(--dim); }
.msg .line { font-size: 19px; line-height: 1.25; font-weight: 600; text-wrap: balance; }
.msg .sub { font-size: 13px; color: #555; line-height: 1.4; text-wrap: balance; }
.msg .sub b { color: var(--ink); }
.msg .miss { color: var(--miss); }
.msg dl { margin: 6px 0 2px; display: grid; grid-template-columns: auto auto; gap: 4px 14px; text-align: left; font-size: 13px; justify-content: center; }
.msg dt { font-size: 10px; font-weight: 600; letter-spacing: 0.12em; color: var(--dim); padding-top: 2px; }
.msg dd { margin: 0; font-weight: 600; }

.bar { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 18px; align-items: center; min-height: 64px; }
.steps { display: flex; gap: 6px; align-items: center; font-size: 11px; font-weight: 600; letter-spacing: 0.12em; color: #bbb; }
.steps span.now { color: var(--ink); }
.steps span.done { color: var(--dim); }
.steps i { width: 16px; height: 1.5px; background: var(--line); }
.left { display: flex; flex-direction: column; gap: 10px; }
.looks { display: inline-flex; align-self: flex-start; border: 1.5px solid var(--ink); border-radius: 4px; overflow: hidden; }
.looks button { font: inherit; font-size: 10px; font-weight: 600; letter-spacing: 0.1em; padding: 6px 11px; border: 0; background: #fff; color: var(--ink); cursor: pointer; }
.looks button + button { border-left: 1.5px solid var(--ink); }
.looks button[aria-pressed="true"] { background: var(--ink); color: #fff; }
.dicestat { font-size: 10px; font-weight: 600; letter-spacing: 0.1em; color: var(--dim); }
.dicestat b { color: var(--ink); }
.dicestat a { color: var(--ink); }

/* the choices for this round */
.choices { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.ch { min-width: 64px; padding: 9px 14px; display: flex; flex-direction: column; align-items: center; gap: 3px; font: inherit; background: #fff; color: var(--ink); border: 1.5px solid var(--ink); border-radius: 4px; cursor: pointer; transition: background 0.08s, color 0.08s; }
.ch b { font-size: 12px; font-weight: 650; letter-spacing: 0.05em; white-space: nowrap; }
.ch .faces { display: flex; gap: 3px; height: 15px; }
.ch .faces svg { width: 15px; height: 15px; opacity: 0.7; }
.ch:disabled { cursor: default; }
.ch.round { width: 52px; height: 52px; min-width: 0; padding: 0; border-radius: 50%; justify-content: center; }
.ch.round b { font-size: 17px; }
.ch.wish { box-shadow: 0 0 0 3px #fff, 0 0 0 5px var(--ink); }          /* what you wished for */
.ch.on, .ch.got { background: var(--ink); color: #fff; }                  /* chance's light / chance's pick */
.ch.on .faces svg, .ch.got .faces svg { opacity: 0.8; }
.ch.dim { opacity: 0.35; }

.go { font: inherit; font-size: 15px; font-weight: 600; letter-spacing: 0.08em; min-width: 170px; padding: 18px 26px; border: 1.5px solid var(--ink); border-radius: 4px; background: var(--ink); color: #fff; cursor: pointer; }
.go:disabled { background: #fff; color: #bbb; border-color: #ccc; cursor: default; }
.go:active:not(:disabled) { transform: translateY(1px); }
button:focus-visible { outline: 3px solid #888; outline-offset: 2px; }
@media (max-width: 900px) {
  .frame { padding: 16px; }
  .bar { grid-template-columns: 1fr; justify-items: center; }
  .go { width: 100%; }
}
</style>
</head>
<body>
<div class="frame">
  <div class="gen">
    <canvas id="out" width="640" height="384" aria-label="The game screen"></canvas>
    <video id="pip" class="pip" muted playsinline aria-label="Your camera"></video>
    <div class="status" id="status">connecting…</div>
    <div class="msg" id="msg" aria-live="polite"></div>
  </div>
  <div class="bar">
    <div class="left">
      <div class="steps" id="steps"><span>BIRTH</span><i></i><span>BODY</span><i></i><span>HOME</span><i></i><span>WORLD</span></div>
      <div class="looks" role="group" aria-label="Look"><button data-look="pixel">PIXEL</button><button data-look="line">LINE</button><button data-look="paint">PAINT</button></div>
      <div class="dicestat" id="dice" aria-live="polite">DIE · …</div>
    </div>
    <div class="choices" id="choices" role="group" aria-label="Your choices"></div>
    <button class="go" id="go" disabled>…</button>
  </div>
</div>

<script type="module">
import { createLive } from "./live.js";
import { createDiceReader } from "./dice.js";
import { createDiceReader as createRemoteReader } from "./dice-remote.js";
import { findCamera } from "./cameras.js";
import { BIRTH, BODY, HOME, WORLD, PROMPTS, STYLE, LOOK, setLook } from "./stages.js";

const $ = (id) => document.getElementById(id);
const msgEl = $("msg"), go = $("go"), choicesEl = $("choices"), statusEl = $("status");
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
let stageStrength = 0.75;
// ---------- the look switch: PIXEL / LINE / PAINT ----------
let look = LOOK;
try { look = localStorage.getItem("pac-look") || LOOK; } catch (e) {}
const live = createLive({ out: $("out"), video: $("pip"), params: () => ({ look: look === "paint" ? "" : look })   /* how it's painted: tuned on /panel */ });
// what's on screen, so it can be redrawn in a new look: a function giving { person, background } prompts
let current = null, lastBg = null;
function show(fn) {
  current = fn;
  const p = fn();
  if (p.background !== lastBg) { lastBg = p.background; live.setBackground(p.background); }   // backgrounds only when they change
  live.setPerson(p.person);
}
function clearShow() { current = null; lastBg = null; live.setPerson(null); live.setBackground(null); }
function setLookTo(v) {
  look = v; setLook(v);
  try { localStorage.setItem("pac-look", v); } catch (e) {}
  document.querySelectorAll(".looks button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.look === v)));
  if (current) { lastBg = null; show(current); }      // redraw what's on screen in the new look
}
document.querySelectorAll(".looks button").forEach(b => b.addEventListener("click", () => setLookTo(b.dataset.look)));
setLookTo(look);

// ---------- chance ----------
let source = "";
async function draw(n, lo, hi) {
  try {
    const r = await (await fetch(`/draw?n=${n}&lo=${lo}&hi=${hi}`, { cache: "no-store" })).json();
    source = r.source; return r.values;
  } catch (e) {                                            // server unreachable: the browser's own randomness
    source = "LOCAL";
    return Array.from({ length: n }, () => lo + Math.floor(Math.random() * (hi - lo + 1)));
  }
}
const total = (opts) => opts.reduce((s, o) => s + o.w, 0);
async function weighted(opts) {                            // draw 1..total, walk the list
  const [v] = await draw(1, 1, total(opts));
  let c = 0;
  for (const o of opts) { c += o.w; if (v <= c) return o; }
  return opts[opts.length - 1];
}
const odds = (o, opts) => { const p = o.w / total(opts); return p >= 0.1 ? Math.round(p * 100) + "%" : "1 in " + Math.round(1 / p); };   // 49%, or 1 in 20 for the rare ones
const name = (o) => (o.short || o.label);

// which die faces pick which option: 6 options = one face each. Fewer options share the six faces;
// the faces left over go to the most common options. An option's own "faces: [5, 6]" in stages.js overrides this.
function faceMap(opts) {
  const map = new Array(6).fill(-1);
  if (opts.some(o => o.faces)) { opts.forEach((o, i) => (o.faces || []).forEach(f => { map[f - 1] = i; })); return map; }
  const per = opts.map(() => Math.floor(6 / opts.length));
  const extra = 6 - per.reduce((a, b) => a + b, 0);
  [...opts.keys()].sort((a, b) => opts[b].w - opts[a].w || a - b).slice(0, extra).forEach(i => per[i]++);
  let f = 0;
  per.forEach((k, i) => { for (let j = 0; j < k && f < 6; j++) map[f++] = i; });
  return map;
}
const PIPS = { 1: [[2, 2]], 2: [[1, 1], [3, 3]], 3: [[1, 1], [2, 2], [3, 3]], 4: [[1, 1], [3, 1], [1, 3], [3, 3]], 5: [[1, 1], [3, 1], [2, 2], [1, 3], [3, 3]], 6: [[1, 1], [3, 1], [1, 2], [3, 2], [1, 3], [3, 3]] };
const dieFace = (n) => `<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="0.75" y="0.75" width="14.5" height="14.5" rx="3" fill="none" stroke="currentColor" stroke-width="1.5"/>${PIPS[n].map(([x, y]) => `<circle cx="${x * 4}" cy="${y * 4}" r="1.5" fill="currentColor"/>`).join("")}</svg>`;
const low = (s) => String(s).toLowerCase();

// ---------- the screen and the bar ----------
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function msg(kicker, line, sub = "") {
  msgEl.hidden = false;
  msgEl.innerHTML = `<span class="kicker">${kicker}</span>${line ? `<span class="line">${line}</span>` : ""}${sub ? `<span class="sub">${sub}</span>` : ""}`;
}
function setSteps(i) { [...$("steps").querySelectorAll("span")].forEach((s, k) => { s.className = k < i ? "done" : k === i ? "now" : ""; }); }
let action = null;
function button(label, fn) { go.textContent = label; go.disabled = !fn; action = fn; }
go.addEventListener("click", () => { if (!go.disabled && action) action(); });
let waiting = false;                                        // between rounds: a throw of the die presses the big button
const waitFor = (label) => new Promise(res => {
  waiting = true;
  if (diceOn) chip("<b>throw to go on</b>");
  button(label, () => { waiting = false; button("…", null); res(); });
});
let choose = null, pickFace = null;                         // set while a round is waiting for your pick
document.addEventListener("keydown", (e) => {
  if (e.repeat) return;
  if ((e.key === " " || e.key === "Enter") && !(e.target instanceof HTMLButtonElement)) { e.preventDefault(); go.click(); }
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= 6 && pickFace) pickFace(n);              // keys 1–6 = the die's faces
});

// ---------- one round: you pick what you wish for, then chance draws what you get ----------
function round({ kicker, line, options, showFaces = true, roundButtons = false, onPick, onRoll, onLand }) {
  return new Promise(resolve => {
    msg(kicker, line, diceOn ? "Throw the die." : "");
    const faces = faceMap(options);
    choicesEl.innerHTML = "";
    const btns = options.map((o, i) => {
      const b = document.createElement("button");
      b.className = "ch" + (roundButtons ? " round" : "");
      const mine = [1, 2, 3, 4, 5, 6].filter(f => faces[f - 1] === i);
      b.innerHTML = `<b>${esc(name(o))}</b>${showFaces ? `<span class="faces" title="die: ${mine.join(", ")}">${mine.map(dieFace).join("")}</span>` : ""}`;
      b.addEventListener("click", () => choose && choose(i));
      choicesEl.appendChild(b);
      return b;
    });
    let wish = -1, byDie = false, face = 0;
    button(diceOn ? "THROW THE DIE" : "PICK ONE", null);
    pickFace = (f, die) => { if (faces[f - 1] >= 0) choose(faces[f - 1], die, f); };
    choose = (i, die, f) => {
      if (i >= options.length) return;
      wish = i; byDie = !!die; face = f || [1, 2, 3, 4, 5, 6].find(k => faces[k - 1] === i);
      btns.forEach((b, k) => b.classList.toggle("wish", k === i));
      if (onPick) onPick(i);
      button("ROLL", roll);
      if (byDie) {                                          // your roll is in: chance answers by itself
        const what = name(options[i]);                       // birth's options are just numbers: no need to say "4 → 4"
        msg(kicker, /^\d+$/.test(what) ? `You rolled <b>${face}</b>.` : `You rolled <b>${face}</b> → ${esc(low(what))}`, "Now chance rolls.");
        setTimeout(() => { if (action === roll) go.click(); }, 900);
      }
    };
    async function roll() {
      choose = null; pickFace = null; button("…", null);
      btns.forEach(b => b.disabled = true);
      if (onRoll) onRoll();
      const result = weighted(options);
      // chance's light runs along your choices while random.org answers, then stops on its pick
      const got = options.indexOf(await result), n = options.length, steps = n * 2 + got + (n < 4 ? n : 0);
      for (let s = 0; s <= steps; s++) {
        btns.forEach((b, k) => b.classList.toggle("on", k === s % n));
        await sleep(55 + Math.max(0, s - steps + 6) * 50);
      }
      btns.forEach((b, k) => { b.classList.remove("on"); b.classList.toggle("got", k === got); b.classList.toggle("dim", k !== got && k !== wish); });
      const res = { wish: options[wish], got: options[got], met: wish === got, byDie, face };
      if (onLand) onLand(res);
      resolve(res);
    }
  });
}
function wishLine(res, opts) {
  if (res.byDie) return res.met
    ? `You rolled <b>${res.face}</b> → <b>${esc(low(name(res.wish)))}</b>. Chance rolled the same. (${odds(res.got, opts)})`
    : `You rolled <b>${res.face}</b> → <b>${esc(low(name(res.wish)))}</b>. <span class="miss">Chance rolled <b>${esc(low(name(res.got)))}</b></span> (${odds(res.got, opts)}).`;
  return res.met
    ? `You wished for <b>${esc(low(name(res.wish)))}</b>, and got it. (${odds(res.got, opts)})`
    : `You wished for <b>${esc(low(name(res.wish)))}</b>. <span class="miss">Chance gave you <b>${esc(low(name(res.got)))}</b></span> (${odds(res.got, opts)}).`;
}

// ---------- the physical die ----------
// Your throw picks your option; random.org then rolls chance's. Buttons and number keys still work.
// Two readers, same events: dice_reader.py (OpenCV, its own window and camera) if it's running when the page
// opens, otherwise the in-browser reader set up on /dice.html.
let diceOn = false;
const diceEl = $("dice");
const diceStates = { waiting: "throw it", rolling: "rolling…", settling: "landing…", reading: "reading…", unclear: "can't read it, throw again", shown: "", off: "off" };
let diceSrc = "";                                           // "python" or "browser": shown on the chip
const chip = (html) => { diceEl.innerHTML = `DIE${diceSrc ? ` (${diceSrc})` : ""} · ${html}`; };
const diceEvents = {
  onState: (s) => {
    if (!diceOn) return;
    chip(s === "needs empty tray" ? '<a href="/dice.html">set up the empty tray</a>' : `<b>${diceStates[s] ?? s}</b>`);
  },
  onRoll: (n) => {
    chip(`<b>${n}</b>`);
    if (pickFace) pickFace(n, true);                         // a round is open: your throw is your wish
    else if (waiting && action) go.click();                 // between rounds: go on
  },
};
function diceReady(src) {
  diceOn = true; diceSrc = src; chip("<b>throw it</b>");
  if (choose && go.textContent === "PICK ONE") { subLine("Throw the die."); go.textContent = "THROW THE DIE"; }   // the first round was already up
}
function subLine(text) {                                    // set the small line under the message
  let sub = msgEl.querySelector(".sub");
  if (!sub) { sub = document.createElement("span"); sub.className = "sub"; msgEl.appendChild(sub); }
  sub.textContent = text;
}
// dice_reader.py always wins: the game keeps looking for it, and hands over to it the moment it appears.
let browserDice = null;
async function tryPython() {
  try {
    await createRemoteReader(diceEvents).start();
    if (browserDice) { browserDice.stop(); browserDice = null; }   // the browser stops watching the die
    diceReady("python");
    return true;
  } catch (e) { return false; }
}
(async () => {
  if (await tryPython()) return;
  const look = setInterval(async () => { if (await tryPython()) clearInterval(look); }, 3000);
  let cam = "";                                             // meanwhile: the browser reader, if one was set up on /dice.html
  try { cam = await findCamera("pac-dice-cam"); } catch (e) {}
  if (!cam) { diceEl.innerHTML = 'DIE · <a href="/dice.html">start dice_reader.py, or set up</a>'; return; }
  const dice = createDiceReader({ video: Object.assign(document.createElement("video"), { muted: true, playsInline: true }), ...diceEvents });
  try { await dice.start(cam); if (diceSrc !== "python") { browserDice = dice; diceReady("browser"); } else dice.stop(); }
  catch (e) { console.warn("[dice]", e.name, e.message); if (!diceOn) diceEl.innerHTML = 'DIE · <a href="/dice.html">camera not found</a>'; }
})();

// ---------- the run ----------
let r = {}, oddsAll = 1, attempts = 0, met = 0, asked = 0;

// ---------- 1. BIRTH (drawn, no generation) ----------
let mine = 0, winner = 0, raceAt = 0, phase = "pick";
async function birth() {
  r = {}; oddsAll = 1; attempts = 0; met = 0; asked = 0;
  setSteps(0);
  clearShow();
  live.setScene(drawBirth);
  const sperm = Array.from({ length: BIRTH.sperm }, (_, i) => ({ label: String(i + 1), w: 1 }));
  while (true) {
    phase = "pick"; mine = 0; winner = 0;
    attempts++;
    const res = await round({
      kicker: "1 · BIRTH" + (attempts > 1 ? ` · TRY ${attempts}` : ""),
      line: esc(BIRTH.intro), options: sperm, showFaces: false, roundButtons: true,
      onPick: (i) => { mine = i + 1; },
      onRoll: () => { phase = "race"; raceAt = performance.now(); },
      onLand: (res) => { winner = +res.got.label; phase = "result"; raceAt = performance.now(); },
    });
    if (res.met) break;
    msg("1 · BIRTH", esc(BIRTH.lost(winner)), (res.byDie ? `You rolled ${res.face}. ` : "") + `Your odds were 1 in ${BIRTH.sperm}.`);
    await waitFor("TRY AGAIN");
  }
  oddsAll *= 1 / BIRTH.sperm;
  msg("1 · BIRTH", esc(BIRTH.won), `After ${attempts} ${attempts === 1 ? "try" : "tries"}. Chance: ${source}.`);
  await waitFor("NEXT: BODY");
  body();
}
function drawBirth(g, W, H, now) {
  // H's sketch: the egg in the middle, the sperm around it, heads pointing in, tails trailing out
  const t = now / 1000;
  const cx = W * 0.5, cy = H * 0.47, er = H * 0.17;          // centred, a touch high to clear the message
  const bg = g.createRadialGradient(cx, cy, 10, cx, cy, W * 0.75);
  bg.addColorStop(0, "#f6c7c2"); bg.addColorStop(1, "#7a1f2b");
  g.fillStyle = bg; g.fillRect(0, 0, W, H);
  // the egg, with its nucleus
  const born = phase === "result" && winner === mine;
  const glow = born ? 0.5 + 0.5 * Math.sin((now - raceAt) / 120) : 0;
  g.fillStyle = `rgba(255,240,220,${0.22 + glow * 0.45})`; g.beginPath(); g.arc(cx, cy, er * 1.22, 0, 7); g.fill();
  g.fillStyle = "#fff4e6"; g.beginPath(); g.arc(cx, cy, er, 0, 7); g.fill();
  g.strokeStyle = "rgba(122,31,43,0.45)"; g.lineWidth = 2.5; g.stroke();
  g.strokeStyle = "rgba(122,31,43,0.18)"; g.lineWidth = 1; g.beginPath(); g.arc(cx, cy, er * 0.9, 0, 7); g.stroke();
  g.fillStyle = "#c98f8a"; g.beginPath(); g.arc(cx - er * 0.08, cy - er * 0.3, er * 0.16, 0, 7); g.fill();
  // the sperm, spread evenly around it (none straight above or below)
  const n = BIRTH.sperm, ring = er + H * 0.15, tail = H * 0.12;
  const big = look === "pixel" ? 1.5 : 1, hx = Math.max(7, H * 0.034) * big, hy = Math.max(5, H * 0.024) * big;
  for (let i = 1; i <= n; i++) {
    const a = -Math.PI / 2 + (Math.PI * 2 / n) * (i - 0.5);
    const ux = Math.cos(a), uy = Math.sin(a);                 // pointing out from the egg
    let d = ring + Math.sin(t * 2 + i * 1.7) * 3;              // a gentle idle drift
    if (phase === "race") d = ring - Math.min(1, (now - raceAt) / 1400) * H * 0.06 + Math.sin(t * 5 + i) * 3;
    if (phase === "result") {
      const k = Math.min(1, (now - raceAt) / 1600);
      if (i === winner) d = (ring - H * 0.06) + (er + hx * 0.6 - (ring - H * 0.06)) * k;   // the winner reaches the egg
      else { d = ring - H * 0.06 + k * H * 0.05; g.globalAlpha = 1 - k * 0.8; }          // the rest fall back
    }
    const x = cx + ux * d, y = cy + uy * d, sel = i === mine;
    // tail: trails outward, wriggling sideways
    g.strokeStyle = sel ? "#111" : "rgba(255,255,255,0.95)"; g.lineWidth = look === "pixel" ? (sel ? 6 : 5) : (sel ? 3 : 2); g.lineCap = "round";   // thicker so it survives the pixel filter
    g.beginPath();
    for (let s = 0; s <= 24; s++) {
      const along = hx + (s / 24) * tail, side = Math.sin(t * 9 + s * 0.5 + i) * (s * 0.3);
      const px = x + ux * along - uy * side, py = y + uy * along + ux * side;
      s ? g.lineTo(px, py) : g.moveTo(px, py);
    }
    g.stroke();
    // head, pointing at the egg, with its number
    g.save(); g.translate(x, y); g.rotate(a);
    g.fillStyle = sel ? "#111" : "#fff"; g.beginPath(); g.ellipse(0, 0, hx, hy, 0, 0, 7); g.fill();
    g.restore();
    g.fillStyle = sel ? "#fff" : "#7a1f2b"; g.font = `600 ${Math.round(hy * 1.15)}px system-ui, sans-serif`; g.textAlign = "center"; g.textBaseline = "middle";
    g.fillText(i, x, y + 1);
    g.globalAlpha = 1;
  }
}


// ---------- 2. BODY ----------
// your avatar appears as soon as the first trait lands, and fills in trait by trait
function bodyPrompt() {
  // while traits are still landing (the full prompt, once all are in, comes from stages.js)
  const b = r.body, hair = [b.hair && b.hair.p, b.curl && b.curl.p].filter(Boolean).join(" ");
  return [`a newborn ${b.sex ? b.sex.baby : "baby"}`, hair && `${hair} hair`, b.eyes && `${b.eyes.p} eyes`, "wrapped in a soft blanket", STYLE].filter(Boolean).join(", ");
}
async function body() {
  setSteps(1);
  live.setScene(null);
  stageStrength = BODY.strength;
  r.body = {};
  const nurseryBg = () => PROMPTS.body({ body: { sex: {}, hair: {}, curl: {}, eyes: {}, build: {} } }).background;
  show(() => ({ person: null, background: nurseryBg() }));
  for (const tr of BODY.traits) {
    const res = await round({ kicker: "2 · BODY · " + tr.name, line: esc(BODY.intro), options: tr.options });
    r.body[tr.key] = res.got; oddsAll *= res.got.w / total(tr.options); asked++; if (res.met) met++;
    msg("2 · BODY · " + tr.name, "", wishLine(res, tr.options));
    show(() => ({ person: bodyPrompt(), background: nurseryBg() }));
    await sleep(1600);
  }
  show(() => PROMPTS.body(r));
  msg("2 · BODY", "This is you, newborn.", `You got ${met} of ${asked} wishes.`);
  await waitFor("NEXT: HOME");
  home();
}

// ---------- 3. HOME ----------
async function home() {
  setSteps(2);
  stageStrength = HOME.strength;
  const res = await round({ kicker: "3 · HOME", line: esc(HOME.intro), options: HOME.options });
  r.home = res.got; oddsAll *= res.got.w / total(HOME.options); asked++; if (res.met) met++;
  show(() => PROMPTS.home(r));
  msg("3 · HOME", esc(r.home.label.toLowerCase().replace(/^./, c => c.toUpperCase())) + ".", wishLine(res, HOME.options) + "<br>" + r.home.privileges.map(esc).join(" · "));
  await waitFor("NEXT: WORLD");
  world();
}

// ---------- 4. WORLD ----------
async function world() {
  setSteps(3);
  stageStrength = WORLD.strength;
  const where = await round({ kicker: "4 · WORLD · WHERE", line: esc(WORLD.intro), options: WORLD.where });
  const [ci] = await draw(1, 1, where.got.cities.length);   // the city inside the region: pure chance, no wish
  const city = where.got.cities[ci - 1];
  asked++; if (where.met) met++;
  msg("4 · WORLD · WHERE", esc(city) + ".", wishLine(where, WORLD.where));
  await sleep(1800);
  const when = await round({ kicker: "4 · WORLD · WHEN", line: esc(WORLD.introWhen || "And when?"), options: WORLD.when });
  asked++; if (when.met) met++;
  r.world = { where: where.got, city, when: when.got };
  oddsAll *= (where.got.w / total(WORLD.where)) * (1 / where.got.cities.length) * (when.got.w / total(WORLD.when));
  show(() => PROMPTS.world(r));
  msg("4 · WORLD", `${esc(city)}, ${esc(low(r.world.when.label))}.`, wishLine(when, WORLD.when));
  await waitFor("WHO CHANCE MADE");
  summary();
}

// ---------- the baseline ----------
async function summary() {
  setSteps(4);
  choicesEl.innerHTML = "";
  const b = r.body;
  msgEl.hidden = false;
  msgEl.innerHTML = `<span class="kicker">THE BASELINE</span><span class="line">This is the start chance gave you.</span>
    <dl>
      <dt>BIRTH</dt><dd>born on try ${attempts}</dd>
      <dt>BODY</dt><dd>${esc(`${low(b.sex.label)} · ${low(b.hair.label)} ${low(b.curl.label)} hair · ${low(b.eyes.label)} eyes · ${low(b.build.label)}`)}</dd>
      <dt>HOME</dt><dd>${esc(low(r.home.label))}</dd>
      <dt>WORLD</dt><dd>${esc(r.world.city)}, ${esc(low(r.world.when.label))}</dd>
    </dl>
    <span class="sub">You got <b>${met} of ${asked}</b> wishes. Odds of this exact start: <b>1 in ${Math.round(1 / oddsAll).toLocaleString("en-IN")}</b>.</span>`;
  await waitFor("AGAIN");
  birth();
}

// ---------- status ----------
function status() {
  const st = live.stat;
  statusEl.innerHTML = !st.online ? "<b>server offline</b>"
    : [`<b>${st.fps}</b> fps`, source && `chance <b>${source}</b>`, st.note, st.seg].filter(Boolean).join(" · ");
  requestAnimationFrame(status);
}
status();
live.camera.catch(e => msg("NO CAMERA", esc(e.message || e.name)));
birth();                                                    // straight into birth
</script>
